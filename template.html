<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto-Boss</title>
<style>
/*FONTS*/
/* 1980s arcade cabinet: black, neon, pixel fonts, square corners, hard drop shadows, CRT scanlines
   over the stage. Layout: the arena (stage + the current screen's cards) beside the inventory on wide
   screens, stacked on phones. */
:root {
  --bg: #07040f; --surface: #120a24; --surface-2: #1b0f36; --line: #3b1d6b; --text: #efe8ff; --muted: #9b8cc4;
  --gold: #ffe14d; --gold-ink: #1a1000; --pink: #ff2bd6; --cyan: #29e7ff; --good: #39ff88; --bad: #ff3b5c; --purple: #c77dff;
  --r0: #c8c4d8; --r1: #39ff88; --r2: #29a8ff; --r3: #c77dff; --r4: #ffb020;
  --pixel: "Press Start 2P", "Courier New", monospace; --body: "VT323", "Courier New", monospace;
  color-scheme: dark;
  /* safe areas (notch, gesture bar): the Android app sets --safe-area-inset-*, browsers have env() */
  --sa-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); --sa-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  --sa-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)); --sa-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, var(--glow, #2a0b4a) 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text); font: 21px/1.15 var(--body); -webkit-font-smoothing: none; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.app { max-width: 1240px; margin: 0 auto; padding: max(14px, var(--sa-top)) max(16px, var(--sa-right)) 28px max(16px, var(--sa-left)); display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 26px/1 var(--pixel); color: var(--gold); letter-spacing: .04em; text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 #4a0e6b; }
.brand small { display: block; font-size: 9px; color: var(--cyan); text-shadow: none; letter-spacing: .2em; margin-top: 10px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 8px; background: #000; border: 3px solid var(--line); padding: 6px 10px; font: 11px/1 var(--pixel); }
.pill label { color: var(--muted); font-size: 8px; }
#menu { padding: 6px 10px; } body[data-fighting] #menu { opacity: .4; pointer-events: none; }
.pill.hp { border-color: var(--good); } .pill.sh { border-color: var(--cyan); color: var(--cyan); }
/* the stats panel and the green/red comparison under offered items */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-bottom: 8px; }
.stat { display: grid; grid-template-columns: 1fr auto; align-items: baseline; font: 18px/1.1 var(--body); }
.stat > span { color: var(--muted); } .stat b { font: 11px/1 var(--pixel); color: var(--text); text-align: right; }
.stat small { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
.up { color: var(--good); } .down { color: var(--bad); }
.cmp { grid-column: 1 / -1; font: 17px/1.15 var(--body); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.cmp small { color: var(--muted); font-size: 15px; } .pill.ot { border-color: var(--pink); color: var(--pink); } .pill.gold { border-color: var(--gold); color: var(--gold); }
.coin { width: 14px; height: 14px; flex: none; background: var(--gold); box-shadow: inset -2px -2px 0 #c99a00, inset 2px 2px 0 #fff8c0; display: inline-block; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.arena { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage { position: relative; overflow: hidden; border: 4px solid #000; outline: 3px solid var(--line); background: #000; aspect-ratio: 16 / 9;
  box-shadow: 0 0 0 7px #000, 0 0 40px rgba(255,43,214,.25); }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 80px rgba(0,0,0,.7); }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.result { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; pointer-events: none; }
.result b { font: 34px/1.1 var(--pixel); text-shadow: 4px 4px 0 #000, 0 0 20px currentColor; }
.result .win { color: var(--gold); } .result .loss { color: var(--bad); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.speed { display: inline-flex; border: 3px solid var(--line); }
.speed button { background: var(--surface); border: 0; padding: 8px 10px; cursor: pointer; font: 9px/1 var(--pixel); color: var(--muted); }
.speed button[aria-pressed="true"] { background: var(--pink); color: #fff; }
#sound[aria-pressed="false"] { color: var(--muted); }

.btn { border: 3px solid var(--line); background: var(--surface-2); padding: 9px 12px; cursor: pointer; font: 10px/1.2 var(--pixel); box-shadow: 3px 3px 0 #000; text-transform: uppercase; }
.btn:hover:not(:disabled) { border-color: var(--cyan); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: #fff8c0; box-shadow: 4px 4px 0 var(--pink); }
.btn.big { padding: 14px 24px; font-size: 15px; }

.card { background: var(--surface); border: 3px solid var(--line); box-shadow: 5px 5px 0 #000; padding: 14px; }
.card h2 { margin: 0 0 10px; font: 14px/1.3 var(--pixel); color: var(--gold); }
.card h3 { margin: 0 0 8px; font: 10px/1.3 var(--pixel); color: var(--cyan); }
.card p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.icon { width: 32px; height: 32px; image-rendering: pixelated; display: block; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 2px solid var(--line); background: #000; font-size: 17px; line-height: 1; white-space: nowrap; }
.chip.weak { border-color: var(--good); color: var(--good); } .chip.resist { border-color: var(--bad); color: var(--bad); }
.chip.trait { border-color: var(--purple); color: #e2c4ff; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.say { border-left: 3px solid var(--pink); padding-left: 10px; color: #ffd6f4; }

/* pickers: weapon slots, targeting, choices */
.pick { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 10px; align-items: center; align-content: start; text-align: left; background: var(--surface-2); border: 3px solid var(--line); padding: 8px; cursor: pointer; box-shadow: 3px 3px 0 #000; width: 100%; }
.pick .icon { grid-row: 1 / span 2; }
.pick b { font: 9px/1.4 var(--pixel); font-weight: 400; }
.pick small { color: var(--muted); font-size: 17px; line-height: 1; }
.pick[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,225,77,.4), 3px 3px 0 #000; }
.pick:hover:not(:disabled) { border-color: var(--cyan); }
.pick:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 3px solid var(--line); flex-wrap: wrap; }
.seg button { background: var(--surface); border: 0; padding: 8px 10px; cursor: pointer; font: 9px/1 var(--pixel); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--cyan); color: #000; }

/* enemy cards on the pre-fight screen */
.foes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.foe { background: var(--surface-2); border: 3px solid var(--line); padding: 8px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 4px 10px; }
.foe img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; grid-row: 1 / span 3; background: #000; }
.foe b { font: 9px/1.4 var(--pixel); font-weight: 400; }
.foe.elite { border-color: #ffb020; } .foe.boss { border-color: var(--pink); }
.foe .moves { grid-column: 1 / -1; color: var(--muted); font-size: 17px; }

/* the run map: boss at the top; links drawn in an SVG behind absolutely placed node buttons */
.map { position: relative; margin: 6px 4px 0; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; width: 40px; height: 40px; transform: translate(-50%, -50%); background: #000; border: 3px solid var(--line); display: grid; place-items: center; padding: 0; cursor: pointer; box-shadow: 3px 3px 0 #000; }
.node img { width: 26px; height: 26px; image-rendering: pixelated; }
.node.boss { width: 56px; height: 56px; border-color: var(--pink); } .node.boss img { width: 46px; height: 46px; object-fit: contain; }
.node.elite { border-color: #ffb020; width: 46px; height: 46px; } .node.elite img { width: 38px; height: 38px; object-fit: contain; }
.node.open { border-color: var(--cyan); box-shadow: 0 0 14px rgba(41,231,255,.7), 3px 3px 0 #000; animation: pulse 1s steps(2) infinite; }
.node.here { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,225,77,.7); }
.node.done { opacity: .55; border-color: var(--gold); }
.node.ahead { opacity: .8; cursor: default; }
.node.gone { opacity: .25; filter: grayscale(1); cursor: default; }
.map.tracing .node:not(.trace):not(.here) { opacity: .2; }
.map.tracing .node.trace { opacity: 1; filter: none; border-color: #fff; }
.map.tracing line:not(.trace) { opacity: .25; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.1); } }
body[data-screen="map"] .stage, body[data-screen="map"] .controls, body[data-screen="event"] .stage, body[data-screen="event"] .controls,
body[data-screen="gamble"] .stage, body[data-screen="gamble"] .controls,
body[data-screen="shop"] .stage, body[data-screen="shop"] .controls, body[data-screen="rest"] .stage, body[data-screen="rest"] .controls,
body[data-screen="treasure"] .stage, body[data-screen="treasure"] .controls, body[data-screen="merchant"] .stage, body[data-screen="merchant"] .controls { display: none; }

/* item cards, coloured by rarity */
.item { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 0 10px; align-items: start; align-content: start; text-align: left; background: var(--surface-2); border: 3px solid var(--line); padding: 8px; box-shadow: 3px 3px 0 #000; width: 100%; }
button.item { cursor: pointer; } button.item:hover:not(:disabled) { outline: 2px solid var(--cyan); } button.item:disabled { opacity: .45; cursor: default; }
.item .icon { grid-row: 1 / span 2; }
.item b { font: 9px/1.4 var(--pixel); font-weight: 400; }
.item small { color: var(--muted); font-size: 17px; line-height: 1; }
.item ul { grid-column: 1 / -1; margin: 6px 0 0; padding: 0 0 0 16px; font-size: 18px; line-height: 1.05; }
.item li.leg { color: var(--r4); list-style: none; margin-left: -16px; }
.item li.star { color: var(--gold); list-style: none; margin-left: -16px; }
.item.starred { box-shadow: 0 0 10px rgba(255,225,77,.45), 3px 3px 0 #000; }

/* map styles (cosmetic): the links' colours and the map's backdrop */
.map .l-done { stroke: #ffe14d; } .map .l-open { stroke: #29e7ff; } .map .l-ahead { stroke: #9b8cc4; } .map .l-off { stroke: #3b1d6b; opacity: .6; }
.map.tracing line.trace { stroke: #ffffff; stroke-width: 4px; stroke-dasharray: none; opacity: 1; }
.map.style-blueprint { background: #0a2a5a repeating-linear-gradient(0deg, transparent 0 19px, rgba(255,255,255,.12) 19px 20px), repeating-linear-gradient(90deg, transparent 0 19px, rgba(255,255,255,.12) 19px 20px); }
.map.style-blueprint .l-done { stroke: #ffffff; } .map.style-blueprint .l-open { stroke: #9fe8ff; } .map.style-blueprint .l-ahead { stroke: #c8d8f0; } .map.style-blueprint .l-off { stroke: #5a7ab0; }
.map.style-blueprint .node { background: #0a2a5a; border-color: #9fe8ff; }
.map.style-treasure { background: #e8d8a8; box-shadow: inset 0 0 40px #b0904a; }
.map.style-treasure .l-done { stroke: #ff3b5c; } .map.style-treasure .l-open { stroke: #6b4226; } .map.style-treasure .l-ahead { stroke: #8b5a2b; } .map.style-treasure .l-off { stroke: #b0904a; } .map.style-treasure.tracing line.trace { stroke: #1a1000; }
.map.style-treasure.tracing .node.trace { border-color: #1a1000; }
.map.style-treasure .node { background: #f4e8c0; border-color: #8b5a2b; }
.map.style-neon { background: #05010c; }
.map.style-neon .l-done { stroke: #ff2bd6; } .map.style-neon .l-open { stroke: #39ff88; } .map.style-neon .l-ahead { stroke: #c77dff; } .map.style-neon .l-off { stroke: #29e7ff; opacity: .2; }
.map.style-neon .node { box-shadow: 0 0 10px #ff2bd6, 3px 3px 0 #000; }

/* event pictures: one fixed pixel scene per event, above its text */
.scene { display: block; width: 100%; max-width: 640px; aspect-ratio: 2 / 1; image-rendering: pixelated; border: 3px solid #000; outline: 2px solid var(--line); margin: 0 0 12px; }

/* lifetime stats, save codes and the cosmetics shop */
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
.statgrid div { background: var(--surface-2); border: 3px solid var(--line); padding: 8px; display: grid; gap: 4px; }
.statgrid label { font: 8px/1 var(--pixel); color: var(--cyan); }
.statgrid b { font: 16px/1 var(--pixel); color: var(--gold); font-weight: 400; }
.statgrid small { color: var(--muted); font-size: 16px; }
.kills { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.kill { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface-2); border: 2px solid var(--line); padding: 4px 8px 4px 4px; }
.kill img { width: 32px; height: 32px; image-rendering: pixelated; object-fit: contain; background: #000; }
.kill b { font: 10px/1 var(--pixel); color: var(--gold); font-weight: 400; }
.code { width: 100%; min-height: 70px; font: 15px/1.2 monospace; background: #000; color: var(--good); border: 2px solid var(--line); padding: 6px; word-break: break-all; resize: vertical; margin-bottom: 8px; }
.item.cos { grid-template-columns: 84px minmax(0, 1fr); }
.item.cos.on { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,225,77,.45), 3px 3px 0 #000; }
.swatch { grid-row: 1 / span 2; display: flex; flex-wrap: wrap; gap: 2px; width: 84px; }
.swatch i { width: 14px; height: 14px; border: 1px solid #000; display: block; }
.swatch em { font: 7px/1.3 var(--pixel); color: var(--gold); font-style: normal; overflow-wrap: anywhere; }
.swatch i.mapsw { width: 60px; height: 28px; background: #120a24; border: 2px solid var(--line); }
.swatch i.mapsw.style-blueprint { background: #0a2a5a; border-color: #9fe8ff; }
.swatch i.mapsw.style-treasure { background: #e8d8a8; border-color: #8b5a2b; }
.swatch i.mapsw.style-neon { background: #05010c; border-color: #ff2bd6; box-shadow: 0 0 8px #ff2bd6; }
body[data-screen="stats"] .controls, body[data-screen="cosmetics"] .controls { display: none; }

/* the pre-fight bar directly under the arena: targeting, FIGHT!, HP. The button never shrinks; the
   targeting buttons wrap on a phone */
.fightbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 3px solid var(--line); box-shadow: 4px 4px 0 #000; padding: 8px 10px; }
.fightbar .seg { flex: 1 1 auto; }
.fightbar .seg button { flex: 1 1 auto; }
.fightbar .go { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: 0 0 auto; }
.fightbar .btn.big { min-height: 48px; }
.fightbar label { font: 8px/1 var(--pixel); color: var(--cyan); }
.item .price { grid-column: 1 / -1; margin-top: 6px; font: 9px/1 var(--pixel); color: var(--gold); display: flex; align-items: center; gap: 6px; }
.item.empty { opacity: .45; box-shadow: none; }
/* cards: an item card with a type-coloured top edge */
.item.cardi { border-top-width: 6px; }
.item.cardi.t-boost { border-top-color: var(--good); } .item.cardi.t-pact { border-top-color: #ffb020; } .item.cardi.t-trigger { border-top-color: var(--gold); }
.item.cardi.t-summon { border-top-color: var(--cyan); } .item.cardi.t-multiplier { border-top-color: var(--pink); }
.item.cardi.t-oneuse { border-top-color: #ff9a3a; } .item.cardi.t-cursed { border-top-color: #9b4dff; background: #1a0a26; }
/* the collection: cards switched off are dimmed; one-use cards carry a USE button */
.item.cardi.off { opacity: .6; } .item.cardi.off:hover { opacity: .9; }
.item .price.on { color: var(--good); }
.item .use { grid-column: 1 / -1; margin-top: 6px; justify-self: start; padding: 6px 10px; font-size: 9px; }
#boardCard h4, .card h4 { font: 9px/1 var(--pixel); color: var(--muted); margin: 12px 0 6px; }
/* shop tabs and weapon tuning */
.seg.tabs { display: flex; flex-wrap: nowrap; width: 100%; margin-bottom: 4px; } .seg.tabs button { flex: 1 1 0; min-width: 0; padding: 8px 4px; font-size: 8px; line-height: 1.4; }
.seg.tabs small { color: var(--gold); font-size: 9px; } .seg.tabs button[aria-pressed="true"] small { color: #000; }
.tune { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tune .btn { padding: 7px 8px; font-size: 8px; } .tune small { font-size: 8px; }
.item.buy { border-color: var(--cyan); }
/* the class screen: kits, and classes still to unlock */
.pick .kit { color: var(--cyan); } .pick .lock { color: var(--gold); }
/* the cosmetics shop's try-on */
.tryon { border-color: var(--gold); } .tryon .row { align-items: center; gap: 10px; }
.item.cos.trying { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,225,77,.4), 3px 3px 0 #000; }
.minimap { margin-top: 10px; max-width: 260px; }
.pick.locked { opacity: .55; } .pick.locked img { filter: grayscale(1); }
/* the gamble node */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.game { border: 3px solid var(--line); background: var(--surface-2); padding: 10px; }
.game h3 { margin: 0 0 6px; } .game p { margin: 0 0 8px; }
.odds { color: var(--gold); font-size: 18px; }
.gresult { font: 11px/1.4 var(--pixel); margin: 8px 0 12px; }
.ladder { margin: 0 0 8px; padding-left: 22px; font-size: 18px; color: var(--muted); }
.ladder .up { color: var(--good); } .ladder .now { color: var(--text); }
.item li.note { list-style: none; margin-left: -16px; color: var(--cyan); }
.sets { display: flex; flex-wrap: wrap; gap: 4px; }
.item.ench { border-color: var(--purple); border-top-color: var(--purple); }
.foe.enchanted { box-shadow: 0 0 12px rgba(199,125,255,.55); }
.ench-badge { position: absolute; top: -8px; right: -8px; min-width: 16px; height: 16px; background: var(--purple); color: #000; font: 8px/16px var(--pixel); text-align: center; border: 2px solid #000; }
.item.r0 { border-color: #5a5470; } .item.r0 b { color: var(--r0); }
.item.r1 { border-color: var(--r1); } .item.r1 b { color: var(--r1); }
.item.r2 { border-color: var(--r2); } .item.r2 b { color: var(--r2); }
.item.r3 { border-color: var(--r3); } .item.r3 b { color: var(--r3); }
.item.r4 { border-color: var(--r4); box-shadow: 0 0 12px rgba(255,176,32,.5), 3px 3px 0 #000; } .item.r4 b { color: var(--r4); }
body[data-screen="reward"] .stage, body[data-screen="reward"] .controls, body[data-screen="replace"] .stage, body[data-screen="replace"] .controls { display: none; }

.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 14px; }
.lab label { display: grid; gap: 4px; font: 8px/1 var(--pixel); color: var(--muted); }
.lab select, .lab input { font: 18px var(--body); background: #000; color: var(--text); border: 2px solid var(--line); padding: 4px 6px; }
.log { font-size: 18px; max-height: 260px; overflow: auto; white-space: pre-wrap; background: #000; border: 2px solid var(--line); padding: 6px 8px; }

/* phones: the inventory and card board become a sheet that the dock's BAG and CARDS buttons open */
.dock, .scrim, .sheet-head { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(84px + var(--sa-bottom)); transform: translateX(-50%); z-index: 40; max-width: min(92vw, 420px);
  background: #000; border: 3px solid var(--purple); box-shadow: 4px 4px 0 #000; padding: 8px 12px; font-size: 19px; pointer-events: none; }
@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  body[data-dock] .app { padding-bottom: calc(84px + var(--sa-bottom)); }
  body[data-dock] .dock { display: flex; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #000; border-top: 3px solid var(--line);
    padding: 8px max(12px, var(--sa-right)) calc(8px + var(--sa-bottom)) max(12px, var(--sa-left)); }
  .dock .btn { flex: 1; min-height: 50px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .dock .btn small { font: 16px/1 var(--body); color: var(--muted); text-transform: none; }
  .dock .btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  body[data-dock] .side { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 20; max-height: 80vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg); border-top: 3px solid var(--pink); box-shadow: 0 -10px 30px rgba(0,0,0,.7);
    padding: 12px max(12px, var(--sa-right)) calc(80px + var(--sa-bottom)) max(12px, var(--sa-left));
    transform: translateY(105%); transition: transform .18s steps(4); visibility: hidden; }
  body[data-drawer] .side { transform: none; visibility: visible; }
  body[data-drawer="inv"] #boardCard, body[data-drawer="board"] #invCard { display: none; }
  body[data-dock] .sheet-head { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -12px; z-index: 1; background: var(--bg); padding: 4px 0 8px; margin-top: -4px; }
  .sheet-head b { font: 11px/1 var(--pixel); color: var(--gold); font-weight: 400; }
  body[data-drawer] .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(5,1,12,.7); }
  /* empty slots shrink to a two-column grid in the sheet */
  body[data-dock] .side .stack { grid-template-columns: 1fr 1fr; }
  body[data-dock] .side .stack > :not(.item.empty) { grid-column: 1 / -1; }
  body[data-dock] .side .item.empty { padding: 6px; }
  body[data-dock] .side .item.empty .icon { display: none; }
  body[data-dock] .side .item.empty { grid-template-columns: minmax(0, 1fr); }
}
@media (pointer: coarse) {
  .btn, .seg button, .speed button { min-height: 44px; }
