/* 1980s arcade cabinet: black, neon, pixel fonts, square corners, hard drop shadows, CRT scanlines
   over the stage. Layout: the arena (stage + the current screen's cards) beside the inventory on wide
   screens, stacked on phones. */
:root {
  --bg: #07040f; --surface: #120a24; --surface-2: #1b0f36; --line: #3b1d6b; --text: #efe8ff; --muted: #9b8cc4;
  --gold: #ffe14d; --gold-ink: #1a1000; --pink: #ff2bd6; --cyan: #29e7ff; --good: #39ff88; --bad: #ff3b5c; --purple: #c77dff;
  --r0: #c8c4d8; --r1: #39ff88; --r2: #29a8ff; --r3: #c77dff; --r4: #ffb020;
  --pixel: "Press Start 2P", "Courier New", monospace; --body: "VT323", "Courier New", monospace;
  color-scheme: dark;
  /* safe areas (notch, gesture bar): the Android app sets --safe-area-inset-*, browsers have env() */
  --sa-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); --sa-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  --sa-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)); --sa-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, var(--glow, #2a0b4a) 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text); font: 21px/1.15 var(--body); -webkit-font-smoothing: none; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.app { max-width: 1240px; margin: 0 auto; padding: max(14px, var(--sa-top)) max(16px, var(--sa-right)) 28px max(16px, var(--sa-left)); display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 26px/1 var(--pixel); color: var(--gold); letter-spacing: .04em; text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 #4a0e6b; }
.brand small { display: block; font-size: 9px; color: var(--cyan); text-shadow: none; letter-spacing: .2em; margin-top: 10px; }

/* the stats panel and the green/red comparison under offered items */

  box-shadow: 0 0 0 7px #000, 0 0 40px rgba(255,43,214,.25); }

/* pickers: weapon slots, targeting, choices */
.pick { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 10px; align-items: center; align-content: start; text-align: left; background: var(--surface-2); border: 3px solid var(--line); padding: 8px; cursor: pointer; box-shadow: 3px 3px 0 #000; width: 100%; }

body[data-screen="map"] .stage, body[data-screen="map"] .controls, body[data-screen="event"] .stage, body[data-screen="event"] .controls,
body[data-screen="gamble"] .stage, body[data-screen="gamble"] .controls,

.item { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 0 10px; align-items: start; align-content: start; text-align: left; background: var(--surface-2); border: 3px solid var(--line); padding: 8px; box-shadow: 3px 3px 0 #000; width: 100%; }

/* map styles (cosmetic): the links' colours and the map's backdrop */
.map .l-done { stroke: #ffe14d; } .map .l-open { stroke: #29e7ff; } .map .l-ahead { stroke: #9b8cc4; } .map .l-off { stroke: #3b1d6b; opacity: .6; }

.map.style-blueprint { background: #0a2a5a repeating-linear-gradient(0deg, transparent 0 19px, rgba(255,255,255,.12) 19px 20px), repeating-linear-gradient(90deg, transparent 0 19px, rgba(255,255,255,.12) 19px 20px); }
.map.style-blueprint .l-done { stroke: #ffffff; } .map.style-blueprint .l-open { stroke: #9fe8ff; } .map.style-blueprint .l-ahead { stroke: #c8d8f0; } .map.style-blueprint .l-off { stroke: #5a7ab0; }

/* phones: the inventory and card board become a sheet that the dock's BAG and CARDS buttons open */
.dock, .scrim, .sheet-head { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(84px + var(--sa-bottom)); transform: translateX(-50%); z-index: 40; max-width: min(92vw, 420px);
  background: #000; border: 3px solid var(--purple); box-shadow: 4px 4px 0 #000; padding: 8px 12px; font-size: 19px; pointer-events: none; }

  .dock .btn small { font: 16px/1 var(--body); color: var(--muted); text-transform: none; }

    padding: 12px max(12px, var(--sa-right)) calc(80px + var(--sa-bottom)) max(12px, var(--sa-left));

<body>
<div class="app">
  <header class="top">
    <div class="brand">AUTO-BOSS<small>BRAINROT ARCADE · 1986</small></div>
    <div class="status" id="status"></div>
  </header>
  <main>
    <section class="arena">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="result" id="result" hidden></div>
      </div>
      <div class="fightbar" id="fightbar" hidden></div>
      <div class="controls" id="controls">
        <div class="speed" id="speed" role="group" aria-label="Fight speed">
          <button data-speed="1">1X</button><button data-speed="2">2X</button><button data-speed="4">4X</button>
        </div>
        <button class="btn" id="sound">SOUND ON</button>
      </div>
      <div id="screen" class="stack"></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<nav class="dock" id="dock" aria-label="Inventory"></nav>
<div class="toast" id="toast" hidden></div>
<script>
// Auto-Boss rules: seeded rng, damage types, weapons and the fight engine (groups of enemies,
// traits, move sets, phases). Shared by the game and balance.js, so both run the same numbers.
// Fights are fully automatic: step(f, dt) advances one and returns events for render.js and sfx.js.

// Seedable rng (mulberry32). The state is one integer, so runs can be saved and resumed exactly.
function makeRng(seed, state) {
  const r = { s: state != null ? state : (seed >>> 0) };
  r.next = () => {
    let t = (r.s = (r.s + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = n => Math.floor(r.next() * n);
  r.pick = a => a[r.int(a.length)];
  r.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = r.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return r;
}

const DAMAGE_TYPES = {
  slash: { name: 'Slash', color: '#e6eaf2' },
  blunt: { name: 'Blunt', color: '#ff8a5a' },
  pierce: { name: 'Pierce', color: '#ffe14d' },
  magic: { name: 'Magic', color: '#c77dff' },
  sonic: { name: 'Sonic', color: '#29e7ff' },
  explosive: { name: 'Explosive', color: '#ff3b5c' },
  fire: { name: 'Fire', color: '#ff7a2a' },
  cold: { name: 'Cold', color: '#9fe8ff' },
};

const TRAITS = {
  armour: { name: 'Armoured', tip: v => 'Blocks ' + v + ' damage from every hit. Fast, weak hits barely scratch it, though bullets and blades wear it down.' },
  evasive: { name: 'Evasive', tip: v => pct(v) + ' chance to dodge. Slow, heavy hits miss the most.' },
  flying: { name: 'Flying', tip: () => 'Slash and blunt deal half damage. Rockets often miss, though the blast still clips for half.' },
  shield: { name: 'Shielded', tip: v => 'Starts with a shield of ' + pct(v) + ' of its HP. Magic and sonic hit shields twice as hard.' },
  regen: { name: 'Regenerates', tip: v => 'Heals ' + pct(v) + ' of its HP per second. Needs burst.' },
  summoner: { name: 'Summoner', tip: () => 'Calls in more enemies. Area damage helps.' },
  backline: { name: 'Back row', tip: () => 'Stays behind the others. Single-target hits can\'t reach it while anything stands in front: the Boomerang, area and splash can.' },
};

// Each weapon is the best answer to something and a bad answer to something else; none is an
// upgrade over another. acc scales the enemy's dodge chance (fast weapons are hard to dodge).
const WEAPONS = [
  { id: 'sword', name: 'Sword', type: 'slash', shape: 'single', dmg: 14, aps: 1.0, acc: 1, perks: { focus: { per: 0.15, max: 4 }, wound: 0.5, sunder: 0.023 },
    blurb: 'Locks onto one enemy until it falls: every hit on it cuts 15% deeper, up to +60%. Cuts halve healing for 4s and crack armour.' },
  { id: 'gloves', name: 'Boxing Gloves', type: 'blunt', shape: 'single', dmg: 6.5, aps: 2.4, acc: 0.6, perks: { interrupt: 3, stun: { chance: 0.1, time: 1.2, immune: 2.5 } },
    blurb: 'Fast jabs, hard to dodge. Each has a 10% chance to stun for 1.2s (less on bosses), and 3 hits during a wind-up cancel it.' },
  { id: 'uzi', name: 'Uzi', type: 'pierce', shape: 'single', dmg: 3, aps: 5.5, acc: 0.35, perks: { chip: 0.45, sunder: 0.055 },
    blurb: 'Bullet spray. Shreds flyers and dodgers; armour eats most of every bullet, but each one wears it down.' },
  { id: 'wand', name: 'Magic Wand', type: 'magic', shape: 'single', dmg: 30, aps: 0.5, acc: 1.1, perks: { ignoreArmour: true, spell: { chance: 0.3 } },
    blurb: 'Slow, heavy bolts that ignore armour, and sometimes a spell: a toad for 3s, a shrink to half damage, or a bolt that chains on. Big enemies and bosses resist spells.' },
  { id: 'guitar', name: 'Electric Guitar', type: 'sonic', shape: 'area', dmg: 5.5, aps: 0.9, acc: 1, perks: { heal: 0.2, resonate: 0.75, wound: 0.71, bigOnly: true },
    blurb: 'Hits every enemy at once. Heals you for 20% of damage dealt. Rattles big enemies through their armour and healing.' },
  { id: 'bazooka', name: 'Bazooka', type: 'explosive', shape: 'blast', dmg: 26, aps: 0.3, acc: 1.4, perks: { flyMiss: 0.3, nearMiss: 0.5 },
    blurb: 'Slow, but every rocket blows up the whole enemy line. Often misses flyers, but the blast still clips them.' },
  { id: 'stars', name: 'Ninja Stars', type: 'slash', shape: 'single', dmg: 4.6, aps: 3.0, acc: 0.5, perks: { chip: 0.5, hero: { dodge: 0.12 } },
    blurb: 'A flurry of throwing stars, hard to dodge, that slip between armour plates. While you hold them you dodge 12% more.' },
  // Act 2 weapons, each with a new verb: burn, chill and freeze, reach, the long shot.
  { id: 'flamer', act: 2, name: 'Flamethrower', type: 'fire', shape: 'single', dmg: 1.6, aps: 5, acc: 0.8, perks: { burn: { dps: 5, time: 3 } },
    blurb: 'A stream of fire. Sets the target burning for 3s: the burn ignores armour and stops all healing while it lasts.' },
  { id: 'freeze', act: 2, name: 'Freeze Ray', type: 'cold', shape: 'single', dmg: 8, aps: 1.2, acc: 1, perks: { chill: { slow: 0.15, stacks: 3, time: 2.5 }, freeze: 0.9 },
    blurb: 'Every hit chills: the target attacks and acts 15% slower per stack, up to 45%. A hit during a wind-up freezes the wind-up in place.' },
  { id: 'boomerang', act: 2, name: 'Boomerang', type: 'slash', shape: 'boomerang', dmg: 10, aps: 0.85, acc: 0.9, perks: { reach: true, hitsFlyers: true },
    blurb: 'Hits the target on the way out and the back row on the way back. Flyers can\'t dodge its arc.' },
  { id: 'sniper', act: 2, name: 'Sniper Rifle', type: 'pierce', shape: 'single', dmg: 62, aps: 0.25, acc: 0.25, perks: { snipe: true, hero: { crit: 0.15, critx: 1 } },
    blurb: 'One huge shot every 4 seconds that can pick off anyone, back row included. While you hold it: +15% crit chance and +1× crit damage.' },
];
// A weapon's bonuses to the hero who holds it (perks.hero: dodge, crit, critx).
function weaponHero(h) {
  const p = (h.weapon.perks || {}).hero;
  if (p) { h.dodge = Math.min(0.6, h.dodge + (p.dodge || 0)); h.crit += p.crit || 0; h.critx += p.critx || 0; }
  return h;
}
// Wand spells: what each does, and how likely each is once a spell goes off.
// A boss's phase change stops the fight for a moment: both sides hold while the arena shows it.
const PHASE_PAUSE = 1.2;
const SPELLS = { toad: { weight: 0.4, time: 3 }, shrink: { weight: 0.3, time: 5, dmg: 0.5 }, chain: { weight: 0.3, share: 0.6 } };
const weaponById = id => WEAPONS.find(w => w.id === id);
// Weapons that can turn up in an act: the act 2 weapons arrive with zone 2.
const weaponsFor = act => WEAPONS.filter(w => (w.act || 1) <= (act || 1));

const MAX_ENEMIES = 5;
const MAX_ALLIES = 5;        // summons from cards.js
const ARMOUR_FLOOR = 0.3;   // a hit through armour keeps at least this share: wrong weapons hurt, they don't wall
const SUDDEN_DEATH = 60;     // seconds; after this enemies hit harder every second
const TIME_LIMIT = 120;      // a fight still going at this point is lost
const BASE_HERO = { maxHp: 100, armour: 0, dodge: 0.05, crit: 0.05, critx: 2, regen: 0, shield: 0 };
// The hero's armour is a shield bar over the HP bar: each point is armourShield HP of shield that
// soaks damage first and refills at the start of every fight.
const HERO_TUNE = { armourShield: 30 };
const armourHp = v => Math.round(v * HERO_TUNE.armourShield);     // what an armour value is worth, for texts
const heroShield = h => (h.shield || 0) + (h.armour || 0) * HERO_TUNE.armourShield;

function pct(x) { return Math.round(x * 1000) / 10 + '%'; }

const SUFFIX = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.round(n));
  const e = Math.min(SUFFIX.length - 1, Math.floor(Math.log10(n) / 3)), v = n / Math.pow(1000, e);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + SUFFIX[e];
}

function newMods() {
  return { dmg: 1, vs: {}, pierce: 0, cleave: 0, aps: 1, lifesteal: 0, thorns: 0, taken: 1, allHit: false, alwaysCrit: false };
}
// A hero with no items: what the debug lab and the balance matrix start from.
function baseHero(weaponId, target) {
  return weaponHero({ ...BASE_HERO, hp: BASE_HERO.maxHp, weapon: { ...weaponById(weaponId) }, target: target || 'front', mods: newMods() });
}

function spawnEnemy(def) {
  const hk = def.hooks || {};
  const e = {
    def, id: def.id, hp: def.hp, maxHp: def.hp, alive: true, phase: 0, atkMult: hk.hype || 1, dodgeT: 0,
    traits: { ...def.traits }, weak: { ...def.weak }, resist: { ...def.resist },
    shield: def.traits && def.traits.shield ? def.traits.shield * def.hp : 0,
    atkCd: def.interval * 0.8, moves: (def.moves || []).map(m => ({ ...m, cd: m.first != null ? m.first : m.every })),
    windup: null, windupHits: 0, burst: null, woundT: 0, wound: 0,
    // enchantment state (zones.js ENCHANTMENTS): grown armour, melting armour, magic taken for the encore
    grown: 0, growT: hk.grow ? hk.grow.every : 0, melt: hk.melt ? hk.melt.start : 0, meltT: hk.melt ? hk.melt.every : 0, magicTaken: 0, encored: false, raged: false, hypeOff: false,
  };
  if (hk.melt) e.traits.armour = (e.traits.armour || 0) + hk.melt.start;
  return e;
}

// hero: from baseHero() or compileHero() in items.js. defs: enemy definitions from zones.js.
function newFight(hero, defs, rng) {
  const h = { ...hero, mods: { ...newMods(), ...hero.mods }, hp: Math.min(hero.hp, hero.maxHp) };
  h.shieldMax = heroShield(h); h.shieldHp = h.shieldMax * (h.mods.shieldStart || 1);     // the Fortress and the Tidecaller start it half full
  h.lives = (h.mods.lives || []).slice(); h.crackN = 0;
  // the Stopwatch: the first attack comes at once
  const f = { t: 0, rng: rng || Math.random, hero: h, enemies: defs.map(spawnEnemy), atkCd: (h.mods.ambush ? 0 : 0.6) + (h.delay || 0), target: -1, done: false, won: false, dealt: 0, cause: '', low: h.hp / h.maxHp,
    allies: [], buffs: [], gold: 0, started: false, revived: [], shots: 0, critGold: 0 };
  // card triggers (cards.js compiles them onto hero.cards); timers and cooldowns scale by trigCd
  const C = h.cards, k = C ? C.trigCd : 1;
  f.trig = C ? C.triggers.map(t => ({ ...t, cdLeft: 0, fired: false, next: (t.first != null ? t.first : t.every || 0) * k })) : [];
  return f;
}

// Enemies in the order they stand: small ones in front (index order), big ones behind, the back row last.
const rank = e => (e.traits.backline ? 2 : 0) + (e.def.size === 'big' ? 1 : 0);
function formation(f) {
  return f.enemies.map((e, i) => i).filter(i => f.enemies[i].alive)
    .sort((a, b) => rank(f.enemies[a]) - rank(f.enemies[b]) || a - b);
}
// Who a single-target weapon can pick: the back row only once nothing stands in front of it.
function inReach(f) {
  const order = formation(f), front = order.filter(i => !f.enemies[i].traits.backline);
  return front.length ? front : order;
}

function threat(e) { return e.def.atk * e.atkMult / e.def.interval + (e.windup ? 1000 : 0) + (e.moves.some(m => m.kind === 'summon') ? 5 : 0); }

function pickTarget(f) {
  const perks = f.hero.weapon.perks || {}, order = perks.snipe ? formation(f) : inReach(f), p = f.hero.target, E = f.enemies;
  if (!order.length) return -1;
  if (perks.focus && f.focus && order.includes(f.focus.target)) return f.focus.target;      // the sword stays on its enemy
  if (f.hero.mods.lockOn && f.lock != null && order.includes(f.lock)) return f.lock;          // Eagle-Eye Shades lock on
  if (p === 'lowest') return order.reduce((a, b) => E[b].hp + E[b].shield < E[a].hp + E[a].shield ? b : a);
  if (p === 'threat') return order.reduce((a, b) => threat(E[b]) > threat(E[a]) ? b : a);
  return order[0];
}

// Who a swing at enemy t also hits, with the share of damage each takes.
function attackTargets(f, t) {
  const h = f.hero, w = h.weapon, order = formation(f);
  if (w.shape === 'area' || w.shape === 'blast') return order.map(i => [i, 1]);
  if (h.mods.allHit) return [[t, 1]].concat(order.filter(i => i !== t).map(i => [i, h.mods.chaosShare || 1]));     // Chorus of Chaos
  if (w.shape === 'splash') return [[t, 1]].concat(order.filter(i => i !== t).map(i => [i, w.perks.splash]));
  if (w.shape === 'boomerang') { const back = order[order.length - 1]; return back !== t ? [[t, 1], [back, 1]] : [[t, 1], [t, 0.5]]; }
  if (w.shape !== 'cleave') return [[t, 1]];
  const near = order.filter(i => !f.enemies[i].traits.backline || f.enemies[t].traits.backline), k = near.indexOf(t), list = [[t, 1]], n = 1 + h.mods.cleave;
  for (let d = 1; list.length <= n && (k + d < near.length || k - d >= 0); d++) {
    if (k + d < near.length && list.length <= n) list.push([near[k + d], 1]);
    if (k - d >= 0 && list.length <= n) list.push([near[k - d], 1]);
  }
  return list;
}

// Advance a fight by dt seconds and return what happened.
function step(f, dt) {
  const ev = [];
  if (f.done) return ev;
  const h = f.hero, E = f.enemies;
  if (!f.started) {             // summons walk in and start-of-fight cards fire
    f.started = true;
    if (h.cards) for (const s of h.cards.summons) for (let n = 0; n < s.count; n++) addAlly(f, s.unit, ev, s.star);
    fire(f, 'start', {}, ev);
    if (settle(f, ev)) return ev;
  }
  if (f.pause > 0) { f.pause -= dt; return ev; }          // a boss's phase change: everyone holds
  f.t += dt;
  const regen = (h.regen || 0) + (h.hp < h.maxHp / 2 ? h.mods.lowRegen || 0 : 0);        // the Tide Watch works harder when you're low
  if (regen) h.hp = Math.min(h.maxHp, h.hp + regen * dt);
  if (h.blindT > 0) h.blindT -= dt;
  if (h.slowT > 0) h.slowT -= dt;
  if (h.mods.tideRefill && f.t >= (f.tided || 0) + h.mods.tideRefill) { f.tided = f.t; h.shieldHp = Math.max(h.shieldHp, h.shieldMax); ev.push({ type: 'heroShield' }); }     // the Tidecaller's tide
  let bAps = 0, bDmg = 0, bCrit = 0;
  for (const b of f.buffs) if ((b.left -= dt) > 0) { bAps = (1 + bAps) * (1 + (b.aps || 0)) - 1; bDmg = (1 + bDmg) * (1 + (b.dmg || 0)) - 1; bCrit += b.crit || 0; }
  f.buffs = f.buffs.filter(b => b.left > 0);
  f.bCrit = bCrit;
  for (const t of f.trig) {
    if (t.cdLeft > 0) t.cdLeft -= dt;
    if (t.on === 'every' && (t.next -= dt) <= 0) { t.next += t.every * h.cards.trigCd; fireOne(f, t, {}, ev); }
  }
  if (settle(f, ev)) return ev;

  // the Gelato Gatling overheats: for its last second of every cycle it cools and doesn't fire
  const M = h.mods, gat = M.gatling, cooling = gat && f.t % gat.cycle >= gat.cycle - gat.off;
  if (!cooling) f.atkCd -= dt;
  while (f.atkCd <= 0 && !f.done && !cooling) {
    const w = h.weapon;
    let aps = w.aps * M.aps * (1 + bAps);
    if (M.hotsand) aps *= f.t < M.hotsand.until ? M.hotsand.early : M.hotsand.late;
    if (M.exoSlow && f.allies.some(a => a.alive && a.u.key === 'bigcrab')) aps *= M.exoSlow;      // hiding behind the bodyguard
    if (h.slowT > 0) aps *= 1 - h.slow;                                                           // a boss's slow (a curse, venom, frost)
    f.atkCd += 1 / aps;
    const t = pickTarget(f);
    if (t < 0) break;
    f.target = t; f.lock = t; f.shots++;
    // the sword's focus: each hit on the same enemy cuts deeper (the Sweeping affix, mods.cleave, builds it
    // faster). Excalibread carries it over to the next enemy.
    const fo = w.perks && w.perks.focus;
    const foMax = fo && (M.carryFocus ? 6 : fo.max);
    if (fo) f.focus = f.focus && (f.focus.target === t || M.carryFocus) ? { target: t, n: Math.min(foMax, f.focus.n + (f.focus.target === t ? 1 + M.cleave : 0)) } : { target: t, n: 0 };
    // the Metronome: every 4th attack lands triple, the off-beats less; the Stopwatch's ambush on the first
    const beat = M.beat ? (f.shots % M.beat.every === 0 ? M.beat.big : M.beat.off) : 1, first = f.shots === 1 && M.ambush ? 1 + M.ambush : 1;
    ev.push({ type: 'attack', target: t, weapon: w.id, focus: fo ? f.focus.n : 0, beat: M.beat && f.shots % M.beat.every === 0 });
    const mult = h.mods.dmg * (1 + bDmg) * (fo ? 1 + fo.per * f.focus.n : 1) * beat * first * (1 - (h.crackN || 0));
    for (const [i, share] of attackTargets(f, t)) dealTo(f, i, w.dmg * mult * share, i !== t, ev);
    if (gat && f.shots % gat.every === 0 && E[t].alive) { const e = E[t]; e.chillT = gat.time; e.chill = Math.max(e.chillT > 0 ? e.chill || 0 : 0, gat.slow); e.chillN = Math.max(e.chillN || 0, 2); ev.push({ type: 'chill', target: t, stacks: e.chillN }); }
    if (M.hawk) f.atkCd += ((E[t].alive ? M.hawk.slower : M.hawk.kill) - 1) / aps;      // Hawk's Nest
    if (settle(f, ev)) return ev;
  }

  // allies swing at the front enemy (or all of them, for area allies)
  for (const a of f.allies) {
    if (!a.alive || f.done) continue;
    a.atkCd -= dt;
    while (a.atkCd <= 0 && a.alive && !f.done) {
      a.atkCd += 1 / a.u.aps;
      const order = formation(f);
      if (!order.length) break;
      const targets = a.u.area ? order : [inReach(f)[0]];
      ev.push({ type: 'allyAttack', ally: a.k, target: targets[0] });
      for (const t of targets) {
        const d = dealTo(f, t, a.u.dmg, a.u.area, ev, a.src);
        if (d && a.u.healHero && h.hp > 0) { const x = d * a.u.healHero; h.hp = Math.min(h.maxHp, h.hp + x); ev.push({ type: 'heal', target: 'hero', amount: x }); }
      }
      if (settle(f, ev)) return ev;
    }
  }

  const rage = f.t > SUDDEN_DEATH ? 1 + (f.t - SUDDEN_DEATH) / 5 : 1;
  for (let i = 0; i < E.length && !f.done; i++) {
    const e = E[i];
    if (!e.alive) continue;
    if (e.woundT > 0) e.woundT -= dt;
    if (e.burnT > 0) { e.burnT -= dt; burnTick(f, i, e, dt, ev); if (!e.alive || f.done) continue; }
    if (e.chillT > 0 && (e.chillT -= dt) <= 0) e.chillN = 0;
    const edt = dt * (e.chillT > 0 ? 1 - e.chill : 1);           // a chilled enemy does everything slower
    if (e.shrinkT > 0) e.shrinkT -= dt;
    if (e.stunImmune > 0) e.stunImmune -= dt;
    enchantTick(f, i, e, dt, ev);
    if (f.done) break;
    if (e.traits.regen && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.traits.regen * e.maxHp * dt * healShare(e));
    if (e.dodgeT > 0) e.dodgeT -= dt;
    if (e.stunT > 0 || e.toadT > 0) { e.stunT -= dt; e.toadT -= dt; continue; }       // stunned or a toad: does nothing
    if (e.windup) {
      if (e.frozenT > 0) { e.frozenT -= dt; continue; }           // a frozen wind-up waits
      if ((e.windup.left -= edt) <= 0) { const m = e.windup.move; e.windup = null; resolveMove(f, i, m, rage, ev); }
      continue;
    }
    if (e.burst) {
      if ((e.burst.next -= edt) <= 0) {
        e.burst.next = 0.16;
        if (--e.burst.left <= 0) { const p = e.burst.power; e.burst = null; hitHero(f, i, e.def.atk * e.atkMult * p * rage, false, ev); }
        else hitHero(f, i, e.def.atk * e.atkMult * e.burst.power * rage, false, ev);
      }
      continue;
    }
    let acted = false;
    for (const m of e.moves) {
      if ((m.cd -= edt) > 0 || acted) continue;
      if (!moveReady(f, e, m)) { m.cd = 0.5; continue; }
      m.cd = m.every; acted = true;
      if (m.windup) { e.windup = { move: m, left: m.windup, total: m.windup }; e.windupHits = 0; ev.push({ type: 'windup', src: i, move: m.kind, time: m.windup, name: m.name }); }
      else resolveMove(f, i, m, rage, ev);
    }
    if (acted || f.done) continue;
    if (e.def.atk > 0 && (e.atkCd -= edt) <= 0) {
      e.atkCd += e.def.interval;
      hitHero(f, i, e.def.atk * e.atkMult * rage, false, ev, true);
    }
  }
  settle(f, ev);
  if (!f.done && f.t >= TIME_LIMIT) { h.hp = 0; f.done = true; f.cause = 'ran out of time'; ev.push({ type: 'end', won: false }); }
  return ev;
}

// Enchantments that run on a clock: growing armour, melting armour, a second wind, sunburn.
function enchantTick(f, i, e, dt, ev) {
  const hk = e.def.hooks;

  const h = f.hero, e = f.enemies[i];

  if (canAlly && f.allies.length) { const a = pickVictim(f); if (a) { hurtAlly(f, i, a, raw, ev); return; } }
  if (f.rng() < h.dodge) {
    ev.push({ type: 'dodge', src: i, heavy }); fire(f, 'dodge', { src: i }, ev);
    if (h.mods.riposte && e.alive) dealTo(f, i, h.mods.riposte, true, ev, { id: 'riposte', type: 'slash', acc: 0 });      // of Riposte
    return;
  }
  let dmg = raw * h.mods.taken;
  if (h.shieldHp > 0) { const a = Math.min(h.shieldHp, dmg); h.shieldHp -= a; dmg -= a; }
  h.hp -= dmg;
  if (h.mods.crack && dmg > 0) h.crackN = Math.min(0.4, h.crackN + h.mods.crack);        // the Glass Cannon cracks
  if (h.hp <= 0 && h.lives && h.lives.length) {                                          // an extra life
    const L = h.lives.shift();
    h.hp = h.maxHp * L.share; f.revived.push(L.id); ev.push({ type: 'revive', id: L.id });
    if (L.blast) for (const j of formation(f)) dealTo(f, j, h.maxHp * L.blast, true, ev, { id: 'phoenix', type: 'fire', acc: 0 });
  }
  f.low = Math.min(f.low, h.hp / h.maxHp);
  ev.push({ type: 'hurt', src: i, dmg, heavy });
  if (h.mods.thorns && e.alive) {
    const t = Math.min(e.hp, h.mods.thorns); e.hp -= t;
    if (e.hp <= 0) killEnemy(f, i, ev);
  }
  if (h.hp > 0 && dmg > 0) { fire(f, 'hurt', { src: i }, ev); fire(f, 'low', { frac: h.hp / h.maxHp }, ev); }
  if (h.hp <= 0) { h.hp = 0; f.done = true; f.cause = (heavy ? 'flattened by ' : 'beaten by ') + e.def.name; ev.push({ type: 'end', won: false }); }
  else settle(f, ev);
}

// A rough score for how well the hero's weapon handles these enemies, worked out only from what the
// pre-fight screen shows (traits, weaknesses, moves). Higher is better. balance.js's bot uses it to
// play the way an attentive player would; the game never shows it.
function weaponFit(hero, defs) {
  const w = hero.weapon, m = hero.mods, perks = w.perks || {}, n = defs.length;
  const times = defs.map(d => {
    const t = d.traits || {};
    let hit = w.dmg * m.dmg * ((d.weak || {})[w.type] || 1) * ((d.resist || {})[w.type] || 1) * (1 + Math.min(1, hero.crit) * (hero.critx - 1));
    for (const k in m.vs) if (k === 'group' ? n > 1 : k === 'boss' ? d.boss : t[k]) hit *= 1 + m.vs[k];
    if (t.flying && (w.type === 'slash' || w.type === 'blunt')) hit *= 0.5;
    const armour = perks.ignoreArmour ? 0 : Math.max(0, (t.armour || 0) * (perks.resonate && d.size === 'big' ? 1 - perks.resonate : 1) - m.pierce);
    hit = Math.max(hit * (perks.chip || ARMOUR_FLOOR), hit - armour);
    if (perks.focus) hit *= 1 + perks.focus.per * Math.min(perks.focus.max, Math.max(0, (d.hp / Math.max(1, hit) - 1) / 2));   // focus builds over a long fight
    if (t.flying && (w.type === 'slash' || w.type === 'blunt') && perks.hitsFlyers) hit *= 2;
    let land = 1 - Math.min(0.9, (t.evasive || 0) * w.acc * (perks.hitsFlyers && t.flying ? 0.5 : 1));
    if (t.flying && perks.flyMiss) land *= 1 - perks.flyMiss * (1 - (perks.nearMiss || 0));
    const shieldHp = (t.shield || 0) * d.hp * (w.type === 'magic' || w.type === 'sonic' ? 0.5 : 1);
    const burn = perks.burn ? perks.burn.dps * m.dmg * ((d.weak || {}).fire || 1) * ((d.resist || {}).fire || 1) : 0;
    const dps = hit * land * w.aps * m.aps + burn;
    let time = (d.hp + shieldHp) / dps;
    const heals = (t.regen || 0) + ((d.moves || []).some(mv => mv.kind === 'heal') ? 0.012 : 0);
    if (!perks.burn) time += time * heals * d.hp / Math.max(1, dps);      // regeneration and heals eat into slow damage; burning stops them
    if (t.backline && n > 1 && !perks.reach && !perks.snipe && w.shape !== 'area' && w.shape !== 'blast' && w.shape !== 'splash' && !m.allHit) time *= 1.6;   // can't reach it until the front falls
    if (perks.chill && ((d.moves || []).some(mv => mv.windup) || d.atk / d.interval > 4)) time *= 0.8;          // slowed and frozen, it hurts less
    if ((d.moves || []).some(mv => mv.kind === 'summon') && w.shape !== 'area' && w.shape !== 'blast' && w.shape !== 'splash') time *= 1.3;
    if (perks.interrupt && (d.moves || []).some(mv => mv.windup)) time *= 0.85;
    if (perks.stun) time *= 0.93;
    if (perks.spell && !d.boss) time *= 1 - 0.12 * Math.min(1, 100 / d.hp);
    return time;
  });
  const sum = times.reduce((a, b) => a + b, 0);
  let total;
  if (m.allHit || w.shape === 'area' || w.shape === 'blast') total = Math.max(...times);
  else if (w.shape === 'splash') total = sum / (1 + perks.splash * (n - 1));
  else if (w.shape === 'cleave') total = sum / Math.min(n, 2 + m.cleave);
  else if (w.shape === 'boomerang') total = sum / Math.min(n, 2);
  else total = sum;
  if (perks.heal) total *= 0.9;
  return 1 / total;
}

// Run a whole fight without drawing it (balance.js and the debug lab's quick sim).
function simulate(hero, defs, rng) {
  const f = newFight(hero, defs, rng);
  while (!f.done) step(f, 1 / 30);
  return f;
}

// Apply enchantments to a scaled enemy definition.
function enchantDef(def, ids) {
  const d = { ...def, traits: { ...def.traits }, weak: { ...def.weak }, resist: { ...def.resist }, moves: (def.moves || []).slice(), hooks: { ...def.hooks }, ench: ids.slice() };
  for (const id of ids) {
    const m = ENCHANTMENTS[id].mod;
    if (m.hp) d.hp = Math.round(d.hp * m.hp);
    if (m.atk) d.atk = Math.round(d.atk * m.atk * 10) / 10;
    Object.assign(d.traits, m.traits);
    for (const k in m.add || {}) d.traits[k] = Math.round(((d.traits[k] || 0) + m.add[k]) * 1000) / 1000;
    for (const k in m.weak || {}) d.weak[k] = Math.round((d.weak[k] || 1) * m.weak[k] * 100) / 100;
    for (const k in m.resist || {}) d.resist[k] = Math.round((d.resist[k] || 1) * m.resist[k] * 100) / 100;
    for (const mv of m.moves || []) d.moves.push({ ...mv, spawn: typeof mv.spawn === 'string' ? ENEMIES[mv.spawn] : mv.spawn });
    Object.assign(d.hooks, m.hooks);
  }
  return d;
}
// How many enchantments an elite or boss on this row carries (0-2), rolled from its own rng.
function rollEnchantments(rng, kind, row, zone) {
  const k = zone.tune.enchant == null ? 1 : zone.tune.enchant;
  const pool = Object.keys(ENCHANTMENTS).filter(id => ENCHANTMENTS[id].for.includes(kind) && (!ENCHANTMENTS[id].zones || ENCHANTMENTS[id].zones.includes(zone.id)));
  const first = Math.min(0.9, (kind === 'boss' ? 0.5 : 0.1 + 0.06 * row) * k), second = Math.min(0.6, (kind === 'boss' ? 0.35 : 0.04 * row) * k);
  const out = [];
  if (rng.next() < first) out.push(rng.pick(pool));
  if (out.length && rng.next() < second) out.push(rng.pick(pool.filter(id => id !== out[0])));
  return out;
}

// An enemy as a zone fields it: minions get tougher the deeper into the map they are, and each zone
// has overall multipliers for minions, elites and the boss (zone.tune), so tuning is data.
function scaledEnemy(def, depth, zone) {
  const t = zone.tune, kind = def.boss ? 'boss' : def.elite ? 'elite' : 'minion';
  const k = kind === 'minion' ? 1 + t.depth * depth : 1;
  return { ...def, hp: Math.round(def.hp * k * t[kind + 'Hp']), atk: Math.round(def.atk * k * t[kind + 'Atk'] * 10) / 10 };
}

// Overtime's floor for a zone: what brings its minions, elites and boss up to the last zone's strength
// (average HP, and damage per second, of each kind as the zone fields it). Never below 1.
const otFloors = {};
function otFloor(zone) {
  if (otFloors[zone.id]) return otFloors[zone.id];
  const ids = (z, kind) => kind === 'minion' ? z.minions : kind === 'elite' ? z.elites : [z.boss];
  const avg = (z, kind, k) => ids(z, kind).reduce((t, id) => t + (k === 'hp' ? ENEMIES[id].hp : ENEMIES[id].atk / ENEMIES[id].interval), 0) / ids(z, kind).length * z.tune[kind + (k === 'hp' ? 'Hp' : 'Atk')];
  const last = ZONES[ZONES.length - 1], out = {};
  for (const kind of ['minion', 'elite', 'boss']) out[kind] = { hp: Math.max(1, avg(last, kind, 'hp') / avg(zone, kind, 'hp')), atk: Math.max(1, avg(last, kind, 'atk') / avg(zone, kind, 'atk')) };
  return (otFloors[zone.id] = out);
}

// part (armour only): 'head' | 'body' | 'legs' | 'feet' (random if omitted, or taken from the base).
// act: which weapons can turn up (the act 2 weapons only from act 2).

// The forge: one rarity up, keeping the base and the affixes. Every affix moves into the new rarity's

const TUNING = {

  aps: { name: 'SPEED', v: 0.06, text: v => '+' + pct(v) + ' attack speed' },

// Everything worn or carried, held weapon aside.
const armourPieces = run => PARTS.map(p => run.inv.armour[p]).filter(Boolean);

// Every stat bonus the run carries: armour, trinkets, and the held weapon's affixes.
// The Featherweight Speedo turns off the armour stat of every other armour piece.
// Percentage bonuses to attack speed and damage multiply (STACKED): +10% twice is +21%, and the
// total is kept as a bonus (add.aps 0.21) so it reads the same as the flat stats.
function carriedStats(run, weaponSlot) {
  const add = { maxHp: 0, armour: 0, dodge: 0, crit: 0, critx: 0, shield: 0, regen: 0, aps: 0, dmg: 0, lifesteal: 0, thorns: 0, postHeal: 0, gold: 0, pierce: 0, cleave: 0, vs: {} };

  const feather = worn.some(it => it.legendary === 'feather');
  for (const it of worn) {
    const noArmour = feather && it.slot === 'armour' && it.legendary !== 'feather';
    if (it.slot !== 'weapon') for (const [k, v] of Object.entries(scaledBase(it))) if (!(noArmour && k === 'armour')) stack(add, k, v);
    for (const a of it.affixes) {

      else stack(add, a.id, a.v);

    if (it.legendary) legend.add(it.legendary);

  for (const k in run.tonics || {}) stack(add, k, run.tonics[k]);

// Add bonus v to stat k of o, times over: multiplied in for STACKED stats, summed for the rest.
function stack(o, k, v, times) {

// The hero a fight uses. weaponSlot: 0 or 1.
function compileHero(run, weaponSlot, target) {
  const it = run.inv.weapons[weaponSlot] || run.inv.weapons.find(Boolean) || { slot: 'weapon', base: 'sword', rarity: 0, affixes: [] };   // empty-handed before the first pick
  const { add, legend } = carriedStats(run, run.inv.weapons.indexOf(it));
  const w = weaponById(it.base);
  const mods = { ...newMods(), vs: add.vs, pierce: add.pierce, cleave: add.cleave, aps: 1 + add.aps, lifesteal: add.lifesteal, thorns: add.thorns, dmg: 1 + add.dmg };
  const cs = (clsOf(run) || {}).stats || {};
  let hpMax = BASE_HERO.maxHp + run.maxHpBonus + add.maxHp + (cs.maxHp || 0), armour = add.armour + (cs.armour || 0), dodge = BASE_HERO.dodge + add.dodge + (cs.dodge || 0);
  if (legend.has('chaos')) { mods.allHit = true; mods.chaosShare = 0.45; }
  if (legend.has('glass')) { mods.dmg *= 1.6; mods.crack = 0.03; }
  if (legend.has('slowhands')) { mods.alwaysCrit = true; mods.fixedCrit = 1.6; }
  if (legend.has('bloodpact')) mods.lifesteal += 0.1;
  if (legend.has('fortress')) { armour += 3; hpMax += 15; mods.shieldStart = 0.5; }
  if (legend.has('feather')) dodge += 0.2;
  if (legend.has('hotsand')) mods.hotsand = { early: 1.4, late: 1.1, until: 10 };
  // extra lives, in the order they're spent: the snorkel cracks, the flip-flops burn
  mods.lives = [];
  if (legend.has('secondwind')) mods.lives.push({ id: 'secondwind', share: 0.4 });
  if (legend.has('phoenix')) mods.lives.push({ id: 'phoenix', share: 0.5, blast: 0.3 });
  if (legend.has('jar')) mods.chain = { share: 0.55, n: 2, ally: 0.1 };
  if (legend.has('eagle')) { mods.trueHit = true; mods.lockOn = true; }
  if (legend.has('exosuit')) mods.exoSlow = 0.9;
  if (legend.has('metronome')) mods.beat = { every: 4, big: 3, off: 0.85 };
  if (legend.has('tidecaller')) { mods.shieldStart = (mods.shieldStart || 1) * 0.5; mods.tideRefill = 8; }
  if (legend.has('rollingpin')) { mods.overkill = 0.5; mods.fullHpCut = 0.85; }
  if (legend.has('goldbelt')) { const n = Math.min(10, Math.floor((run.gold || 0) / 20)); mods.dmg *= 1 + 0.03 * n; mods.aps *= 1 + 0.03 * n; dodge -= 0.01 * n; }
  if (legend.has('excalibread')) mods.carryFocus = true;
  if (legend.has('bell')) mods.bell = { chance: 0.1, time: 2, immune: 5 };
  if (legend.has('gatling')) mods.gatling = { every: 8, slow: 0.3, time: 2, cycle: 7, off: 1 };
  if (legend.has('grandtoad')) mods.grandToad = { chance: 2, time: 4 };
  if (legend.has('hawk')) mods.hawk = { kill: 0.5, slower: 1.2 };
  // the trigger trinkets
  mods.killZap = add.killZap || 0; mods.critGold = add.critGold || 0; mods.ambush = add.ambush || 0;
  mods.killHeal = add.killHeal || 0; mods.killGold = add.killGold || 0; mods.riposte = add.riposte || 0; mods.lowRegen = add.lowRegen || 0;
  if (cs.aps) mods.aps = Math.max(0.3, mods.aps * (1 + cs.aps));
  hpMax = Math.round(hpMax);
  const hero = {
    maxHp: hpMax, hp: Math.min(run.hp, hpMax), armour, dodge: Math.min(0.6, dodge), crit: BASE_HERO.crit + add.crit + (cs.crit || 0), critx: BASE_HERO.critx + add.critx + (cs.critx || 0),
    regen: add.regen, shield: add.shield, target: target || 'front', mods,
    weapon: { ...w, dmg: w.dmg * RARITIES[it.rarity].mult },
  };
  weaponHero(hero);                // what the weapon itself gives its holder (Ninja Stars' dodge, the Sniper's crits)
  // the card board (cards.js) goes on top of the gear
  const out = run.cards && typeof applyCards === 'function' ? applyCards(hero, run.cards, { row: run.row, hp: run.hp, gold: run.gold, stars: run.stars, curses: run.curses, primed: run.primed, hires: run.hires,
    summonDmg: (add.summonDmg || 0) + (cs.summonDmg || 0), summonHp: cs.summonHp || 0, zapDmg: add.zapDmg || 0 }) : hero;
  // allies from legendaries: the Union Card's gulls (upgraded), the Exosuit's bodyguard
  const extra = (legend.has('union') ? [{ unit: 'gull', count: 2, star: true }] : []).concat(legend.has('exosuit') ? [{ unit: 'bigcrab', count: 1 }] : []);
  if (extra.length) out.cards = { ...(out.cards || { list: [], triggers: [], units: cardTotals([], run.row).units, echo: 0, trigCd: 1, zapDmg: 1 }), summons: ((out.cards && out.cards.summons) || []).concat(extra) };
  return out;
}
// The numbers the stats panel shows, from a compiled hero. dps: one target, crits included.
function statSheet(h) {
  const dmg = h.weapon.dmg * h.mods.dmg, aps = h.weapon.aps * h.mods.aps, crit = h.mods.alwaysCrit ? 1 : Math.min(1, h.crit);
  return { maxHp: h.maxHp, shield: heroShield(h), dps: dmg * aps * (1 + crit * (h.critx - 1)), dmg, aps, crit, critx: h.critx, dodge: h.dodge, taken: h.mods.taken };
}
// The same numbers with only the weapon: no gear, cards or class. The rest is what the run added.
const baseSheet = h => statSheet(weaponHero({ ...BASE_HERO, weapon: h.weapon, mods: newMods() }));
// The run as it would be with item it in slot k (for weapons and trinkets an index, for armour its part;
// by default the held weapon's slot, a free trinket slot or else the lowest-rarity trinket). Returns
// { run, slot, was }: slot is the weapon slot to compare holding, was the item it replaces.
function runWith(run, it, k) {
  const r = { ...run, inv: { weapons: run.inv.weapons.slice(), armour: { ...run.inv.armour }, trinkets: run.inv.trinkets.slice() }, loadout: { ...run.loadout } };
  let was = null, slot = run.loadout.weapon;
  if (it.slot === 'weapon') { slot = k == null ? run.loadout.weapon : k; was = r.inv.weapons[slot]; r.inv.weapons[slot] = it; }
  else if (it.slot === 'armour') { was = r.inv.armour[it.part]; r.inv.armour[it.part] = it; }
  else {
    const t = r.inv.trinkets;
    if (k == null) k = t.indexOf(null) >= 0 ? t.indexOf(null) : t.reduce((a, x, i) => x.rarity < t[a].rarity ? i : a, 0);
    was = t[k]; t[k] = it;
  }
  return { run: r, slot, was };
}
// Max HP outside a fight (the HP bar between fights uses the first weapon slot's numbers).
function runMaxHp(run) { return compileHero(run, run.loadout.weapon).maxHp; }
function hasLegendary(run, id) { return allItems(run).some(it => it.legendary === id); }
function runStat(run, k) { return carriedStats(run, run.loadout.weapon).add[k] || 0; }


// Cards: a second loot type that shapes the auto-fight. You keep every card you find (the collection)
// and switch some of them on before each fight (the board: as many as you have card slots).
// Cards are data: a type, a rarity, one or two tags, readable text, an effect and (for pacts and every
// legendary) a drawback. applyCards() compiles a board into the hero a fight uses; the fight engine in
// rules.js runs the triggers and summons. Shared with run.js and balance.js.
// One-use cards (type oneuse) never go on the board: you spend them (use, see run.js useCard).
// Cursed cards (type cursed) have a curse instead of a drawback: { text, stats, grow, cleanse }. A
// growing curse adds grow.stats for every fight you've held the card (up to grow.cap); a curse with
// cleanse: true can be paid off at a shop or the merchant, and Holy Seawater cleanses any curse.
//
// effect / drawback keys:
//   stats:   stat changes. Hero: maxHp armour dodge crit critx aps dmg regen shield lifesteal thorns
//            (aps and dmg multiply with every other bonus; armour is shield HP, see armourHp in rules.js)
//            pierce, taken (+share of damage taken), delay (seconds before your first attack), maxHpMult.
//            Run: gold (+share), goldFight (flat per won fight), winHealMult, postHealShare.
//   perTag:  { tag, stats }: those stats once for every card on the board with that tag (this one too).
//   perCard: stats once for every card on the board.
//   trigger: { on, do, chance, cd, once, every, first, below, unit }. on: hit, crit, kill, hurt, low
//            (HP drops below `below`), every (N seconds), start, allyDeath. do: one effect or a list:
//            zap { dmg, type, to: target|all|random|attacker, n }, heal { amount | share },
//            shield { amount | share }, summon { unit, count }, buff { aps, dmg, time }, gold { amount }.
//   summon:  { unit, count }: allies from SUMMON_UNITS that join every fight.
//   multi:   echo (trigger cards fire this many extra times), summonHp, summonDmg, trigCd (cooldowns
//            and timers scale by this).
// Damage from cards and summons' HP and damage grow with the row you're on (CARD_RULES.rowScale).

const CARD_RULES = {
  startSlots: 3, maxSlots: 6,          // one more slot after each elite you beat
  star: 1.5,                           // an upgraded (★) card's effect numbers; drawbacks stay as they are
  rowScale: 0.08, summonRowScale: 0.05,
  prices: [35, 60, 95, 150, 240],      // shop prices by rarity (the merchant adds its markup)
  offer: { treasure: 0.5 },            // chance that one of a chest's three offers is a card
  draw: 3,                             // cards to choose from in a draw (after every won fight)
  // how often each type turns up, within a rarity: boosts are the everyday card, triggers rare
  typeWeight: { boost: 3, pact: 2, summon: 2, oneuse: 2, multiplier: 1.5, trigger: 1, cursed: 1 },
  cleanse: [30, 45, 70, 100, 140],     // gold to pay off a curse at a shop, by rarity (the merchant adds its markup)
  maxAllies: 5,
};

// What a card offer looks like next to items: { slot: 'card', id, rarity }.
const cardOffer = id => ({ slot: 'card', id, rarity: CARDS[id].rarity });

// A ★ copy of an effect: every number that helps you goes up by CARD_RULES.star. Multipliers below 1
// (cooldowns) shrink by the same share, whole counts (echo) round up, and summon units get the boost
// on their HP and damage instead of their count.
function starEffect(fx) {
  const S = CARD_RULES.star, num = v => Math.round(v * S * 1000) / 1000;
  const st = o => { const r = {}; for (const k in o) r[k] = MULT_STATS.includes(k) ? Math.round((1 + (o[k] - 1) * S) * 1000) / 1000 : k === 'delay' || k === 'taken' ? o[k] : num(o[k]); return r; };
  const out = { ...fx };
  if (fx.stats) out.stats = st(fx.stats);
  if (fx.perTag) out.perTag = { ...fx.perTag, stats: st(fx.perTag.stats) };
  if (fx.perCard) out.perCard = st(fx.perCard);
  if (fx.multi) { out.multi = {}; for (const m in fx.multi) out.multi[m] = m === 'trigCd' ? Math.round((1 - (1 - fx.multi[m]) * S) * 1000) / 1000 : m === 'echo' ? Math.ceil(fx.multi[m] * S) : num(fx.multi[m]); }
  if (fx.trigger) out.trigger = { ...fx.trigger, do: [].concat(fx.trigger.do).map(d => {
    const e = { ...d };
    for (const k of ['dmg', 'amount', 'share', 'aps']) if (typeof e[k] === 'number') e[k] = num(e[k]);
    if (e.kind === 'buff' && typeof e.dmg === 'number') e.dmg = num(d.dmg);
    if (e.kind === 'summon') e.star = true;
    return e;
  }) };
  if (fx.summon) out.summon = { ...fx.summon, star: true };
  return out;
}

const cardOk = run => c => !(run.owned || run.cards).includes(c.id) && (!c.cls || c.cls === run.cls) && !c.event;

  },
  jelly(P, x, y, a) {
    const h = y - 16 + Math.round(Math.sin(a.t * 2.5) * 2), pink = '#ff8fc8';
    for (let k = 0; k < 4; k++) {
      const tx = x - 5 + k * 3.3;
      for (let s = 0; s < 9; s++) P.rect(tx + Math.round(Math.sin(a.t * 5 + s * 0.7 + k) * 1.2), h + 1 + s, 1, 1, k % 2 ? '#ffb8dc' : '#e06aa8');

  // card allies (cards.js SUMMON_UNITS)
  // Chicco Sprintino: a coffee bean in a sweatband, always running.
  bean(P, x, y, a) {
    const run = Math.round(Math.sin(a.t * 18) * 2), cy = y - 9 - Math.abs(Math.round(Math.sin(a.t * 18)));
    P.line(x - 1, cy + 4, x - 3 + run, y, '#2a1838', 1); P.line(x + 1, cy + 4, x + 3 - run, y, '#2a1838', 1);
    P.ell(x, cy, 5, 6, '#6b3a1a'); P.line(x, cy - 5, x + 1, cy + 5, '#3a1a08'); P.rect(x - 3, cy - 3, 2, 1, '#8b5a2b');
    P.rect(x - 5, cy - 4, 10, 2, '#ff3b5c'); P.rect(x + 4, cy - 3, 3, 1, '#ff3b5c');

  banana(P, x, y, a) {

const WEAPON_COLORS = ['#c9b79c', '#b07a4a', '#c8ccd4', '#e6eaf2', '#29e7ff', '#ff7a4a', '#ffe14d', '#ff2bd6'];
const ARMOR_COLORS = ['#8a7a68', '#8a5a34', '#9aa3ad', '#c9d1db', '#7fd3ff', '#39d98a', '#ffd76a', '#ffffff'];

// The hero faces right. swing runs 1 -> 0 after each attack; alt flips which glove punches.
// Tiers pick the armour colour and the weapon's accent colour.
// cos (optional): the profile's cosmetics (profile.js). The outfit recolours cape, legs, boots and armour;
// the weapon skin replaces the weapon's accent colour. Purely visual.
function drawHero(P, x, y, t, swing, wt, at, weapon, alt, cos) {
  const o = (cos && cos.outfit) || {}, skinFx = (cos && cos.weaponSkin) || {};
  const b = Math.round(Math.sin(t * (weapon === 'guitar' ? 9 : 4)) * 0.6), armor = o.armour || ARMOR_COLORS[Math.min(at, 7)], tint = skinFx.tint || WEAPON_COLORS[Math.min(wt, 7)];
  const skin = '#f2c9a0', pants = o.pants || '#2a2140', boots = o.boots || '#4a3a2a';
  P.rect(x - 9, y - 21 + b, 4, 13, o.cape || '#d0306a');
  P.rect(x - 4, y - 8, 3, 8, pants); P.rect(x + 1, y - 8, 3, 8, pants);
  P.rect(x - 5, y - 2, 4, 2, boots); P.rect(x + 1, y - 2, 4, 2, boots);
  P.rect(x - 5, y - 19 + b, 10, 11, armor); P.rect(x - 5, y - 10 + b, 10, 2, '#5a3a20'); P.rect(x - 3, y - 17 + b, 2, 4, 'rgba(255,255,255,.35)');
  // hair (cosmetic): some of it behind the head, some out of the top of the helmet
  const hair = cos && cos.hair && cos.hair.style, hc = hair && cos.hair.color;
  if (hair === 'afro') P.disc(x - 1, y - 28 + b, 7, hc);
  if (hair === 'long') P.rect(x - 7, y - 28 + b, 4, 12, hc);
  if (hair === 'ponytail') { P.rect(x - 8, y - 27 + b, 4, 2, hc); P.rect(x - 9, y - 25 + b, 2, 6, hc); }
  P.rect(x - 4, y - 27 + b, 8, 8, skin);
  P.rect(x - 5, y - 29 + b, 10, 5, armor); P.rect(x + 1, y - 24 + b, 2, 2, '#1a1222');
  if (hair === 'mohawk') for (let k = 0; k < 4; k++) P.rect(x - 3 + k * 2, y - 33 + b + (k % 2), 2, 4 - (k % 2), hc);
  if (hair === 'spiky') for (let k = 0; k < 4; k++) { P.rect(x - 4 + k * 3, y - 31 + b, 2, 2, hc); P.rect(x - 3 + k * 3, y - 33 + b, 1, 2, hc); }
  if (at >= 3) P.rect(x - 1, y - 32 + b, 2, 3, '#ff2bd6');
  HERO_WEAPONS[weapon || 'sword'](P, x, y + b, swing, wt, tint, alt);
}

const HERO_WEAPONS = {
  sword(P, x, y, swing, wt, tint) {
    const th = 0.5 + swing * 1.9, len = 11 + Math.min(wt, 8);
    P.line(x + 3, y - 16, x + 7, y - 14, '#f2c9a0', 2);
    if (wt >= 4) P.stick(x + 7, y - 14, th, len, 'rgba(255,255,255,.5)', 4);
    P.stick(x + 7, y - 14, th, len, tint, 2);
    P.stick(x + 7, y - 14, th + Math.PI / 2, 3, '#ffe14d', 1); P.stick(x + 7, y - 14, th - Math.PI / 2, 3, '#ffe14d', 1);
  },
  gloves(P, x, y, swing, wt, tint, alt) {
    const jab = Math.round(Math.sin(Math.PI * swing) * 9), red = wt >= 4 ? tint : '#e02a2a';
    const front = alt ? 0 : jab, back = alt ? jab : 0;
    P.line(x, y - 18, x + 4 + back, y - 18, '#f2c9a0', 2); P.disc(x + 6 + back, y - 18, 3, red); P.rect(x + 4 + back, y - 20, 1, 1, '#ffffff');
    P.line(x + 2, y - 14, x + 6 + front, y - 14, '#f2c9a0', 2); P.disc(x + 8 + front, y - 14, 3, red); P.rect(x + 6 + front, y - 16, 1, 1, '#ffffff');
  },
  uzi(P, x, y, swing, wt, tint) {
    const r = swing > 0.5 ? 1 : 0, gx = x + 6 - r;
    P.line(x + 2, y - 15, gx, y - 15, '#f2c9a0', 2);
    P.rect(gx, y - 17, 9, 3, '#3a3a46'); P.rect(gx, y - 17, 9, 1, tint); P.rect(gx + 9, y - 16, 3, 1, '#2a2a34');
    P.rect(gx + 1, y - 14, 2, 3, '#2a2a34'); P.rect(gx + 4, y - 14, 2, 4, '#55556a');
    if (swing > 0.6) { P.rect(gx + 12, y - 17, 3, 3, '#ffe14d'); P.rect(gx + 13, y - 18, 1, 5, '#fff8c0'); P.rect(gx + 12, y - 16, 5, 1, '#fff8c0'); }
  },
  wand(P, x, y, swing, wt, tint) {
    const th = 1.0 - swing * 0.7, [ex, ey] = P.stick(x + 6, y - 16, th, 10, '#6b3a1a', 2);
    P.line(x + 2, y - 16, x + 6, y - 16, '#f2c9a0', 2);
    const c = wt >= 1 ? tint : '#ff2bd6', big = swing > 0.3 ? 2 : 1;
    P.rect(ex - big, ey, 2 * big + 1, 1, c); P.rect(ex, ey - big, 1, 2 * big + 1, c); P.rect(ex, ey, 1, 1, '#ffffff');
    if (swing > 0.3) for (let k = 0; k < 3; k++) P.rect(ex + Math.round(Math.cos(k * 2.1 + swing * 9) * 4), ey + Math.round(Math.sin(k * 2.1 + swing * 9) * 4), 1, 1, '#29e7ff');
  },
  guitar(P, x, y, swing, wt, tint) {
    const body = wt >= 4 ? tint : ['#ff2bd6', '#ff3b5c', '#29e7ff', '#ffe14d'][wt];
    P.line(x + 2, y - 14, x + 14, y - 24, '#8a5a34', 2); P.rect(x + 13, y - 27, 3, 3, '#120818');
    P.ell(x, y - 11, 5, 4, body); P.ell(x + 3, y - 14, 3, 3, body); P.disc(x + 1, y - 12, 1, '#120818');
    P.line(x - 2, y - 13, x + 13, y - 25, '#e8e8f0', 1);
    P.rect(x - 1, y - 15 + Math.round(swing * 4), 3, 2, '#f2c9a0');
  },
  bazooka(P, x, y, swing, wt, tint) {
    const r = Math.round(swing * 3), bx = x - 7 - r, ty = y - 21;
    P.rect(bx, ty, 21, 5, '#5a6a3a'); P.rect(bx + 3, ty, 2, 5, wt >= 1 ? tint : '#ffe14d');
    P.rect(bx + 20, ty - 1, 2, 7, '#2a2a34'); P.rect(bx - 1, ty, 1, 5, '#2a2a34');
    P.rect(bx + 9, ty - 3, 3, 3, '#2a2a34'); P.rect(bx + 10, ty + 5, 2, 3, '#2a2a34');
    P.line(x + 2, y - 13, bx + 11, ty + 6, '#f2c9a0', 2);
    if (swing > 0.6) { P.disc(bx - 3, ty + 2, 3, '#c8c8d0'); P.disc(bx + 24, ty + 2, 2, '#ffe14d'); }
  },
};

  // Scimmietta Spumoni: a monkey in three ice-cream stripes. Throws from the back row.

// A sprite canvas with an outline pass: draw art into it, then stamp it onto the world buffer.
function makeSprite(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), sil = document.createElement('canvas'); sil.width = w; sil.height = h;
  const sg = sil.getContext('2d');
  return {
    c, g, P: pixels(g), ox: w / 2, oy: h - 4,
    clear() { g.clearRect(0, 0, w, h); },
    // Stamp onto dst with its origin at (x, y). tint paints the whole sprite a colour at that alpha.
    stamp(dst, x, y, tint, alpha, rot, scale) {
      sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, w, h); sg.drawImage(c, 0, 0);
      sg.globalCompositeOperation = 'source-in'; sg.fillStyle = OUTLINE; sg.fillRect(0, 0, w, h);
      dst.save(); dst.translate(Math.round(x), Math.round(y)); if (rot) dst.rotate(rot); if (scale) dst.scale(scale, scale);
      const dx = -this.ox, dy = -this.oy;
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) dst.drawImage(sil, dx + ox, dy + oy);
      dst.drawImage(c, dx, dy);
      if (tint) {
        sg.fillStyle = tint; sg.fillRect(0, 0, w, h);
        dst.globalAlpha = alpha; dst.drawImage(sil, dx, dy); dst.globalAlpha = 1;
      }
      dst.restore();
    },
  };
}

// Phase 7: chance. Pavone Pokerino, a peacock whose tail is a fan of playing cards, runs the gamble
// node and deals on the beach; the jungle has three mystery crates.
function pavone(P, x, y) {
  for (let k = 0; k < 7; k++) {                                   // the tail: a fan of cards
    const an = -Math.PI * 0.95 + k * Math.PI * 0.15, cx = x + 6 + Math.round(Math.cos(an) * 20), cy = y - 16 + Math.round(Math.sin(an) * 20);
    P.rect(cx - 3, cy - 4, 7, 9, '#f4f4f0'); P.rect(cx - 3, cy - 4, 7, 1, '#120818');
    P.rect(cx - 1, cy - 1, 3, 3, k % 2 ? '#e0102a' : '#120818');
  }
  P.ell(x + 2, y - 10, 9, 10, '#1a6a8a'); P.ell(x, y - 8, 6, 7, '#29a8ff');                    // body
  P.line(x - 1, y - 18, x - 4, y - 28, '#1a6a8a', 3); P.disc(x - 5, y - 30, 4, '#29a8ff');      // neck, head
  P.rect(x - 11, y - 31, 4, 2, '#ffb020'); P.rect(x - 7, y - 32, 2, 2, '#ffffff'); P.rect(x - 7, y - 31, 1, 1, '#120818');
  for (let k = 0; k < 3; k++) P.rect(x - 7 + k * 2, y - 38 + (k % 2), 1, 4, '#29a8ff');       // crest
  P.rect(x - 4, y - 1, 1, 4, '#ffb020'); P.rect(x + 3, y - 1, 1, 4, '#ffb020');
  P.rect(x - 12, y - 14, 5, 7, '#f4f4f0'); P.rect(x - 11, y - 12, 2, 2, '#e0102a');                // a card in his wing
}

      burst(hx(), GROUND - 20, 24, e.tint ? [e.tint, '#ffe0a0', '#ffffff'] : ['#1a0a20', '#3a1048', '#c77dff'], 50);
    }
    else if (e.type === 'slowed') {        // a slow on the hero: wrapped in bandages, venom or frost
      const L = SLOW_LOOKS[e.look] || SLOW_LOOKS.frost;
      v.slowT = e.time; v.slowLook = e.look; v.tele = null;
      text(hx(), GROUND - 46, L.say, L.c[0], 0.95, -12);
      burst(hx(), GROUND - 16, 18, L.c, 40);
    }
    else if (e.type === 'quake') {         // the ground heaves under everyone on your side
      v.tele = null; v.shake = 0.9; v.flash = 0.3;
      const snow = e.look === 'snow', c = snow ? ['#ffffff', '#d8f0ff', '#9fe8ff'] : ['#c8a070', '#8a6a4a', '#ffffff'];
      for (let k = 0; k < 3; k++) v.rings.push({ x: hx() + 20 - k * 20, y: GROUND - 1, r: 2, max: 26 + k * 6, life: 0.5, c: c[k % 3] });
      burst(hx(), GROUND - 4, 34, c, 90);
      if (snow) for (let k = 0; k < 40; k++) v.particles.push({ x: Math.random() * v.bw * 0.6, y: -Math.random() * 30, vx: 30 + Math.random() * 30, vy: 60 + Math.random() * 40, life: 1.2, c: k % 3 ? '#ffffff' : '#d8f0ff', float: true });
    }
    else if (e.type === 'revive') {          // an extra life: the snorkel gasps, the flip-flops burst into flame
      const fire = e.id === 'phoenix';
      v.banners.push({ str: fire ? 'RISE, PHOENIX!' : 'SECOND WIND!', color: fire ? '#ff7a2a' : '#29e7ff', life: 1.8 }); v.flash = 0.3; v.shake = 0.4;
      burst(hx(), GROUND - 16, 40, fire ? ['#ff7a2a', '#ffe14d', '#ff3b5c'] : ['#29e7ff', '#ffffff', '#9fe8ff'], 70);
      if (fire) v.rings.push({ x: hx(), y: GROUND - 14, r: 4, max: v.bw * 0.8, life: 0.6, c: '#ff7a2a' });
    }
    else if (e.type === 'dive') { ent(e.src).diveT = 0.6; v.tele = null; v.shake = 0.7; v.flash = 0.3; burst(hx(), GROUND - 16, 30, ['#1c1424', '#ffe14d', '#ff7a2a', '#ffffff'], 80); }
    else if (e.type === 'spawn') { const E = ent(e.target); E.spawnT = 0.6; E.x = v.bw + 10; }
    else if (e.type === 'shield') { const [x, y] = centre(f, e.target); text(x, y - 20, 'SHIELD UP', '#29e7ff', 0.8, -12); }
    else if (e.type === 'heal') { const [x, y] = centre(f, e.target); text(x, y - 20, '+' + fmt(e.amount), '#39ff88', 0.9, -12); }
    else if (e.type === 'ignite') { const [x, y] = centre(f, e.target); text(x, y - 18, 'BURNING', '#ff7a2a', 0.7, -12); }
    else if (e.type === 'burn') { const [x, y] = centre(f, e.target); text(x + (Math.random() - 0.5) * 8, y - 6, fmt(e.dmg), '#ff9a3a', 0.6, -16); }
    else if (e.type === 'freeze') { const [x, y] = centre(f, e.target); text(x, y - 22, 'FROZEN!', '#9fe8ff', 0.85, -12); }
    else if (e.type === 'chill') { const E = ent(e.target); if (e.stacks > (E.chillShown || 0)) { const [x, y] = centre(f, e.target); text(x, y - 16, 'SLOW ×' + e.stacks, '#9fe8ff', 0.6, -12); } E.chillShown = e.stacks; }
    else if (e.type === 'stun') { const [x, y] = centre(f, e.target); text(x, y - 22, 'STUNNED!', '#ffe14d', 0.85, -12); burst(x, y - 10, 8, ['#ffe14d', '#ffffff'], 35); }
    else if (e.type === 'spell') {
      const [x, y] = centre(f, e.target);
      if (e.kind === 'toad') { text(x, y - 22, 'TOAD!', '#5ac85a', 1, -12); burst(x, y, 20, ['#5ac85a', '#a8e88a', '#ffffff'], 45); }
      else if (e.kind === 'shrink') { text(x, y - 22, 'SHRUNK!', '#c77dff', 0.9, -12); burst(x, y, 12, ['#c77dff', '#ffffff'], 30); }
      else text(x, y - 22, 'CHAIN BOLT', '#29e7ff', 0.8, -12);
    }
    else if (e.type === 'stance') { const [x, y] = centre(f, e.target); text(x, y - 20, 'DODGE STANCE', '#c77dff', 0.8, -12); }
    else if (e.type === 'enrage') { const [x, y] = centre(f, e.target); text(x, y - 20, 'ENRAGED!', '#ff3b5c', 0.9, -12); }
  }

  // Show a new fight (or a preview of one that hasn't started).
  v.setFight = f => {
    v.fight = f; v.ents = []; v.shots.length = 0; v.particles.length = 0; v.texts.length = 0; v.banners.length = 0; v.allies = []; v.cardFlash = []; v.zaps = []; v.slashes = []; v.rings = [];
    v.tele = null; v.ink = 0; v.slowT = 0; v.dim = 0; v.foeShots = []; v.intro = false;
    v.swing = 0; v.heroShown = f ? f.hero.hp : 0;
  };

  function stage(look) {
    const bw = v.bw, sky = look.sky;
    sky.forEach((c, k) => P.rect(0, k * GROUND / sky.length, bw, GROUND / sky.length + 1, c));
    for (const [x, y, k] of v.stars) if (y < GROUND * 0.5 && Math.sin(v.clock * (1 + k) + x) > -0.6) P.rect(x, y, 1, 1, k ? '#b8a8ff' : '#ffffff');
    const sx = Math.round(bw * 0.5), sy = GROUND - 8, r = 30;
    for (let dy = -r; dy <= 0 && sy + dy < GROUND; dy++) {
      const row = sy + dy, gap = dy > -16 ? Math.floor((dy + 16) / 4) + 1 : 0;
      if (gap && (row % 5) < gap) continue;
      const w = Math.round(Math.sqrt(r * r - dy * dy));
      P.rect(sx - w, row, 2 * w + 1, 1, mix(look.sun[0], look.sun[1], (dy + r) / r));
    }
    if (look.horizon === 'sea') {
      P.rect(0, GROUND - 12, bw, 12, look.sea);
      for (let k = 0; k < bw / 6; k++) {
        const x = (k * 37 + Math.floor(v.clock * 6) * (k % 2 ? 1 : -1)) % bw, y = GROUND - 11 + (k * 7) % 10;
        P.rect((x + bw) % bw, y, 3 + k % 3, 1, k % 3 ? look.foam : '#ffffff');
      }
      for (let x = 0; x < bw; x += 2) P.rect(x, GROUND - 13 + Math.round(Math.sin(x * 0.2 + v.clock * 2)), 2, 1, look.foam);
    } else if (look.horizon === 'jungle') {
      for (let x = 0; x < bw; x++) P.rect(x, GROUND - v.ridge[x] - 6, 1, v.ridge[x] + 6, look.canopy);
      for (let k = 0; k < bw / 9; k++) { const tx = (k * 41) % bw; P.disc(tx, GROUND - 16 - (k * 7) % 10, 7 + k % 4, look.canopy); P.disc(tx + 2, GROUND - 19 - (k * 7) % 10, 3, look.leaf); }
      for (let k = 0; k < bw / 22; k++) { const vx = (k * 53 + 11) % bw, len = 18 + (k * 13) % 30, sw = Math.round(Math.sin(v.clock * 1.5 + k) * 2);
        for (let yy = 0; yy < len; yy++) P.rect(vx + Math.round(sw * yy / len), yy, 1, 1, look.leaf);
        P.ell(vx + sw, len, 2, 1, look.leaf); }
    } else if (look.horizon === 'dunes') {         // pyramids far off, rolling dunes, heat haze
      for (const [px, ph] of [[bw * 0.18, 30], [bw * 0.3, 20], [bw * 0.78, 26]]) for (let y = 0; y < ph; y++) P.rect(Math.round(px - y), GROUND - ph + y - 8, 2 * y + 1, 1, y < ph * 0.15 ? look.cap : look.pyramid);
      for (let x = 0; x < bw; x++) { const h = 9 + Math.round(4 * Math.sin(x * 0.05) + 3 * Math.sin(x * 0.13 + 1)); P.rect(x, GROUND - h, 1, h, look.dune); P.rect(x, GROUND - h, 1, 1, look.duneTop); }
      for (let k = 0; k < 3; k++) { const y = GROUND - 22 - k * 6; for (let x = (Math.floor(v.clock * 20) + k * 31) % 24; x < bw; x += 24) P.rect(x, y + Math.round(Math.sin(v.clock * 3 + x)), 6, 1, look.haze); }
    } else if (look.horizon === 'ice') {           // an aurora, snowy peaks, snow drifting down
      for (let k = 0; k < 3; k++) for (let x = 0; x < bw; x += 2) { const y = 10 + k * 5 + Math.round(5 * Math.sin(x * 0.04 + v.clock * 0.6 + k)); P.rect(x, y, 2, 3, look.aurora[k]); }
      for (let x = 0; x < bw; x++) { const h = 6 + Math.round(Math.abs(((x + 17) % 46) - 23) * 1.1 + v.ridge[x] * 0.5), cap = Math.max(2, Math.round(h * 0.35)); P.rect(x, GROUND - h, 1, h, look.ridge); P.rect(x, GROUND - h, 1, cap, look.snow); }
      for (let k = 0; k < bw / 5; k++) P.rect((k * 37 + Math.round(v.clock * 6 + Math.sin(v.clock + k) * 4)) % bw, (k * 23 + Math.floor(v.clock * 14)) % GROUND, 1, 1, '#ffffff');
    } else for (let x = 0; x < bw; x++) P.rect(x, GROUND - v.ridge[x], 1, v.ridge[x], look.ridge);
    P.rect(0, GROUND, bw, BUF_H - GROUND, look.floor);
    const vx = bw / 2, scroll = (v.clock * 0.5) % 1;
    for (let k = 0; k < 7; k++) { const y = GROUND + Math.round(Math.pow((k + scroll) / 6, 2) * (BUF_H - GROUND)); P.rect(0, y, bw, 1, look.grid); }
    for (let i = -14; i <= 14; i++) P.line(vx + i * 4, GROUND, vx + i * 34, BUF_H + 4, look.grid);
    P.rect(0, GROUND, bw, 1, look.line);
  }

  // Boss arenas: Polpo plays under spotlights with notes drifting up (red and strobing once it goes
  // FORTISSIMO); Tucano's canopy hangs over the arena and leaves fall, faster in each phase.
  function bossArena(b) {
    const bw = v.bw;
    if (b.def.art === 'octopus') {
      const fury = b.phase > 0, on = !fury || Math.floor(v.clock * 4) % 2;
      g.globalAlpha = fury ? 0.16 : 0.1; g.fillStyle = fury ? '#ff3b5c' : '#fff8c0';
      if (on) for (const [sx, tx] of [[bw * 0.15, bw * 0.62], [bw * 0.95, bw * 0.75]]) { g.beginPath(); g.moveTo(sx - 3, 0); g.lineTo(sx + 3, 0); g.lineTo(tx + 22, GROUND); g.lineTo(tx - 22, GROUND); g.closePath(); g.fill(); }
      g.globalAlpha = 1;
      for (let k = 0; k < 6; k++) {
        const x = (k * 53 + 20) % bw, y = GROUND - 20 - ((v.clock * 8 + k * 17) % 70);
        P.rect(x, y - 3, 1, 4, fury ? '#ff8aa0' : '#c8b8ff'); P.rect(x - 1, y, 2, 1, fury ? '#ff8aa0' : '#c8b8ff');
      }
    } else if (b.def.art === 'tucano') {
      for (let x = 0; x < bw; x++) P.rect(x, 0, 1, 5 + Math.round(3 * Math.sin(x * 0.3) + 2 * Math.sin(x * 0.11)), '#0e2a12');
      const rate = [0.15, 0.35, 0.6][Math.min(2, b.phase)];
      if (Math.random() < rate) v.particles.push({ x: Math.random() * bw, y: 6, vx: (Math.random() - 0.5) * 10, vy: 6, life: 3, c: b.phase >= 2 ? '#ffe14d' : Math.random() < 0.5 ? '#39a83a' : '#5ac85a', float: true });
    } else if (b.def.art === 'faraone') {
      // the Pharaoh's tomb: torches either side, and sand that blows harder in each phase
      for (const tx of [6, bw - 8]) { P.rect(tx, GROUND - 30, 2, 30, '#6a4a1a'); const fl = Math.round(Math.sin(v.clock * 12 + tx) * 1.5); P.disc(tx + 1, GROUND - 33 + fl, 3, '#ff9a3a'); P.disc(tx + 1, GROUND - 34 + fl, 1, '#ffe14d'); }
      const rate = [0.3, 0.6, 1][Math.min(2, b.phase)];
      if (Math.random() < rate) v.particles.push({ x: bw, y: GROUND - Math.random() * 60, vx: -60 - Math.random() * 40 * (1 + b.phase), vy: 0, life: 3, c: Math.random() < 0.5 ? '#e8c890' : '#d0a870', float: true });
    } else if (b.def.art === 'mammut') {
      // the Mammoth's glacier: icicles overhead, snowfall that thickens into a blizzard
      for (let x = 2; x < bw; x += 9) { const len = 3 + (x * 7) % 8; for (let y = 0; y < len; y++) P.rect(x + Math.floor(y / 3), y, Math.max(1, 3 - Math.floor(y / 3)), 1, y < 2 ? '#ffffff' : '#9fe8ff'); }
      const rate = [0.4, 0.9, 1.6][Math.min(2, b.phase)];
      for (let k = 0; k < Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0); k++) v.particles.push({ x: Math.random() * bw, y: 0, vx: -10 - b.phase * 15, vy: 20 + Math.random() * 15, life: 4, c: '#ffffff', float: true });
    }
  }
  // Shots take the weapon skin's colour and leave the hit effect's trail (both cosmetic).
  function drawShot(s) {
    const skin = v.cos && v.cos.weaponSkin && v.cos.weaponSkin.shot, trail = v.cos && v.cos.hitFx && v.cos.hitFx.trail;
    if (trail && Math.random() < 0.5) v.particles.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 8, vy: -4 - Math.random() * 6, life: 0.3, c: trail });
    if (skin) P.rect(s.x - 1, s.y - 1, 3, 3, skin);
    const p = s.t / s.dur, x = s.x, y = s.y;
    if (s.kind === 'flamer') {
      for (let k = 0; k < 4; k++) { const q = Math.random(); v.particles.push({ x: s.x0 + (x - s.x0) * q, y: s.y0 + (y - s.y0) * q + (Math.random() - 0.5) * 4, vx: 0, vy: -8, life: 0.15, c: k % 2 ? '#ff7a2a' : '#ffe14d', float: true }); }
      P.disc(x, y, 2, '#ffe14d');
    } else if (s.kind === 'freeze') {
      P.line(s.x0, s.y0, x, y, '#9fe8ff', 1); P.line(s.x0, s.y0 - 1, x, y - 1, '#ffffff', 1); P.rect(x - 1, y - 1, 3, 3, '#ffffff');
    } else if (s.kind === 'boomerang') {
      const an = s.t * 25, c = Math.cos(an) * 4, sn = Math.sin(an) * 4;
      P.line(x - c, y - sn, x, y, '#c8944a', 2); P.line(x, y, x + sn, y - c, '#c8944a', 2);
    }
    if (s.kind === 'uzi') { P.rect(x - 3, y, 3, 1, '#ff9a3a'); P.rect(x, y, 2, 1, '#ffe14d'); }
    else if (s.kind === 'stars') {                // a spinning four-point star
      const an = s.t * 30, c = Math.round(Math.cos(an) * 2), sn = Math.round(Math.sin(an) * 2);
      P.line(x - c, y - sn, x + c, y + sn, '#e8eef2'); P.line(x + sn, y - c, x - sn, y + c, '#e8eef2'); P.rect(x, y, 1, 1, '#2a2a34');
    } else if (s.kind === 'sniper') { P.line(s.x0, s.y0, x, y, 'rgba(255,255,255,.55)'); P.rect(x - 2, y, 3, 1, '#ffffff'); }
    else if (s.kind === 'wand') {
      P.disc(x, y, 2, Math.floor(v.clock * 20) % 2 ? '#c77dff' : '#29e7ff'); P.rect(x, y, 1, 1, '#ffffff');
      if (Math.random() < 0.6) v.particles.push({ x, y, vx: (Math.random() - 0.5) * 20, vy: -10 - Math.random() * 20, life: 0.4, c: Math.random() < 0.5 ? '#29e7ff' : '#c77dff' });
    } else if (s.kind === 'guitar') {
      const r = 4 + Math.round(p * 14);
      for (let dy = -r; dy <= r; dy++) { const cx = x - Math.round(dy * dy / (r * 1.6)); P.rect(cx, y + dy, 2, 1, '#29e7ff'); P.rect(cx - 4, y + dy, 1, 1, '#ff2bd6'); }
      if (p < 0.5) { P.rect(x - 8, y - 9, 1, 5, '#ff2bd6'); P.rect(x - 10, y - 5, 2, 2, '#ff2bd6'); P.rect(x - 7, y - 9, 2, 1, '#ff2bd6'); }
    } else if (s.kind === 'bazooka') {
      P.rect(x - 5, y - 1, 6, 3, '#9aa3ad'); P.rect(x + 1, y - 1, 2, 3, '#ff3b5c'); P.rect(x - 7, y, 2, 1, Math.random() < 0.5 ? '#ffe14d' : '#ff7a2a');
      if (Math.random() < 0.7) v.particles.push({ x: x - 7, y, vx: -10 - Math.random() * 10, vy: -15 - Math.random() * 10, life: 0.5, c: '#8a8a96' });
    }
  }

  function bar(x, y, w, h, frac, color, shieldFrac) {
    ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#2a1838'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), h);
    if (shieldFrac > 0) { const sh = Math.max(2, Math.round(h / 2)); ctx.fillStyle = '#29e7ff'; ctx.fillRect(x, y - sh - 1, Math.round(w * Math.min(1, shieldFrac)), sh); }
  }
  function fit(str, width, size) {
    for (; size > 6; size--) { ctx.font = size + 'px ' + FONT; if (ctx.measureText(str).width <= width) break; }
    return size;
  }
  function outlined(str, x, y, color) { ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y); }
  // The hero's bar: HP in green, then the shield (armour) in cyan on the end of it. The bar's length is
  // max HP plus the shield the fight started with, so a spent shield leaves its space empty.
  function heroBar(x, y, w, h, hero) {
    const total = hero.maxHp + Math.max(hero.shieldMax || 0, hero.shieldHp), hp = Math.max(0, Math.round(w * v.heroShown / total)), sh = Math.round(w * Math.max(0, hero.shieldHp) / total);
    ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#2a1838'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#39ff88'; ctx.fillRect(x, y, hp, h);
    if (sh > 0) { ctx.fillStyle = '#29e7ff'; ctx.fillRect(x + hp, y, Math.min(sh, w - hp), h); ctx.fillStyle = '#ffffff'; ctx.fillRect(x + hp, y, Math.min(sh, w - hp), Math.max(1, Math.round(h / 4))); }
  }
  // The boss's bar: big, centred along the top, its name above and a mark at each phase change.
  // Returns where the rest of the HUD starts.
  function bossBar(e, E, fs, pad) {
    const w = Math.min(v.W - pad * 2, 560), x = Math.round((v.W - w) / 2), h = Math.max(12, Math.round(fs * 1.6)), y = pad + fs + 6;
    const name = e.def.name.toUpperCase() + (e.phase > 0 ? ' · PHASE ' + (e.phase + 1) : '');
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.font = fit(name, w, fs) + 'px ' + FONT;
    outlined(name, v.W / 2, pad + fs + 2, e.phase > 0 && Math.floor(v.clock * 3) % 2 ? '#ff3b5c' : '#ff2bd6');
    bar(x, y, w, h, (!e.alive ? 0 : E.hpShown == null ? e.hp : E.hpShown) / e.maxHp, '#ff2bd6', e.shield / e.maxHp);
    ctx.fillStyle = '#ffffff';
    for (const p of e.def.phases || []) ctx.fillRect(x + Math.round(w * p.at) - 1, y, 2, h);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = Math.max(6, Math.round(fs * 0.8)) + 'px ' + FONT;
    outlined(Math.max(0, Math.ceil(e.hp)) + '/' + Math.round(e.maxHp), x + w - 4, y + h / 2 + 1, '#ffffff');
    return y + h + Math.round(pad / 2);
  }

  // scene: { look, weapon, tier: { weapon, armour }, title }
  // scene: { look, weapon, tier, title, cos }. cos: the profile's cosmetics; an arena theme recolours the
  // zone's look but keeps its horizon.
  v.draw = (dt, scene) => {
    const f = v.fight;
    v.cos = scene && scene.cos;
    const arena = v.cos && v.cos.arena && v.cos.arena.look, look = arena ? { ...((scene && scene.look) || DEFAULT_LOOK), ...arena } : (scene && scene.look) || DEFAULT_LOOK;
    if (!v.bw) return;
    v.clock += dt;
    v.swing = Math.max(0, v.swing - dt * 5); v.heroFlash -= dt; v.flash = Math.max(0, v.flash - dt);
    v.shake = Math.max(0, v.shake - dt);
    for (const s of v.shots) {
      s.t += dt; const p = Math.min(1, s.t / s.dur);
      s.x = s.x0 + (s.tx - s.x0) * p; s.y = s.y0 + (s.ty - s.y0) * p + (s.kind === 'wand' ? Math.sin(p * Math.PI * 3) * 3 : s.kind === 'boomerang' ? -Math.sin(p * Math.PI) * 10 : 0);
      if (p < 1) continue;
      if (s.legs) {          // boomerang: land this leg's hits, then fly on (back row, then home)
        if (s.leg === 0) for (const e of s.list) land(e, s.f);
        else if (s.leg === 1) for (const e of s.back) land(e, s.f);
        s.leg++;
        const next = s.leg < s.legs.length ? s.legs[s.leg] : s.leg === s.legs.length ? [hx() + 8, GROUND - 20] : null;
        if (!next) { s.done = true; continue; }
        s.x0 = s.x; s.y0 = s.y; s.tx = next[0]; s.ty = next[1]; s.t = 0; s.dur = Math.max(0.05, Math.hypot(s.tx - s.x0, s.ty - s.y0) / SHOT_SPEED.boomerang);
        continue;
      }
      s.done = true; for (const e of s.list) land(e, s.f);
    }
    v.shots = v.shots.filter(s => !s.done);

    g.imageSmoothingEnabled = false;
    stage(look);
    const boss = f && f.enemies.find(e => e.def.boss);
    if (boss) bossArena(boss);
    const H = hx();
    P.ell(H, GROUND + 1, 9, 2, '#05010c');

    // enemies: slide into place, lunge on attacks, flash red on wind-ups, blink out when killed
    const drawn = [];
    if (f) {
      const pos = layout(f);
      for (const key in pos) {
        const i = +key, E = ent(i), p = pos[i];
        if (E.x == null) E.x = p.x;

function mix(a, b, t) {

// The page: settings, the fight runner every screen shares, and the screens themselves.
// The #debug fight lab lets you put any enemies against any weapon.

const SETTINGS_KEY = 'autoboss-settings';
const STEP = 1 / 30;          // fixed sim step, the same one balance.js uses
const END_PAUSE = 1.8;        // seconds the result stays on the stage before the next screen

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const view = makeView($('cv'));
let settings = loadSettings();
let fight = null, scene = null, onEnd = null, acc = 0, last = performance.now(), endWait = 0;

function loadSettings() {
  const d = { speed: 1, sound: true };
  try { return { ...d, ...JSON.parse(localStorage.getItem(SETTINGS_KEY)) }; } catch (e) { return d; }
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }

// Fights -------------------------------------------------------------------------------------

// Put a fight on the stage without starting it (the pre-fight screen shows who you'll face).
function preview(hero, defs, sc, rng) {
  delete document.body.dataset.fighting;           // whatever was on the stage before (a demo fight, say) is gone
  fight = newFight(hero, defs, rng); fight.running = false;
  view.setFight(fight); scene = sc; onEnd = null; $('result').hidden = true;
}
// Start the fight on the stage; done(f) runs once it ends and the result has been shown.
function startFight(done) {
  fight.running = true; onEnd = done; acc = 0; $('result').hidden = true;
  document.body.dataset.fighting = '1';
}

  else if (e.type === 'dodge') SFX.dodge();
  else if (e.type === 'windup') SFX.windup(e.time);
  else if (e.type === 'spawn') SFX.spawn();
  else if (e.type === 'shield') SFX.shield();
