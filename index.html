<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto-Boss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* 1980s arcade cabinet: black, neon, pixel fonts, square corners, hard drop shadows, CRT scanlines
   over the stage. Layout: the arena (stage + the current screen's cards) beside the inventory on wide
   screens, stacked on phones. */
:root {
  --bg: #07040f; --surface: #120a24; --surface-2: #1b0f36; --line: #3b1d6b; --text: #efe8ff; --muted: #9b8cc4;
  --gold: #ffe14d; --gold-ink: #1a1000; --pink: #ff2bd6; --cyan: #29e7ff; --good: #39ff88; --bad: #ff3b5c; --purple: #c77dff;
  --r0: #c8c4d8; --r1: #39ff88; --r2: #29a8ff; --r3: #c77dff; --r4: #ffb020;
  --pixel: "Press Start 2P", "Courier New", monospace; --body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, #2a0b4a 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text); font: 21px/1.15 var(--body); -webkit-font-smoothing: none;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.app { max-width: 1240px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 26px/1 var(--pixel); color: var(--gold); letter-spacing: .04em; text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 #4a0e6b; }
.brand small { display: block; font-size: 9px; color: var(--cyan); text-shadow: none; letter-spacing: .2em; margin-top: 10px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 8px; background: #000; border: 3px solid var(--line); padding: 6px 10px; font: 11px/1 var(--pixel); }
.pill label { color: var(--muted); font-size: 8px; }
.pill.hp { border-color: var(--good); } .pill.gold { border-color: var(--gold); color: var(--gold); }
.coin { width: 14px; height: 14px; flex: none; background: var(--gold); box-shadow: inset -2px -2px 0 #c99a00, inset 2px 2px 0 #fff8c0; display: inline-block; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.arena { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage { position: relative; overflow: hidden; border: 4px solid #000; outline: 3px solid var(--line); background: #000; aspect-ratio: 16 / 9;
  box-shadow: 0 0 0 7px #000, 0 0 40px rgba(255,43,214,.25); }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 80px rgba(0,0,0,.7); }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.result { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; pointer-events: none; }
.result b { font: 34px/1.1 var(--pixel); text-shadow: 4px 4px 0 #000, 0 0 20px currentColor; }
.result .win { color: var(--gold); } .result .loss { color: var(--bad); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.speed { display: inline-flex; border: 3px solid var(--line); }
.speed button { background: var(--surface); border: 0; padding: 8px 10px; cursor: pointer; font: 9px/1 var(--pixel); color: var(--muted); }
.speed button[aria-pressed="true"] { background: var(--pink); color: #fff; }
#sound[aria-pressed="false"] { color: var(--muted); }

.btn { border: 3px solid var(--line); background: var(--surface-2); padding: 9px 12px; cursor: pointer; font: 10px/1.2 var(--pixel); box-shadow: 3px 3px 0 #000; text-transform: uppercase; }
.btn:hover:not(:disabled) { border-color: var(--cyan); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: #fff8c0; box-shadow: 4px 4px 0 var(--pink); }
.btn.big { padding: 14px 24px; font-size: 15px; }

.card { background: var(--surface); border: 3px solid var(--line); box-shadow: 5px 5px 0 #000; padding: 14px; }
.card h2 { margin: 0 0 10px; font: 14px/1.3 var(--pixel); color: var(--gold); }
.card h3 { margin: 0 0 8px; font: 10px/1.3 var(--pixel); color: var(--cyan); }
.card p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.icon { width: 32px; height: 32px; image-rendering: pixelated; display: block; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 2px solid var(--line); background: #000; font-size: 17px; line-height: 1; white-space: nowrap; }
.chip.weak { border-color: var(--good); color: var(--good); } .chip.resist { border-color: var(--bad); color: var(--bad); }
.chip.trait { border-color: var(--purple); color: #e2c4ff; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.say { border-left: 3px solid var(--pink); padding-left: 10px; color: #ffd6f4; }

/* pickers: weapon slots, targeting, choices */
.pick { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; background: var(--surface-2); border: 3px solid var(--line); padding: 8px; cursor: pointer; box-shadow: 3px 3px 0 #000; width: 100%; }
.pick .icon { grid-row: 1 / span 2; }
.pick b { font: 9px/1.4 var(--pixel); font-weight: 400; }
.pick small { color: var(--muted); font-size: 17px; line-height: 1; }
.pick[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,225,77,.4), 3px 3px 0 #000; }
.pick:hover:not(:disabled) { border-color: var(--cyan); }
.pick:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 3px solid var(--line); flex-wrap: wrap; }
.seg button { background: var(--surface); border: 0; padding: 8px 10px; cursor: pointer; font: 9px/1 var(--pixel); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--cyan); color: #000; }

/* enemy cards on the pre-fight screen */
.foes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.foe { background: var(--surface-2); border: 3px solid var(--line); padding: 8px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 4px 10px; }
.foe img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; grid-row: 1 / span 3; background: #000; }
.foe b { font: 9px/1.4 var(--pixel); font-weight: 400; }
.foe.elite { border-color: #ffb020; } .foe.boss { border-color: var(--pink); }
.foe .moves { grid-column: 1 / -1; color: var(--muted); font-size: 17px; }

.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 14px; }
.lab label { display: grid; gap: 4px; font: 8px/1 var(--pixel); color: var(--muted); }
.lab select, .lab input { font: 18px var(--body); background: #000; color: var(--text); border: 2px solid var(--line); padding: 4px 6px; }
.log { font-size: 18px; max-height: 260px; overflow: auto; white-space: pre-wrap; background: #000; border: 2px solid var(--line); padding: 6px 8px; }

@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
}
@media (max-width: 480px) {
  .stage { aspect-ratio: 4 / 3; }
  .brand { font-size: 18px; }
  .result b { font-size: 22px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">AUTO-BOSS<small>BRAINROT ARCADE · 1986</small></div>
    <div class="status" id="status"></div>
  </header>
  <main>
    <section class="arena">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="result" id="result" hidden></div>
      </div>
      <div class="controls" id="controls">
        <div class="speed" id="speed" role="group" aria-label="Fight speed">
          <button data-speed="1">1X</button><button data-speed="2">2X</button><button data-speed="4">4X</button>
        </div>
        <button class="btn" id="sound">SOUND ON</button>
      </div>
      <div id="screen" class="stack"></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
</div>
<script>
// Auto-Boss rules: seeded rng, damage types, weapons and the fight engine (groups of enemies,
// traits, move sets, phases). Shared by the game and balance.js, so both run the same numbers.
// Fights are fully automatic: step(f, dt) advances one and returns events for render.js and sfx.js.

// Seedable rng (mulberry32). The state is one integer, so runs can be saved and resumed exactly.
function makeRng(seed, state) {
  const r = { s: state != null ? state : (seed >>> 0) };
  r.next = () => {
    let t = (r.s = (r.s + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = n => Math.floor(r.next() * n);
  r.pick = a => a[r.int(a.length)];
  r.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = r.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return r;
}

const DAMAGE_TYPES = {
  slash: { name: 'Slash', color: '#e6eaf2' },
  blunt: { name: 'Blunt', color: '#ff8a5a' },
  pierce: { name: 'Pierce', color: '#ffe14d' },
  magic: { name: 'Magic', color: '#c77dff' },
  sonic: { name: 'Sonic', color: '#29e7ff' },
  explosive: { name: 'Explosive', color: '#ff3b5c' },
};

const TRAITS = {
  armour: { name: 'Armoured', tip: v => 'Blocks ' + v + ' damage from every hit. Fast, weak hits barely scratch it.' },
  evasive: { name: 'Evasive', tip: v => pct(v) + ' chance to dodge. Slow, heavy hits miss the most.' },
  flying: { name: 'Flying', tip: () => 'Slash and blunt deal half damage. Rockets often miss.' },
  shield: { name: 'Shielded', tip: v => 'Starts with a shield of ' + pct(v) + ' of its HP. Magic and sonic hit shields twice as hard.' },
  regen: { name: 'Regenerates', tip: v => 'Heals ' + pct(v) + ' of its HP per second. Needs burst.' },
  summoner: { name: 'Summoner', tip: () => 'Calls in more enemies. Area damage helps.' },
};

// Each weapon is the best answer to something and a bad answer to something else; none is an
// upgrade over another. acc scales the enemy's dodge chance (fast weapons are hard to dodge).
const WEAPONS = [
  { id: 'sword', name: 'Sword', type: 'slash', shape: 'cleave', dmg: 13, aps: 1.0, acc: 1, perks: {},
    blurb: 'Cleaves the target and the enemy beside it.' },
  { id: 'gloves', name: 'Boxing Gloves', type: 'blunt', shape: 'single', dmg: 6.5, aps: 2.4, acc: 0.6, perks: { interrupt: 3 },
    blurb: 'Fast jabs, hard to dodge. 3 hits during a wind-up cancel it.' },
  { id: 'uzi', name: 'Uzi', type: 'pierce', shape: 'single', dmg: 3, aps: 5.5, acc: 0.35, perks: {},
    blurb: 'Bullet spray. Shreds flyers and dodgers; armour eats every bullet.' },
  { id: 'wand', name: 'Magic Wand', type: 'magic', shape: 'single', dmg: 30, aps: 0.5, acc: 1.3, perks: { ignoreArmour: true },
    blurb: 'Slow, heavy bolts that ignore armour.' },
  { id: 'guitar', name: 'Electric Guitar', type: 'sonic', shape: 'area', dmg: 5, aps: 0.9, acc: 1, perks: { heal: 0.3 },
    blurb: 'Hits every enemy at once. Heals you for 30% of damage dealt.' },
  { id: 'bazooka', name: 'Bazooka', type: 'explosive', shape: 'splash', dmg: 34, aps: 0.33, acc: 1.4, perks: { splash: 0.5, flyMiss: 0.4 },
    blurb: 'Huge rockets that splash half damage on everyone else. Often misses flyers.' },
];
const weaponById = id => WEAPONS.find(w => w.id === id);

const MAX_ENEMIES = 5;
const SUDDEN_DEATH = 60;     // seconds; after this enemies hit harder every second
const TIME_LIMIT = 120;      // a fight still going at this point is lost
const BASE_HERO = { maxHp: 100, armour: 0, dodge: 0.05, crit: 0.05, critx: 2, regen: 0, shield: 0 };

function pct(x) { return Math.round(x * 1000) / 10 + '%'; }

const SUFFIX = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.round(n));
  const e = Math.min(SUFFIX.length - 1, Math.floor(Math.log10(n) / 3)), v = n / Math.pow(1000, e);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + SUFFIX[e];
}

function newMods() {
  return { dmg: 1, vs: {}, pierce: 0, cleave: 0, aps: 1, lifesteal: 0, thorns: 0, taken: 1, allHit: false, alwaysCrit: false };
}
// A hero with no items: what the debug lab and the balance matrix start from.
function baseHero(weaponId, target) {
  return { ...BASE_HERO, hp: BASE_HERO.maxHp, weapon: { ...weaponById(weaponId) }, target: target || 'front', mods: newMods() };
}

function spawnEnemy(def) {
  return {
    def, id: def.id, hp: def.hp, maxHp: def.hp, alive: true, phase: 0, atkMult: 1, dodgeT: 0,
    traits: { ...def.traits }, weak: { ...def.weak }, resist: { ...def.resist },
    shield: def.traits && def.traits.shield ? def.traits.shield * def.hp : 0,
    atkCd: def.interval * 0.8, moves: (def.moves || []).map(m => ({ ...m, cd: m.first != null ? m.first : m.every })),
    windup: null, windupHits: 0, burst: null,
  };
}

// hero: from baseHero() or compileHero() in items.js. defs: enemy definitions from zones.js.
function newFight(hero, defs, rng) {
  const h = { ...hero, mods: { ...newMods(), ...hero.mods }, hp: Math.min(hero.hp, hero.maxHp) };
  h.shieldHp = h.shield || 0;
  const f = { t: 0, rng: rng || Math.random, hero: h, enemies: defs.map(spawnEnemy), atkCd: 0.6, target: -1, done: false, won: false, dealt: 0, cause: '' };
  return f;
}

// Enemies in the order they stand: small ones in front (index order), big ones at the back.
function formation(f) {
  return f.enemies.map((e, i) => i).filter(i => f.enemies[i].alive)
    .sort((a, b) => ((f.enemies[a].def.size === 'big') - (f.enemies[b].def.size === 'big')) || a - b);
}

function threat(e) { return e.def.atk * e.atkMult / e.def.interval + (e.windup ? 1000 : 0) + (e.moves.some(m => m.kind === 'summon') ? 5 : 0); }

function pickTarget(f) {
  const order = formation(f), p = f.hero.target, E = f.enemies;
  if (!order.length) return -1;
  if (p === 'lowest') return order.reduce((a, b) => E[b].hp + E[b].shield < E[a].hp + E[a].shield ? b : a);
  if (p === 'threat') return order.reduce((a, b) => threat(E[b]) > threat(E[a]) ? b : a);
  return order[0];
}

// Who a swing at enemy t also hits, with the share of damage each takes.
function attackTargets(f, t) {
  const h = f.hero, w = h.weapon, order = formation(f);
  if (h.mods.allHit || w.shape === 'area') return order.map(i => [i, 1]);
  if (w.shape === 'splash') return [[t, 1]].concat(order.filter(i => i !== t).map(i => [i, w.perks.splash]));
  if (w.shape !== 'cleave') return [[t, 1]];
  const k = order.indexOf(t), list = [[t, 1]], n = 1 + h.mods.cleave;
  for (let d = 1; list.length <= n && (k + d < order.length || k - d >= 0); d++) {
    if (k + d < order.length && list.length <= n) list.push([order[k + d], 1]);
    if (k - d >= 0 && list.length <= n) list.push([order[k - d], 1]);
  }
  return list;
}

// Advance a fight by dt seconds and return what happened.
function step(f, dt) {
  const ev = [];
  if (f.done) return ev;
  f.t += dt;
  const h = f.hero, E = f.enemies;
  if (h.regen) h.hp = Math.min(h.maxHp, h.hp + h.regen * dt);

  f.atkCd -= dt;
  while (f.atkCd <= 0 && !f.done) {
    const w = h.weapon;
    f.atkCd += 1 / (w.aps * h.mods.aps);
    const t = pickTarget(f);
    if (t < 0) break;
    f.target = t;
    ev.push({ type: 'attack', target: t, weapon: w.id });
    for (const [i, share] of attackTargets(f, t)) dealTo(f, i, w.dmg * h.mods.dmg * share, i !== t, ev);
    if (E.every(e => !e.alive)) { f.done = f.won = true; ev.push({ type: 'end', won: true }); return ev; }
  }

  const rage = f.t > SUDDEN_DEATH ? 1 + (f.t - SUDDEN_DEATH) / 5 : 1;
  for (let i = 0; i < E.length && !f.done; i++) {
    const e = E[i];
    if (!e.alive) continue;
    if (e.traits.regen && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.traits.regen * e.maxHp * dt);
    if (e.dodgeT > 0) e.dodgeT -= dt;
    if (e.windup) {
      if ((e.windup.left -= dt) <= 0) { const m = e.windup.move; e.windup = null; resolveMove(f, i, m, rage, ev); }
      continue;
    }
    if (e.burst) {
      if ((e.burst.next -= dt) <= 0) {
        e.burst.next = 0.16;
        if (--e.burst.left <= 0) { const p = e.burst.power; e.burst = null; hitHero(f, i, e.def.atk * e.atkMult * p * rage, false, ev); }
        else hitHero(f, i, e.def.atk * e.atkMult * e.burst.power * rage, false, ev);
      }
      continue;
    }
    let acted = false;
    for (const m of e.moves) {
      if ((m.cd -= dt) > 0 || acted) continue;
      if (!moveReady(f, e, m)) { m.cd = 0.5; continue; }
      m.cd = m.every; acted = true;
      if (m.windup) { e.windup = { move: m, left: m.windup, total: m.windup }; e.windupHits = 0; ev.push({ type: 'windup', src: i, move: m.kind, time: m.windup }); }
      else resolveMove(f, i, m, rage, ev);
    }
    if (acted || f.done) continue;
    if (e.def.atk > 0 && (e.atkCd -= dt) <= 0) {
      e.atkCd += e.def.interval;
      hitHero(f, i, e.def.atk * e.atkMult * rage, false, ev);
    }
  }
  if (!f.done && f.t >= TIME_LIMIT) { h.hp = 0; f.done = true; f.cause = 'ran out of time'; ev.push({ type: 'end', won: false }); }
  return ev;
}

function moveReady(f, e, m) {
  if (m.kind === 'summon') return f.enemies.filter(x => x.alive).length < MAX_ENEMIES;
  if (m.kind === 'heal') return e.hp < e.maxHp * 0.8;
  if (m.kind === 'shield') return e.shield <= 0;
  return true;
}

// m.spawn is an enemy definition (zones.js resolves the id when it loads).
function resolveMove(f, i, m, rage, ev) {
  const e = f.enemies[i];
  if (m.kind === 'slam') hitHero(f, i, e.def.atk * e.atkMult * (m.power || 3) * rage, true, ev);
  else if (m.kind === 'volley') { e.burst = { left: m.hits || 4, power: m.power || 0.6, next: 0 }; ev.push({ type: 'volley', src: i }); }
  else if (m.kind === 'summon') {
    for (let k = 0; k < (m.count || 1) && f.enemies.filter(x => x.alive).length < MAX_ENEMIES; k++) {
      f.enemies.push(spawnEnemy(m.spawn));
      ev.push({ type: 'spawn', target: f.enemies.length - 1, src: i });
    }
  } else if (m.kind === 'shield') { e.shield = (m.amount || 0.2) * e.maxHp; ev.push({ type: 'shield', target: i }); }
  else if (m.kind === 'heal') { const a = (m.amount || 0.2) * e.maxHp; e.hp = Math.min(e.maxHp, e.hp + a); ev.push({ type: 'heal', target: i, amount: a }); }
  else if (m.kind === 'dodge') { e.dodgeT = m.time || 3; ev.push({ type: 'stance', target: i }); }
  else if (m.kind === 'enrage') { e.atkMult *= m.power || 1.5; ev.push({ type: 'enrage', target: i }); }
}

// One hit (or a splash/cleave share of one) from the hero on enemy i, through every defence in order:
// dodge, weakness/resistance, item bonuses, flying, crit, shield, armour.
function dealTo(f, i, raw, minor, ev) {
  const h = f.hero, w = h.weapon, e = f.enemies[i], R = f.rng, perks = w.perks || {};
  if (!e.alive) return;
  const evade = (e.traits.evasive || 0) + (e.dodgeT > 0 ? 0.5 : 0);
  if ((evade && R() < Math.min(0.9, evade * w.acc)) || (e.traits.flying && perks.flyMiss && R() < perks.flyMiss)) {
    ev.push({ type: 'miss', target: i, weapon: w.id, minor }); return;
  }
  let dmg = raw * (e.weak[w.type] || 1) * (e.resist[w.type] || 1);
  for (const k in h.mods.vs) if (k === 'group' ? f.enemies.filter(x => x.alive).length > 1 : e.traits[k]) dmg *= 1 + h.mods.vs[k];
  if (e.traits.flying && (w.type === 'slash' || w.type === 'blunt')) dmg *= 0.5;
  const crit = h.mods.alwaysCrit || R() < h.crit;
  if (crit) dmg *= h.critx;
  let shieldDmg = 0;
  if (e.shield > 0) {
    const m = w.type === 'magic' || w.type === 'sonic' ? 2 : 1, absorb = Math.min(e.shield, dmg * m);
    e.shield -= absorb; shieldDmg = absorb; dmg -= absorb / m;
  }
  const armour = perks.ignoreArmour ? 0 : Math.max(0, (e.traits.armour || 0) - h.mods.pierce);
  if (dmg > 0 && armour) dmg = Math.max(dmg * 0.1, dmg - armour);
  dmg = Math.min(e.hp, dmg);
  e.hp -= dmg; f.dealt += dmg;
  ev.push({ type: 'hit', target: i, dmg, shieldDmg, crit, weapon: w.id, minor, blocked: armour > 0 });
  const heal = (dmg + shieldDmg) * (perks.heal || 0) + dmg * h.mods.lifesteal;
  if (heal > 0 && h.hp > 0) { h.hp = Math.min(h.maxHp, h.hp + heal); ev.push({ type: 'heal', target: 'hero', amount: heal }); }
  if (e.windup && perks.interrupt && !minor && !e.windup.move.unstoppable && ++e.windupHits >= perks.interrupt) {
    e.windup = null; ev.push({ type: 'interrupt', target: i });
  }
  if (e.hp <= 0) { e.alive = false; e.windup = null; e.burst = null; ev.push({ type: 'kill', target: i }); return; }
  const ph = e.def.phases && e.def.phases[e.phase];     // phases trigger at HP thresholds, once each
  if (ph && e.hp <= ph.at * e.maxHp) {
    e.phase++;
    const a = ph.add || {};
    Object.assign(e.traits, a.traits); Object.assign(e.weak, a.weak); Object.assign(e.resist, a.resist);
    if (a.moves) for (const m of a.moves) e.moves.push({ ...m, cd: m.first != null ? m.first : m.every });
    if (a.atk) e.atkMult *= a.atk;
    if (a.traits && a.traits.shield) e.shield = a.traits.shield * e.maxHp;
    ev.push({ type: 'phase', target: i, say: ph.say });
  }
}

function hitHero(f, i, raw, heavy, ev) {
  const h = f.hero, e = f.enemies[i];
  if (f.rng() < h.dodge) { ev.push({ type: 'dodge', src: i, heavy }); return; }
  let dmg = raw * h.mods.taken;
  if (h.shieldHp > 0) { const a = Math.min(h.shieldHp, dmg); h.shieldHp -= a; dmg -= a; }
  if (dmg > 0) dmg = Math.max(dmg * 0.2, dmg - h.armour);
  h.hp -= dmg;
  ev.push({ type: 'hurt', src: i, dmg, heavy });
  if (h.mods.thorns && e.alive) {
    const t = Math.min(e.hp, h.mods.thorns); e.hp -= t;
    if (e.hp <= 0) { e.alive = false; e.windup = null; e.burst = null; ev.push({ type: 'kill', target: i }); }
  }
  if (h.hp <= 0) { h.hp = 0; f.done = true; f.cause = (heavy ? 'flattened by ' : 'beaten by ') + e.def.name; ev.push({ type: 'end', won: false }); }
  else if (f.enemies.every(x => !x.alive)) { f.done = f.won = true; ev.push({ type: 'end', won: true }); }
}

// Run a whole fight without drawing it (balance.js and the debug lab's quick sim).
function simulate(hero, defs, rng) {
  const f = newFight(hero, defs, rng);
  while (!f.done) step(f, 1 / 30);
  return f;
}

// Pixel art. Every sprite is drawn with whole-pixel primitives into a small canvas, outlined, and
// scaled up without smoothing, so the arena stays crisp and chunky at any screen size.
// Art functions take (P, x, y, a): x is the sprite's centre, y the ground under its feet, and
// a = { t: seconds, wind: 0..1 slam wind-up, atk: 0..1 attack lunge, fury: below half HP }.

const OUTLINE = '#120818';

function pixels(g) {
  const P = {
    rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
    ell(cx, cy, rx, ry, c) {
      g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); rx = Math.round(rx); ry = Math.round(ry);
      for (let dy = -ry; dy <= ry; dy++) {
        const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - dy * dy / ((ry + 0.5) * (ry + 0.5)))));   // +0.5 avoids 1px nubs at the poles
        g.fillRect(cx - w, cy + dy, 2 * w + 1, 1);
      }
    },
    disc(cx, cy, r, c) { P.ell(cx, cy, r, r, c); },
    line(x0, y0, x1, y1, c, t = 1) {
      g.fillStyle = c;
      const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
      for (let i = 0; i <= n; i++) g.fillRect(Math.round(x0 + (x1 - x0) * i / n - t / 2), Math.round(y0 + (y1 - y0) * i / n - t / 2), t, t);
    },
    // A stick from (x, y) at angle th (0 = straight up, negative leans left); returns the far end.
    stick(x, y, th, len, c, t) { const ex = x + Math.sin(th) * len, ey = y - Math.cos(th) * len; P.line(x, y, ex, ey, c, t); return [ex, ey]; },
    // Ellipse outline; half -1 draws only the top half, 1 only the bottom.
    ring(cx, cy, rx, ry, c, t = 1, half = 0) {
      g.fillStyle = c;
      for (let k = 0; k < 160; k++) {
        const a = k / 160 * Math.PI * 2, s = Math.sin(a);
        if (half && Math.sign(s) !== half) continue;
        g.fillRect(Math.round(cx + Math.cos(a) * rx - t / 2), Math.round(cy + s * ry - t / 2), t, t);
      }
    },
    // A cartoon eye: white, with a pupil looking left toward the hero.
    eye(x, y, r, a, pupil) {
      P.disc(x, y, r, '#ffffff');
      const p = Math.max(1, Math.round(r * 0.6));
      P.rect(x - r + 1 - (r > 2 ? 0 : 1), y - Math.floor(p / 2), p, p + (r > 2 ? 1 : 0), pupil || (a && (a.fury || a.wind) ? '#e0102a' : '#140c1c'));
    },
    tri(x, y, w, h, c, dir = -1) {  // a spike pointing up (dir -1) or down (1), base centred on x
      for (let i = 0; i < h; i++) { const ww = Math.max(1, Math.round(w * (h - i) / h)); P.rect(x - ww / 2, y + dir * i, ww, 1, c); }
    },
  };
  return P;
}

// The hero faces right. swing runs 1 -> 0 after each attack; alt flips which glove punches.
// Tiers pick the armour colour and the weapon's accent colour.
function drawHero(P, x, y, t, swing, wt, at, weapon, alt) {
  const b = Math.round(Math.sin(t * (weapon === 'guitar' ? 9 : 4)) * 0.6), armor = ARMOR_COLORS[Math.min(at, 7)], tint = WEAPON_COLORS[Math.min(wt, 7)];
  const skin = '#f2c9a0';
  P.rect(x - 9, y - 21 + b, 4, 13, '#d0306a');
  P.rect(x - 4, y - 8, 3, 8, '#2a2140'); P.rect(x + 1, y - 8, 3, 8, '#2a2140');
  P.rect(x - 5, y - 2, 4, 2, '#4a3a2a'); P.rect(x + 1, y - 2, 4, 2, '#4a3a2a');
  P.rect(x - 5, y - 19 + b, 10, 11, armor); P.rect(x - 5, y - 10 + b, 10, 2, '#5a3a20'); P.rect(x - 3, y - 17 + b, 2, 4, 'rgba(255,255,255,.35)');
  P.rect(x - 4, y - 27 + b, 8, 8, skin);
  P.rect(x - 5, y - 29 + b, 10, 5, armor); P.rect(x + 1, y - 24 + b, 2, 2, '#1a1222');
  if (at >= 3) P.rect(x - 1, y - 32 + b, 2, 3, '#ff2bd6');
  HERO_WEAPONS[weapon || 'sword'](P, x, y + b, swing, wt, tint, alt);
}

const HERO_WEAPONS = {
  sword(P, x, y, swing, wt, tint) {
    const th = 0.5 + swing * 1.9, len = 11 + Math.min(wt, 8);
    P.line(x + 3, y - 16, x + 7, y - 14, '#f2c9a0', 2);
    if (wt >= 4) P.stick(x + 7, y - 14, th, len, 'rgba(255,255,255,.5)', 4);
    P.stick(x + 7, y - 14, th, len, tint, 2);
    P.stick(x + 7, y - 14, th + Math.PI / 2, 3, '#ffe14d', 1); P.stick(x + 7, y - 14, th - Math.PI / 2, 3, '#ffe14d', 1);
  },
  gloves(P, x, y, swing, wt, tint, alt) {
    const jab = Math.round(Math.sin(Math.PI * swing) * 9), red = wt >= 4 ? tint : '#e02a2a';
    const front = alt ? 0 : jab, back = alt ? jab : 0;
    P.line(x, y - 18, x + 4 + back, y - 18, '#f2c9a0', 2); P.disc(x + 6 + back, y - 18, 3, red); P.rect(x + 4 + back, y - 20, 1, 1, '#ffffff');
    P.line(x + 2, y - 14, x + 6 + front, y - 14, '#f2c9a0', 2); P.disc(x + 8 + front, y - 14, 3, red); P.rect(x + 6 + front, y - 16, 1, 1, '#ffffff');
  },
  uzi(P, x, y, swing, wt, tint) {
    const r = swing > 0.5 ? 1 : 0, gx = x + 6 - r;
    P.line(x + 2, y - 15, gx, y - 15, '#f2c9a0', 2);

  wand(P, x, y, swing, wt, tint) {

  bazooka(P, x, y, swing, wt, tint) {
    const r = Math.round(swing * 3), bx = x - 7 - r, ty = y - 21;

const icons = {};
function iconURL(id) {
  if (icons[id]) return icons[id];
  const s = makeSprite(18, 18); s.ox = 0; s.oy = 0;
  s.g.translate(1, 1); ICONS[id](s.P); s.g.setTransform(1, 0, 0, 1, 0, 0);
  const out = document.createElement('canvas'); out.width = out.height = 18;
  s.stamp(out.getContext('2d'), 0, 0);
  return (icons[id] = out.toDataURL());
}

// A sprite canvas with an outline pass: draw art into it, then stamp it onto the world buffer.
function makeSprite(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), sil = document.createElement('canvas'); sil.width = w; sil.height = h;
  const sg = sil.getContext('2d');
  return {
    c, g, P: pixels(g), ox: w / 2, oy: h - 4,
    clear() { g.clearRect(0, 0, w, h); },
    // Stamp onto dst with its origin at (x, y). tint paints the whole sprite a colour at that alpha.
    stamp(dst, x, y, tint, alpha, rot) {
      sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, w, h); sg.drawImage(c, 0, 0);
      sg.globalCompositeOperation = 'source-in'; sg.fillStyle = OUTLINE; sg.fillRect(0, 0, w, h);
      dst.save(); dst.translate(Math.round(x), Math.round(y)); if (rot) dst.rotate(rot);
      const dx = -this.ox, dy = -this.oy;
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) dst.drawImage(sil, dx + ox, dy + oy);
      dst.drawImage(c, dx, dy);
      if (tint) {
        sg.fillStyle = tint; sg.fillRect(0, 0, w, h);
        dst.globalAlpha = alpha; dst.drawImage(sil, dx, dy); dst.globalAlpha = 1;
      }
      dst.restore();
    },
  };
}

// Portraits of each enemy for the pre-fight cards, drawn once and cached.
const thumbs = {};
function enemyThumb(def) {
  if (thumbs[def.id]) return thumbs[def.id];
  const n = def.size === 'big' ? 100 : 44, s = makeSprite(n, n), out = document.createElement('canvas');
  ENEMY_ART[def.art](s.P, s.ox, s.oy, { t: 0, wind: 0, atk: 0, fury: false });
  out.width = out.height = n;
  const og = out.getContext('2d'); og.imageSmoothingEnabled = false;
  s.stamp(og, s.ox, s.oy);
  return (thumbs[def.id] = out.toDataURL());
}

// Chiptune sound effects from plain oscillators: no audio files. Rapid hits are throttled so 4×
// speed doesn't turn into noise.

const SFX = (() => {
  let ac = null, on = true;
  const last = {};
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    return ac;
  }
  function tone(freq, dur, type = 'square', vol = 0.05, slide = 1, delay = 0) {
    const a = on && audio(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.08) {
    const a = on && audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(), g = a.createGain(); g.gain.value = vol;
    src.buffer = b; src.connect(g).connect(a.destination); src.start();
  }
  const gate = (key, ms) => { const now = performance.now(); if (now - (last[key] || 0) < ms) return false; last[key] = now; return true; };
  return {
    setOn(v) { on = v; },
    unlock() { const a = audio(); if (a && a.state === 'suspended') a.resume(); },
    // The attack sound for each weapon type, plus a sparkle on crits.
    fire(weapon, crit) {
      if (!gate('fire', weapon === 'uzi' ? 45 : 70)) return;
      if (weapon === 'gloves') { noise(0.04, 0.06); tone(120, 0.06, 'square', 0.04, 0.6); }
      else if (weapon === 'uzi') { noise(0.03, 0.05); tone(700, 0.03, 'square', 0.025, 0.4); }
      else if (weapon === 'wand') { tone(900, 0.18, 'triangle', 0.04, 2); tone(1800, 0.12, 'sine', 0.025, 1.5, 0.05); }
      else if (weapon === 'guitar') { for (const f of [110, 165, 220]) tone(f, 0.28, 'sawtooth', 0.022, 0.98); }
      else if (weapon === 'bazooka') { noise(0.15, 0.07); tone(220, 0.2, 'square', 0.04, 0.5); }
      else tone(200 + Math.random() * 60, 0.05, 'square', 0.04, 0.5);
      if (crit) { tone(880, 0.07, 'square', 0.035, 1.5); tone(1320, 0.08, 'square', 0.03, 1, 0.04); }
    },
    boom() { if (gate('boom', 120)) { noise(0.4, 0.13); tone(70, 0.4, 'square', 0.07, 0.4); } },
    hurt(slam) { if (slam) { noise(0.35, 0.12); tone(90, 0.35, 'square', 0.07, 0.4); } else if (gate('hurt', 80)) tone(150, 0.1, 'sawtooth', 0.04, 0.6); },
    dodge() { if (gate('dodge', 80)) tone(500, 0.08, 'triangle', 0.05, 2.2); },
    windup(time) { tone(110, time || 1, 'sawtooth', 0.035, 4); },
    miss() { if (gate('miss', 90)) tone(300, 0.05, 'triangle', 0.025, 0.7); },
    clink() { if (gate('clink', 90)) tone(1600, 0.04, 'square', 0.02, 0.8); },
    spawn() { tone(200, 0.15, 'square', 0.04, 2.5); },
    shield() { tone(600, 0.25, 'sine', 0.05, 1.8); tone(900, 0.2, 'sine', 0.03, 1.5, 0.08); },
    heal() { if (gate('heal', 300)) { tone(660, 0.1, 'triangle', 0.04); tone(990, 0.15, 'triangle', 0.04, 1, 0.08); } },
    interrupt() { tone(1200, 0.06, 'square', 0.05, 0.5); tone(400, 0.12, 'square', 0.05, 0.5, 0.05); },
    phase() { noise(0.5, 0.1); [220, 196, 175, 147].forEach((f, i) => tone(f, 0.2, 'sawtooth', 0.05, 1, i * 0.12)); },
    kill() { if (gate('kill', 80)) { tone(400, 0.12, 'square', 0.04, 0.3); noise(0.1, 0.05); } },
    coin() { if (gate('coin', 60)) { tone(988, 0.06, 'square', 0.04); tone(1319, 0.14, 'square', 0.04, 1, 0.06); } },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.3 : 0.1, 'square', 0.05, 1, i * 0.1)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.18, 'triangle', 0.06, 0.97, i * 0.16)); },
  };
})();

// Draws the arena. The world (stage, hero, enemies, shots, coins) is pixel art in a low-res buffer
// scaled up without smoothing; HP bars, numbers and banners go on top at full resolution in a
// pixel font. It only reads the fight; events from step() (passed in through v.events) trigger
// the animations. Ranged attacks fly first and their hits, kills and phase changes land on arrival.

const BUF_H = 128, GROUND = 104;
const FONT = '"Press Start 2P", monospace';
const SHOT_SPEED = { uzi: 700, wand: 220, guitar: 260, bazooka: 170 };   // buffer px per second; melee lands at once
const DEFAULT_LOOK = { sky: ['#0b0420', '#140630', '#1f0a40', '#2c0d4e', '#3d1058', '#55135e'], sun: ['#ffe14d', '#ff2bd6'],
  horizon: 'mountains', ridge: '#24093d', floor: '#0d0418', grid: '#5a1478', line: '#ff2bd6' };

function makeView(canvas) {
  const ctx = canvas.getContext('2d');
  const buf = document.createElement('canvas'), g = buf.getContext('2d'), P = pixels(g);
  const heroS = makeSprite(64, 48), bigS = makeSprite(112, 112), smallS = makeSprite(48, 52);
  const v = { W: 0, H: 0, bw: 0, scale: 1, particles: [], texts: [], banners: [], shots: [], ents: [], clock: 0,
    shake: 0, swing: 0, heroFlash: 0, alt: false, flash: 0, ridge: [], stars: [], fight: null, heroShown: 0 };

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!r.width || !r.height) return;
    v.W = r.width; v.H = r.height; v.scale = r.height / BUF_H;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    v.bw = buf.width = Math.max(64, Math.round(BUF_H * r.width / r.height));
    buf.height = BUF_H;
    v.ridge = Array.from({ length: v.bw }, (_, x) => Math.round(7 + 5 * Math.sin(x * 0.07) + 3 * Math.sin(x * 0.19 + 1) + 2 * Math.sin(x * 0.43)));
    v.stars = Array.from({ length: Math.round(v.bw / 4) }, (_, k) => [(k * 97) % v.bw, (k * 53) % (GROUND - 34), k % 5]);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  const hx = () => Math.round(v.bw * 0.2);
  const ent = i => v.ents[i] || (v.ents[i] = { x: null, y: GROUND, atk: 0, flash: 0, wind: null, deadAt: null, spawnT: 0, hpShown: null });
  const height = d => d.size === 'big' ? (d.art === 'bombardiro' ? 60 : 78) : (d.art === 'seagull' ? 34 : d.art === 'jelly' ? 28 : 24);

  // Where every enemy still on screen stands: small ones spread in front, big ones at the back.
  function layout(f) {
    const shown = i => f.enemies[i].alive || ent(i).deadAt == null || v.clock - ent(i).deadAt < 0.5;
    const all = f.enemies.map((e, i) => i).filter(shown)
      .sort((a, b) => ((f.enemies[a].def.size === 'big') - (f.enemies[b].def.size === 'big')) || a - b);
    const bigs = all.filter(i => f.enemies[i].def.size === 'big'), smalls = all.filter(i => f.enemies[i].def.size !== 'big');
    const front = v.bw * 0.45, bigX = v.bw * (smalls.length ? 0.82 : 0.68);
    const room = (bigs.length ? bigX - 32 : v.bw * 0.92) - front, gap = smalls.length > 1 ? Math.min(26, room / (smalls.length - 1)) : 0;
    const pos = {};
    smalls.forEach((i, k) => { pos[i] = { x: smalls.length === 1 && !bigs.length ? v.bw * 0.66 : front + k * gap, y: GROUND - (k % 2) * 4 }; });
    bigs.forEach((i, k) => { pos[i] = { x: bigX + k * 20, y: GROUND }; });
    return pos;
  }
  const centre = (f, i) => { const E = ent(i); return [E.x == null ? v.bw * 0.7 : E.x, E.y - height(f.enemies[i].def) * 0.55]; };

  function text(x, y, str, color, size, vy) {
    v.texts.push({ x, y, str, color, size, vy: vy || -22, life: 1 });
    if (v.texts.length > 50) v.texts.shift();
  }
  function burst(x, y, n, colors, speed) {
    for (let k = 0; k < n && v.particles.length < 260; k++) {
      const an = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random());
      v.particles.push({ x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - speed * 0.6, life: 0.8 + Math.random() * 0.6, c: colors[k % colors.length] });
    }
  }

  // Effects of the hero's attack arriving (or anything that has to wait for it).
  function land(e, f) {
    if (e.type === 'hit') {
      const E = ent(e.target), [x, y] = centre(f, e.target), small = e.minor || e.weapon === 'uzi';
      E.flash = small ? 0.03 : 0.08;
      const col = e.blocked && e.dmg < 3 ? '#8a8a96' : e.crit ? '#ffe14d' : '#ffffff';
      if (e.dmg >= 0.5 || !e.shieldDmg) text(x + (Math.random() - 0.5) * 10, y - 12, (e.crit ? 'CRIT ' : '') + fmt(e.dmg), col, (e.crit ? 1.3 : 0.9) * (small ? 0.7 : 1));
      if (e.shieldDmg >= 0.5) text(x + 6, y - 4, fmt(e.shieldDmg), '#29e7ff', 0.7);
      if (e.weapon === 'bazooka' && !e.minor) { burst(x, y, 18, ['#ffe14d', '#ff7a2a', '#ff3b5c', '#ffffff'], 50); v.shake = Math.max(v.shake, 0.15); }
      if (e.weapon === 'wand') burst(x, y, 6, ['#c77dff', '#29e7ff', '#ffffff'], 30);
    } else if (e.type === 'miss') { const [x, y] = centre(f, e.target); text(x, y - 12, 'MISS', '#8a8a96', 0.75); }
    else if (e.type === 'kill') {
      const [x, y] = centre(f, e.target), d = f.enemies[e.target].def;
      ent(e.target).deadAt = v.clock; burst(x, y, d.size === 'big' ? 60 : 20, [d.color, '#ffffff', '#ffe14d', '#ff2bd6'], 60);
    } else if (e.type === 'interrupt') { const [x, y] = centre(f, e.target); ent(e.target).wind = null; text(x, y - 22, 'INTERRUPTED!', '#39ff88', 0.9, -14); }
    else if (e.type === 'phase') { v.banners.push({ str: e.say || 'PHASE 2!', life: 2.4 }); v.flash = 0.4; v.shake = 0.5; }
    else if (e.type === 'heal' && e.target === 'hero') { if (e.amount >= 1) text(hx() + 4, GROUND - 40, '+' + fmt(e.amount), '#39ff88', 0.7); }
    if (v.onLand) v.onLand(e);
  }
  const LANDS = ['hit', 'miss', 'kill', 'interrupt', 'phase'];

  // Take one step's worth of events, in order.
  v.events = (list, f) => {
    let shot = null;
    for (const e of list) {
      const lands = LANDS.includes(e.type) || (e.type === 'heal' && e.target === 'hero');
      if (e.type === 'attack') {
        v.swing = 1; v.alt = !v.alt; shot = null;
        const m = MUZZLE[e.weapon];
        if (m) {
          const [tx, ty] = centre(f, e.target), x = hx() + m[0], y = GROUND + m[1];
          shot = { kind: e.weapon, x, y, x0: x, y0: y, tx: tx + (Math.random() - 0.5) * 4, ty: ty + (Math.random() - 0.5) * 6, t: 0,
            dur: Math.max(0.05, Math.hypot(tx - x, ty - y) / SHOT_SPEED[e.weapon]), list: [], f };
          v.shots.push(shot);
        }
      } else if (lands && shot) shot.list.push(e);
      else if (lands) land(e, f);
      else enemyEvent(e, f);
    }
  };

  function enemyEvent(e, f) {
    if (e.type === 'hurt') {
      v.heroFlash = 0.15; ent(e.src).atk = 1;
      if (e.heavy) v.shake = 0.35;
      text(hx(), GROUND - 38, '-' + fmt(e.dmg), '#ff3b5c', e.heavy ? 1.3 : 0.85);
    } else if (e.type === 'dodge') { ent(e.src).atk = 1; text(hx(), GROUND - 38, 'DODGE', '#29e7ff', 0.85); }
    else if (e.type === 'windup') ent(e.src).wind = { left: e.time, total: e.time, move: e.move };
    else if (e.type === 'spawn') { const E = ent(e.target); E.spawnT = 0.6; E.x = v.bw + 10; }
    else if (e.type === 'shield') { const [x, y] = centre(f, e.target); text(x, y - 20, 'SHIELD UP', '#29e7ff', 0.8, -12); }
    else if (e.type === 'heal') { const [x, y] = centre(f, e.target); text(x, y - 20, '+' + fmt(e.amount), '#39ff88', 0.9, -12); }
    else if (e.type === 'stance') { const [x, y] = centre(f, e.target); text(x, y - 20, 'DODGE STANCE', '#c77dff', 0.8, -12); }
    else if (e.type === 'enrage') { const [x, y] = centre(f, e.target); text(x, y - 20, 'ENRAGED!', '#ff3b5c', 0.9, -12); }
  }

  // Show a new fight (or a preview of one that hasn't started).
  v.setFight = f => {
    v.fight = f; v.ents = []; v.shots.length = 0; v.particles.length = 0; v.texts.length = 0; v.banners.length = 0;
    v.swing = 0; v.heroShown = f ? f.hero.hp : 0;
  };

  function stage(look) {
    const bw = v.bw, sky = look.sky;
    sky.forEach((c, k) => P.rect(0, k * GROUND / sky.length, bw, GROUND / sky.length + 1, c));
    for (const [x, y, k] of v.stars) if (y < GROUND * 0.5 && Math.sin(v.clock * (1 + k) + x) > -0.6) P.rect(x, y, 1, 1, k ? '#b8a8ff' : '#ffffff');
    const sx = Math.round(bw * 0.5), sy = GROUND - 8, r = 30;
    for (let dy = -r; dy <= 0 && sy + dy < GROUND; dy++) {
      const row = sy + dy, gap = dy > -16 ? Math.floor((dy + 16) / 4) + 1 : 0;
      if (gap && (row % 5) < gap) continue;
      const w = Math.round(Math.sqrt(r * r - dy * dy));
      P.rect(sx - w, row, 2 * w + 1, 1, mix(look.sun[0], look.sun[1], (dy + r) / r));
    }
    if (look.horizon === 'sea') {
      P.rect(0, GROUND - 12, bw, 12, look.sea);
      for (let k = 0; k < bw / 6; k++) {
        const x = (k * 37 + Math.floor(v.clock * 6) * (k % 2 ? 1 : -1)) % bw, y = GROUND - 11 + (k * 7) % 10;
        P.rect((x + bw) % bw, y, 3 + k % 3, 1, k % 3 ? look.foam : '#ffffff');
      }
      for (let x = 0; x < bw; x += 2) P.rect(x, GROUND - 13 + Math.round(Math.sin(x * 0.2 + v.clock * 2)), 2, 1, look.foam);
    } else for (let x = 0; x < bw; x++) P.rect(x, GROUND - v.ridge[x], 1, v.ridge[x], look.ridge);
    P.rect(0, GROUND, bw, BUF_H - GROUND, look.floor);
    const vx = bw / 2, scroll = (v.clock * 0.5) % 1;
    for (let k = 0; k < 7; k++) { const y = GROUND + Math.round(Math.pow((k + scroll) / 6, 2) * (BUF_H - GROUND)); P.rect(0, y, bw, 1, look.grid); }
    for (let i = -14; i <= 14; i++) P.line(vx + i * 4, GROUND, vx + i * 34, BUF_H + 4, look.grid);
    P.rect(0, GROUND, bw, 1, look.line);
  }

  function drawShot(s) {
    const p = s.t / s.dur, x = s.x, y = s.y;
    if (s.kind === 'uzi') { P.rect(x - 3, y, 3, 1, '#ff9a3a'); P.rect(x, y, 2, 1, '#ffe14d'); }
    else if (s.kind === 'wand') {
      P.disc(x, y, 2, Math.floor(v.clock * 20) % 2 ? '#c77dff' : '#29e7ff'); P.rect(x, y, 1, 1, '#ffffff');
      if (Math.random() < 0.6) v.particles.push({ x, y, vx: (Math.random() - 0.5) * 20, vy: -10 - Math.random() * 20, life: 0.4, c: Math.random() < 0.5 ? '#29e7ff' : '#c77dff' });
    } else if (s.kind === 'guitar') {
      const r = 4 + Math.round(p * 14);
      for (let dy = -r; dy <= r; dy++) { const cx = x - Math.round(dy * dy / (r * 1.6)); P.rect(cx, y + dy, 2, 1, '#29e7ff'); P.rect(cx - 4, y + dy, 1, 1, '#ff2bd6'); }
      if (p < 0.5) { P.rect(x - 8, y - 9, 1, 5, '#ff2bd6'); P.rect(x - 10, y - 5, 2, 2, '#ff2bd6'); P.rect(x - 7, y - 9, 2, 1, '#ff2bd6'); }
    } else if (s.kind === 'bazooka') {
      P.rect(x - 5, y - 1, 6, 3, '#9aa3ad'); P.rect(x + 1, y - 1, 2, 3, '#ff3b5c'); P.rect(x - 7, y, 2, 1, Math.random() < 0.5 ? '#ffe14d' : '#ff7a2a');
      if (Math.random() < 0.7) v.particles.push({ x: x - 7, y, vx: -10 - Math.random() * 10, vy: -15 - Math.random() * 10, life: 0.5, c: '#8a8a96' });
    }
  }

  function bar(x, y, w, h, frac, color, shieldFrac) {
    ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#2a1838'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), h);
    if (shieldFrac > 0) { const sh = Math.max(2, Math.round(h / 2)); ctx.fillStyle = '#29e7ff'; ctx.fillRect(x, y - sh - 1, Math.round(w * Math.min(1, shieldFrac)), sh); }
  }
  function fit(str, width, size) {
    for (; size > 6; size--) { ctx.font = size + 'px ' + FONT; if (ctx.measureText(str).width <= width) break; }
    return size;
  }
  function outlined(str, x, y, color) { ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y); }

  // scene: { look, weapon, tier: { weapon, armour }, title }
  v.draw = (dt, scene) => {
    const f = v.fight, look = (scene && scene.look) || DEFAULT_LOOK;
    if (!v.bw) return;
    v.clock += dt;
    v.swing = Math.max(0, v.swing - dt * 5); v.heroFlash -= dt; v.flash = Math.max(0, v.flash - dt);
    v.shake = Math.max(0, v.shake - dt);
    for (const s of v.shots) {
      s.t += dt; const p = Math.min(1, s.t / s.dur);
      s.x = s.x0 + (s.tx - s.x0) * p; s.y = s.y0 + (s.ty - s.y0) * p + (s.kind === 'wand' ? Math.sin(p * Math.PI * 3) * 3 : 0);
      if (p >= 1) { s.done = true; for (const e of s.list) land(e, s.f); }
    }
    v.shots = v.shots.filter(s => !s.done);

    g.imageSmoothingEnabled = false;
    stage(look);
    const H = hx();
    P.ell(H, GROUND + 1, 9, 2, '#05010c');

    // enemies: slide into place, lunge on attacks, flash red on wind-ups, blink out when killed
    const drawn = [];
    if (f) {
      const pos = layout(f);
      for (const key in pos) {
        const i = +key, E = ent(i), p = pos[i];
        if (E.x == null) E.x = p.x;
        E.x += (p.x - E.x) * Math.min(1, dt * (E.spawnT > 0 ? 4 : 6)); E.y = p.y;
        E.atk = Math.max(0, E.atk - dt * 4); E.flash -= dt; E.spawnT -= dt;
        if (E.wind && (E.wind.left -= dt) <= 0) E.wind = null;
        drawn.push(i);
      }
      drawn.sort((a, b) => ((f.enemies[b].def.size === 'big') - (f.enemies[a].def.size === 'big')) || ent(b).x - ent(a).x);
      for (const i of drawn) {
        const e = f.enemies[i], E = ent(i), d = e.def, big = d.size === 'big', S = big ? bigS : smallS;
        if (E.deadAt != null && Math.floor((v.clock - E.deadAt) * 16) % 2) continue;
        if (d.art !== 'bombardiro' && d.art !== 'seagull') P.ell(E.x, E.y + 1, big ? 20 : 8, big ? 3 : 2, '#05010c');
        const wind = E.wind ? 1 - E.wind.left / E.wind.total : 0;
        S.clear();
        ENEMY_ART[d.art](S.P, S.ox, S.oy, { t: v.clock + i * 0.7, wind, atk: E.atk, fury: e.phase > 0 });
        const lunge = -Math.round(Math.sin(Math.PI * E.atk) * (big ? 6 : 4)), jitter = wind ? Math.round((Math.random() - 0.5) * 2) : 0;
        const red = wind && Math.floor(v.clock * 12) % 2;
        const tint = E.flash > 0 ? '#ffffff' : red ? '#ff3b5c' : e.phase > 0 && Math.floor(v.clock * 2) % 2 ? '#ff3b5c' : null;
        S.stamp(g, E.x + lunge + jitter, E.y, tint, E.flash > 0 ? 0.6 : red ? 0.45 : 0.18);
        if (e.alive && e.shield > 0) P.ring(E.x, E.y - height(d) / 2, (big ? 32 : 13) + Math.round(Math.sin(v.clock * 4)), height(d) * (big ? 0.42 : 0.55), Math.floor(v.clock * 6) % 2 ? '#29e7ff' : '#9ff4ff', 1);
        if (e.alive && e.dodgeT > 0 && Math.floor(v.clock * 10) % 2) P.ring(E.x, E.y - height(d) / 2, big ? 26 : 11, height(d) / 2, '#c77dff', 1);
      }
      const t = f.target;
      if (t >= 0 && f.enemies[t] && f.enemies[t].alive && !f.done) {
        const E = ent(t); P.tri(E.x, E.y - height(f.enemies[t].def) - 10 + Math.round(Math.sin(v.clock * 8)), 5, 3, '#ffe14d', 1);
      }
    }

    // hero: lunges with melee weapons, falls over when knocked out
    heroS.clear();
    const dead = f && f.done && !f.won, weapon = (scene && scene.weapon) || (f && f.hero.weapon.id) || 'sword', melee = !MUZZLE[weapon];
    const tier = (scene && scene.tier) || { weapon: 0, armour: 0 };
    drawHero(heroS.P, heroS.ox, heroS.oy, dead ? 0 : v.clock, v.swing, tier.weapon, tier.armour, weapon, v.alt);
    heroS.stamp(g, H + (melee ? Math.round(Math.sin(Math.PI * v.swing) * (weapon === 'gloves' ? 4 : 8)) : 0) - (dead ? 14 : 0), GROUND - (dead ? 2 : 0), v.heroFlash > 0 ? '#ff3b5c' : null, 0.6, dead ? -Math.PI / 2 : 0);
    if (f && f.hero.shieldHp > 0) P.ring(H, GROUND - 14, 12, 16, '#29e7ff', 1);

    for (const s of v.shots) drawShot(s);
    for (const p of v.particles) {
      p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.y > GROUND) { p.y = GROUND; p.vy *= -0.4; p.vx *= 0.6; }
      P.rect(p.x, p.y - 1, 2, 2, p.c);
    }
    v.particles = v.particles.filter(p => p.life > 0);

    // blow the buffer up to the screen, then draw text and bars crisp at full size
    const sh = v.shake ? Math.round((Math.random() - 0.5) * 4 * v.shake / 0.35) : 0;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, v.W, v.H);
    ctx.drawImage(buf, sh * v.scale, sh * v.scale * 0.5, v.W, v.H);
    if (v.flash) { ctx.fillStyle = 'rgba(255,59,92,' + v.flash * 0.5 + ')'; ctx.fillRect(0, 0, v.W, v.H); }
    const k = v.W / v.bw, s = v.scale;

    // per-enemy HP bars (shield above in cyan) and wind-up timers (red, below)
    if (f) for (const i of drawn) {
      const e = f.enemies[i], E = ent(i);
      if (!e.alive && E.deadAt != null) continue;
      E.hpShown = E.hpShown == null ? e.hp : E.hpShown + (e.hp - E.hpShown) * Math.min(1, dt * 10);
      const w = (e.def.size === 'big' ? 40 : 18) * k, x = E.x * k - w / 2, y = (E.y - height(e.def) - 5) * s, bh = Math.max(4, Math.round(s * 1.6));
      bar(x, y, w, bh, E.hpShown / e.maxHp, e.def.boss ? '#ff2bd6' : e.def.elite ? '#ffb020' : '#ff3b5c', e.shield / e.maxHp);
      if (E.wind) { ctx.fillStyle = '#ff3b5c'; ctx.fillRect(x, y + bh + 2, w * (E.wind.left / E.wind.total), Math.max(2, bh / 2)); }
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const t of v.texts) {
      t.y += t.vy * dt; t.life -= dt * 0.9;
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 2));
      ctx.font = Math.round(Math.max(7, s * 4) * t.size) + 'px ' + FONT;
      ctx.lineWidth = Math.max(3, s * 1.1); ctx.strokeStyle = '#000';
      outlined(t.str, Math.round(t.x) * k, Math.round(t.y) * s, t.color);
    }
    v.texts = v.texts.filter(t => t.life > 0);
    ctx.globalAlpha = 1;

    // HUD: hero HP top left, encounter and timer top right, phase banners in the middle
    const fs = Math.max(7, Math.round(s * 3.6)), pad = Math.max(10, Math.round(s * 4)), bh = Math.max(10, Math.round(s * 4));
    ctx.lineWidth = 3; ctx.strokeStyle = '#000';
    if (f) {
      v.heroShown += (f.hero.hp - v.heroShown) * Math.min(1, dt * 10);
      const w = Math.min(v.W * 0.4, 260);
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.font = fs + 'px ' + FONT;
      outlined('HERO ' + Math.ceil(f.hero.hp) + '/' + Math.round(f.hero.maxHp), pad, pad + fs + 2, '#ffffff');
      bar(pad, pad + fs + 6, w, bh, v.heroShown / f.hero.maxHp, '#39ff88', f.hero.shieldHp / f.hero.maxHp);
      const title = (scene && scene.title) || '';
      ctx.textAlign = 'right'; ctx.font = fit(title, v.W * 0.45, fs) + 'px ' + FONT;
      outlined(title, v.W - pad, pad + fs + 2, '#ffe14d');
      ctx.font = fs + 'px ' + FONT;
      const late = f.t > SUDDEN_DEATH;
      if (f.t > 0) outlined(late ? 'SUDDEN DEATH' : 'TIME ' + f.t.toFixed(1), v.W - pad, pad + fs * 2 + 10, late ? (Math.floor(v.clock * 4) % 2 ? '#ff3b5c' : '#ffffff') : '#29e7ff');
    }
    for (const b of v.banners) {
      b.life -= dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life * 2)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = fit(b.str, v.W - pad * 2, Math.round(fs * 2.2)) + 'px ' + FONT; ctx.lineWidth = 5;
      outlined(b.str, v.W / 2, v.H * 0.42, '#ff3b5c');
    }
    v.banners = v.banners.filter(b => b.life > 0);
    ctx.globalAlpha = 1;
  };
  return v;
}

function mix(a, b, t) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return 'rgb(' + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t)).join(',') + ')';
}

// The page: settings, the fight runner every screen shares, and the screens themselves.
// The #debug fight lab lets you put any enemies against any weapon.

const SETTINGS_KEY = 'autoboss-settings';
const STEP = 1 / 30;          // fixed sim step, the same one balance.js uses
const END_PAUSE = 1.8;        // seconds the result stays on the stage before the next screen

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const view = makeView($('cv'));
let settings = loadSettings();
let fight = null, scene = null, onEnd = null, acc = 0, last = performance.now(), endWait = 0;

function loadSettings() {
  const d = { speed: 1, sound: true };
  try { return { ...d, ...JSON.parse(localStorage.getItem(SETTINGS_KEY)) }; } catch (e) { return d; }
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }

// Fights -------------------------------------------------------------------------------------

// Put a fight on the stage without starting it (the pre-fight screen shows who you'll face).
function preview(hero, defs, sc) {
  fight = newFight(hero, defs); fight.running = false;
  view.setFight(fight); scene = sc; onEnd = null; $('result').hidden = true;
}
// Start the fight on the stage; done(f) runs once it ends and the result has been shown.
function startFight(done) {
  fight.running = true; onEnd = done; acc = 0; $('result').hidden = true;
  document.body.dataset.fighting = '1';
}

function showResult(won) {
  $('result').innerHTML = won ? '<b class="win">VICTORY!</b>' : '<b class="loss">K.O.</b>';
  $('result').hidden = false;
  (won ? SFX.win : SFX.lose)();
}

function sound(e) {
  if (e.type === 'attack') SFX.fire(e.weapon, false);
  else if (e.type === 'hurt') SFX.hurt(e.heavy);
  else if (e.type === 'dodge') SFX.dodge();
  else if (e.type === 'windup') SFX.windup(e.time);
  else if (e.type === 'spawn') SFX.spawn();
  else if (e.type === 'shield') SFX.shield();
  else if (e.type === 'heal' && e.target !== 'hero') SFX.heal();
}
view.onLand = e => {
  if (e.type === 'hit') { if (e.weapon === 'bazooka' && !e.minor) SFX.boom(); if (e.blocked && e.dmg < 3) SFX.clink(); }
  else if (e.type === 'miss') SFX.miss();
  else if (e.type === 'kill') SFX.kill();
  else if (e.type === 'interrupt') SFX.interrupt();
  else if (e.type === 'phase') SFX.phase();
};

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let drawDt = dt;
  if (fight && fight.running && !fight.done) {
    acc += dt * settings.speed; drawDt = dt * settings.speed;
    while (acc >= STEP && !fight.done) {
      acc -= STEP;
      const ev = step(fight, STEP);
      view.events(ev, fight); ev.forEach(sound);
    }
    if (fight.done) { endWait = END_PAUSE; showResult(fight.won); }
  } else if (fight && fight.done && onEnd && (endWait -= dt) <= 0) {
    const f = fight, cb = onEnd; onEnd = null; f.running = false; delete document.body.dataset.fighting;
    cb(f);
  }
  view.draw(drawDt, scene);
  requestAnimationFrame(frame);
}

// Shared pieces ------------------------------------------------------------------------------

const MOVE_TEXT = {
  slam: m => 'Heavy slam (' + m.windup + 's wind-up)',
  volley: m => m.hits + '-hit volley' + (m.windup ? ' (' + m.windup + 's wind-up)' : ''),
  summon: m => 'Summons ' + (m.count > 1 ? m.count + '× ' : '') + m.spawn.name,
  shield: m => 'Raises a shield',
  heal: m => 'Heals ' + pct(m.amount) + (m.windup ? ' (' + m.windup + 's wind-up)' : ''),
  dodge: m => 'Dodge stance',
  enrage: m => 'Enrages',
};
function chips(def, showHidden) {
  const out = [];
  for (const k in def.traits) out.push(`<span class="chip trait" title="${esc(TRAITS[k].tip(def.traits[k]))}">${TRAITS[k].name}${typeof def.traits[k] === 'number' && k === 'armour' ? ' ' + def.traits[k] : ''}</span>`);
  for (const k in def.weak) out.push(`<span class="chip weak">${DAMAGE_TYPES[k].name} ×${def.weak[k]}</span>`);
  for (const k in def.resist) out.push(`<span class="chip resist">${DAMAGE_TYPES[k].name} ×${def.resist[k]}</span>`);
  return `<div class="chips">${out.join('')}</div>`;
}
// Enemy cards: portrait, HP, traits, weaknesses and moves. Phase changes stay hidden unless shown.
function foeCards(defs, showPhases) {
  const seen = {};
  return `<div class="foes">${defs.map(d => {
    seen[d.id] = (seen[d.id] || 0) + 1;
    if (seen[d.id] > 1) return '';
    const n = defs.filter(x => x === d).length;
    const moves = (d.moves || []).map(m => MOVE_TEXT[m.kind](m));
    const phases = (d.phases || []).map(p => 'At ' + pct(p.at) + ' HP: ' + (showPhases ? describePhase(p) : '???'));
    return `<div class="foe ${d.boss ? 'boss' : d.elite ? 'elite' : ''}"><img alt="" src="${enemyThumb(d)}">
      <b>${n > 1 ? n + '× ' : ''}${esc(d.name)}</b><span class="muted">${d.hp} HP · hits ${d.atk} every ${d.interval}s</span>${chips(d)}
      ${moves.length || phases.length ? `<div class="moves">${moves.concat(phases).map(esc).join(' · ')}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
function describePhase(p) {
  const a = p.add || {}, bits = [];
  for (const k in a.traits || {}) if (TRAITS[k]) bits.push('becomes ' + TRAITS[k].name.toLowerCase());
  if (a.atk) bits.push('hits ' + Math.round((a.atk - 1) * 100) + '% harder');
  for (const m of a.moves || []) bits.push(MOVE_TEXT[m.kind](m).toLowerCase());
  return bits.join(', ');
}
const weaponPick = (w, pressed, extra) => `<button class="pick" data-weapon="${w.id}" aria-pressed="${pressed}">
  <img class="icon" alt="" src="${iconURL(w.id)}"><b>${esc(w.name)} <span class="muted">${DAMAGE_TYPES[w.type].name.toUpperCase()}</span></b><small>${esc(w.blurb)}${extra || ''}</small></button>`;
const TARGETS = [['front', 'FRONT'], ['lowest', 'LOWEST HP'], ['threat', 'BIGGEST THREAT']];
const targetPicker = cur => `<div class="seg" id="targeting">${TARGETS.map(([k, l]) => `<button data-target="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`;

// Controls -----------------------------------------------------------------------------------

function syncControls() {
  document.querySelectorAll('#speed button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.speed === settings.speed));
  $('sound').textContent = settings.sound ? 'SOUND ON' : 'SOUND OFF'; $('sound').setAttribute('aria-pressed', settings.sound);
  SFX.setOn(settings.sound);
}
$('speed').addEventListener('click', e => { const b = e.target.closest('[data-speed]'); if (b) { settings.speed = +b.dataset.speed; saveSettings(); syncControls(); } });
$('sound').addEventListener('click', () => { settings.sound = !settings.sound; saveSettings(); syncControls(); });
document.addEventListener('pointerdown', SFX.unlock);

// Screens ------------------------------------------------------------------------------------

function titleScreen() {
  $('status').innerHTML = '';
  $('side').innerHTML = '';
  preview(baseHero('sword'), [], { look: ZONES[0].look, title: '' });
  $('screen').innerHTML = `<div class="card"><h2>INSERT COIN</h2>
    <p>Fights are automatic. Every choice between them is yours: the route, the weapon, the loot.</p>
    <div class="row"><button class="btn" data-go="lab">FIGHT LAB</button></div></div>`;
}

// The fight lab: any enemies against any weapon, with a quick simulated win-rate table.
const lab = { foes: ['crab', 'crab', '', '', ''], weapon: 'sword', target: 'front', hp: 100 };
function labScreen() {
  const ids = Object.keys(ENEMIES), defs = () => lab.foes.filter(Boolean).map(id => ENEMIES[id]);
  const hero = () => { const h = baseHero(lab.weapon, lab.target); h.maxHp = h.hp = lab.hp; return h; };
  const busy = () => fight && fight.running && !fight.done;
  const refresh = stageOnly => {
    if (busy()) return;
    preview(hero(), defs(), { look: ZONES[0].look, title: 'FIGHT LAB' });
    if (stageOnly) return;
    $('screen').innerHTML = `<div class="card"><h2>FIGHT LAB</h2>${foeCards(defs(), true)}</div>
      <div class="card"><h3>WEAPON</h3><div class="grid2">${WEAPONS.map(w => weaponPick(w, w.id === lab.weapon)).join('')}</div>
      <h3 style="margin-top:12px">TARGETING</h3>${targetPicker(lab.target)}
      <div class="row" style="margin-top:12px"><button class="btn primary big" id="labFight">FIGHT!</button><button class="btn" data-go="title">BACK</button></div></div>`;
  };
  $('status').innerHTML = '';
  $('side').innerHTML = `<div class="card lab stack"><h3>ENEMIES</h3>
    ${lab.foes.map((id, k) => `<label>SLOT ${k + 1}<select data-slot="${k}"><option value="">—</option>${ids.map(i => `<option value="${i}" ${i === id ? 'selected' : ''}>${esc(ENEMIES[i].name)}</option>`).join('')}</select></label>`).join('')}
    <label>HERO HP<input type="number" id="labHp" min="10" max="2000" value="${lab.hp}"></label>
    <button class="btn" id="labSim">SIM ALL WEAPONS ×100</button><div class="log" id="labLog">Pick enemies and a weapon.</div></div>`;
  $('side').onchange = e => {
    if (busy()) return;
    if (e.target.dataset.slot != null) lab.foes[+e.target.dataset.slot] = e.target.value;
    if (e.target.id === 'labHp') { lab.hp = Math.max(10, +e.target.value || 100); refresh(true); return; }
    refresh();
  };
  $('side').onclick = e => {
    if (e.target.id !== 'labSim') return;
    const lines = ['weapon     win   time  hp left'];
    for (const w of WEAPONS) {
      let wins = 0, t = 0, left = 0;
      for (let s = 1; s <= 100; s++) {
        const h = baseHero(w.id, lab.target); h.maxHp = h.hp = lab.hp;
        const f = simulate(h, defs(), makeRng(s).next);
        if (f.won) { wins++; t += f.t; left += f.hero.hp; }
      }
      lines.push(w.id.padEnd(9) + (wins + '%').padStart(5) + (wins ? (t / wins).toFixed(0) + 's' : '--').padStart(7) + (wins ? Math.round(left / wins) : '--').toString().padStart(8));
    }
    $('labLog').textContent = lines.join('\n');
  };
  $('screen').onclick = e => {
    if (busy()) return;
    const w = e.target.closest('[data-weapon]'), t = e.target.closest('[data-target]');
    if (w) { lab.weapon = w.dataset.weapon; refresh(); }
    if (t) { lab.target = t.dataset.target; refresh(); }
    if (e.target.id === 'labFight' && defs().length) {
      $('labFight').disabled = true;
      startFight(f => {
        $('labLog').textContent = (f.won ? 'WON' : 'LOST') + ' with ' + f.hero.weapon.name + ' in ' + f.t.toFixed(1) + 's, ' + Math.ceil(f.hero.hp) + ' HP left' + (f.cause ? ' (' + f.cause + ')' : '') + '\n' + $('labLog').textContent;
        refresh();
      });
    }
  };
  refresh();
}

const SCREENS = { title: titleScreen, lab: labScreen };
function go(name) { $('screen').onclick = null; $('side').onclick = null; $('side').onchange = null; (SCREENS[name] || titleScreen)(); }
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });

syncControls();
go(location.hash === '#debug' ? 'lab' : 'title');
requestAnimationFrame(frame);

</script>
</body>
</html>
