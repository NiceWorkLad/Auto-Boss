<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boss Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* 1980s arcade cabinet: black, neon, pixel fonts, square corners, hard drop shadows, CRT scanlines
   over the stage. Layout: the arena beside the shop on wide screens, stacked on phones. */
:root {
  --bg: #07040f; --surface: #120a24; --surface-2: #1b0f36; --line: #3b1d6b; --text: #efe8ff; --muted: #9b8cc4;
  --gold: #ffe14d; --gold-ink: #1a1000; --pink: #ff2bd6; --cyan: #29e7ff; --good: #39ff88; --bad: #ff3b5c;
  --pixel: "Press Start 2P", "Courier New", monospace; --body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, #2a0b4a 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text); font: 21px/1.15 var(--body); -webkit-font-smoothing: none;
}
button { font: inherit; color: inherit; }
.app { max-width: 1240px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 26px/1 var(--pixel); color: var(--gold); letter-spacing: .04em;
  text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 #4a0e6b; }
.brand small { display: block; font-size: 9px; color: var(--cyan); text-shadow: none; letter-spacing: .2em; margin-top: 10px; }
.purse { display: flex; align-items: center; gap: 10px; background: #000; border: 3px solid var(--gold); padding: 8px 14px; box-shadow: 4px 4px 0 var(--pink); }
.purse label { font: 10px/1 var(--pixel); color: var(--pink); }
.coin { width: 18px; height: 18px; flex: none; background: var(--gold); box-shadow: inset -3px -3px 0 #c99a00, inset 3px 3px 0 #fff8c0; image-rendering: pixelated; }
.purse b { font: 20px/1 var(--pixel); color: var(--gold); text-shadow: 0 0 8px rgba(255,225,77,.6); font-variant-numeric: tabular-nums; }
.purse small { font: 10px/1 var(--pixel); color: var(--good); min-width: 4em; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.arena { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage { position: relative; overflow: hidden; border: 4px solid #000; outline: 3px solid var(--line); background: #000; aspect-ratio: 16 / 9;
  box-shadow: 0 0 0 7px #000, 0 0 40px rgba(255,43,214,.25); }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 80px rgba(0,0,0,.7); }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

.result { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,2,12,.6); z-index: 1; }
.result[hidden] { display: none; }
.card { background: #000; border: 4px solid var(--cyan); box-shadow: 6px 6px 0 var(--pink); padding: 18px 20px; width: min(380px, calc(100% - 28px)); text-align: center; }
.card h2 { margin: 0 0 10px; font: 26px/1.1 var(--pixel); }
.card h2.win { color: var(--gold); text-shadow: 3px 3px 0 var(--pink); }
.card h2.loss { color: var(--bad); text-shadow: 3px 3px 0 #4a0e6b; }
.card .sub { color: var(--muted); margin-bottom: 12px; }
.lines { display: grid; gap: 2px; margin: 0 0 10px; text-align: left; }
.lines div { display: flex; justify-content: space-between; gap: 12px; }
.lines span:last-child { color: var(--gold); }
.lines .jackpot span { color: var(--good); }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px dashed var(--line); padding-top: 10px; margin-bottom: 12px; }
.total span { font: 11px/1 var(--pixel); color: var(--muted); }
.total b { font: 22px/1 var(--pixel); color: var(--gold); font-variant-numeric: tabular-nums; }
.bought { color: var(--muted); font-size: 18px; margin-bottom: 12px; }
.card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.next { font: 11px/1 var(--pixel); color: var(--cyan); margin-top: 12px; min-height: 1em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.btn { border: 3px solid var(--line); background: var(--surface-2); padding: 8px 12px; cursor: pointer; font: 10px/1.2 var(--pixel); box-shadow: 3px 3px 0 #000; text-transform: uppercase; }
.btn:hover:not(:disabled) { border-color: var(--cyan); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: #fff8c0; box-shadow: 4px 4px 0 var(--pink); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.controls .btn.primary { padding: 12px 22px; font-size: 16px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 3px solid var(--line); padding: 6px 10px; cursor: pointer; user-select: none; font: 9px/1 var(--pixel); text-transform: uppercase; }
.toggle input { appearance: none; width: 14px; height: 14px; margin: 0; border: 2px solid var(--muted); background: #000; }
.toggle input:checked { background: var(--good); border-color: var(--good); box-shadow: 0 0 8px var(--good); }
.speed { display: inline-flex; border: 3px solid var(--line); margin-left: auto; }
.speed button { background: var(--surface); border: 0; padding: 8px 10px; cursor: pointer; font: 9px/1 var(--pixel); color: var(--muted); }
.speed button[aria-pressed="true"] { background: var(--pink); color: #fff; }
#sound[aria-pressed="false"] { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 3px solid var(--line); padding: 6px 9px; }
.stat small { display: block; color: var(--cyan); font: 8px/1.4 var(--pixel); text-transform: uppercase; }
.stat b { font-weight: 400; font-size: 24px; }

.shop { background: var(--surface); border: 3px solid var(--line); box-shadow: 5px 5px 0 #000; display: flex; flex-direction: column; max-height: calc(100vh - 100px); position: sticky; top: 14px; }
.tabs { display: flex; border-bottom: 3px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 12px 4px; cursor: pointer; color: var(--muted); font: 9px/1 var(--pixel); text-transform: uppercase; }
.tabs button[aria-selected="true"] { color: #000; background: var(--cyan); }
.panel { overflow-y: auto; padding: 8px; display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--surface-2); border: 3px solid var(--line); padding: 8px 10px; }
.item .name { font: 10px/1.3 var(--pixel); }
.item .name em { font: 20px/1 var(--body); font-style: normal; color: var(--muted); margin-left: 6px; }
.item .fx { grid-column: 1; color: var(--muted); font-size: 19px; }
.item .btn { grid-row: 1 / span 2; grid-column: 2; min-width: 96px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.item .btn .coin { width: 10px; height: 10px; box-shadow: inset -2px -2px 0 #c99a00; }
.item.gear { border-color: #6b4a00; }
.boss { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface-2); border: 3px solid var(--line); padding: 6px 10px 6px 6px; cursor: pointer; text-align: left; width: 100%; }
.boss[aria-current="true"] { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,225,77,.35); }
.boss .dot { width: 44px; height: 44px; image-rendering: pixelated; object-fit: cover; object-position: 50% 80%; }
.boss b { font: 9px/1.4 var(--pixel); font-weight: 400; }
.boss .meta { color: var(--muted); font-size: 18px; }
.boss .bar { height: 6px; background: #000; margin-top: 4px; }
.boss .bar i { display: block; height: 100%; background: var(--gold); }
.boss .tag { font: 9px/1 var(--pixel); color: var(--good); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 18px; padding: 6px 2px 2px; }

@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .shop { position: static; max-height: none; }
  .speed { margin-left: 0; }
}
@media (max-width: 480px) {
  .stage { aspect-ratio: 4 / 3; }
  .brand { font-size: 18px; }
  .purse b { font-size: 16px; }
  .controls .btn.primary { font-size: 13px; padding: 11px 16px; }
  .card { padding: 10px 12px; border-width: 3px; }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .card .sub, .lines, .bought { font-size: 16px; margin-bottom: 6px; }
  .total { padding-top: 6px; margin-bottom: 8px; }
  .total b { font-size: 16px; }
  .next { margin-top: 8px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">BOSS RUSH<small>BRAINROT ARCADE · 1986</small></div>
    <div class="purse"><label>GOLD</label><span class="coin"></span><b id="gold">0</b><small id="earned"></small></div>
  </header>
  <main>
    <section class="arena">
      <div class="stage">
        <canvas id="cv"></canvas>
        <div class="result" id="result" hidden></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="fight">FIGHT!</button>
        <label class="toggle"><input type="checkbox" id="autoFight"> Auto-fight</label>
        <label class="toggle"><input type="checkbox" id="autoBuy"> Auto-buy</label>
        <label class="toggle" title="After a win, go on to the next boss"><input type="checkbox" id="push"> Push on</label>
        <div class="speed" id="speed" role="group" aria-label="Fight speed">
          <button data-speed="1">1X</button><button data-speed="2">2X</button><button data-speed="4">4X</button>
        </div>
        <button class="btn" id="sound">SOUND ON</button>
      </div>
      <div class="stats" id="stats"></div>
    </section>
    <aside class="shop">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="upgrades">Upgrades</button>
        <button role="tab" data-tab="gear">Gear</button>
        <button role="tab" data-tab="bosses">Bosses</button>
      </nav>
      <div class="panel" id="panel"></div>
    </aside>
  </main>
</div>
<script>
// Game rules: bosses, upgrades, gear, combat and payouts. Shared by the game and balance.js,
// so the numbers the balance report checks are the numbers the game plays.

// Each boss's art is BOSS_ART[id] in sprites.js; colour tints the stage and the boss list.
const BOSSES = [
  { id: 'tung', name: 'Tung Tung Tung Sahur', color: '#c9935a' },
  { id: 'patapim', name: 'Brr Brr Patapim', color: '#3f9b3a' },
  { id: 'lirili', name: 'Lirilì Larilà', color: '#9a9aac' },
  { id: 'chimp', name: 'Chimpanzini Bananini', color: '#ffd93b' },
  { id: 'boneca', name: 'Boneca Ambalabu', color: '#6cc04a' },
  { id: 'trippi', name: 'Trippi Troppi', color: '#ff8a65' },
  { id: 'ballerina', name: 'Ballerina Cappuccina', color: '#ff8fc8' },
  { id: 'assassino', name: 'Cappuccino Assassino', color: '#8b5a3c' },
  { id: 'frigo', name: 'Frigo Camelo', color: '#b9e3ff' },
  { id: 'tralalero', name: 'Tralalero Tralala', color: '#5a8fc0' },
  { id: 'bombardiro', name: 'Bombardiro Crocodilo', color: '#6a7a5a' },
  { id: 'vaca', name: 'La Vaca Saturno Saturnita', color: '#f4d35e' },
];

// Upgrades add a flat amount per level and gear tiers multiply. Percentage stats approach a ceiling
// instead of hitting a hard cap: hard caps all filled in mid-game at once and the hero spiked far
// past the bosses (see balance.js).
const UPGRADES = [
  { id: 'sharpen', name: 'Sharpen', base: 15, growth: 1.13, show: l => '+' + 2 * l + ' base damage' },
  { id: 'vital', name: 'Vitality', base: 15, growth: 1.13, show: l => '+' + 30 * l + ' base HP' },
  { id: 'swift', name: 'Swiftness', base: 40, growth: 1.2, show: l => '+' + pct(0.05 * l) + ' attack speed' },
  { id: 'precision', name: 'Precision', base: 60, growth: 1.2, show: l => pct(critChance(l)) + ' crit chance' },
  { id: 'brutal', name: 'Brutality', base: 80, growth: 1.2, show: l => '×' + (2 + 0.15 * l).toFixed(2) + ' crit damage' },
  { id: 'plating', name: 'Plating', base: 50, growth: 1.2, show: l => pct(1 - 1 / (1 + 0.03 * l)) + ' damage taken off' },
  { id: 'footwork', name: 'Footwork', base: 70, growth: 1.2, show: l => pct(dodgeChance(l)) + ' dodge' },
  { id: 'regen', name: 'Second Wind', base: 90, growth: 1.2, show: l => pct(regenRate(l)) + ' HP regen per second' },
  { id: 'greed', name: 'Greed', base: 100, growth: 1.18, show: l => '+' + pct(0.1 * l) + ' gold' },
];
function critChance(l) { return 0.05 + 0.55 * (1 - 1 / (1 + 0.04 * l)); }
function dodgeChance(l) { return 0.4 * (1 - 1 / (1 + 0.03 * l)); }
function regenRate(l) { return 0.03 * (1 - 1 / (1 + 0.05 * l)); }

const GEAR = [
  { id: 'weapon', name: 'Weapon', mult: 3, stat: 'damage',
    tiers: ['Bare Fists', 'Rusty Sword', 'Iron Sword', 'Steel Blade', 'Runed Blade', 'Dragonfang', 'Starforged Edge', 'Godslayer'] },
  { id: 'armor', name: 'Armor', mult: 3, stat: 'max HP',
    tiers: ['Rags', 'Leather', 'Chainmail', 'Plate', 'Mithril', 'Dragonscale', 'Celestial Aegis', 'Unbreakable'] },
  { id: 'charm', name: 'Charm', base: 2000, mult: 1.4, stat: 'gold',
    tiers: ['Nothing', 'Lucky Coin', 'Silver Ring', 'Gold Amulet', 'Jeweled Crown', 'Midas Idol', 'Dragon Hoard', 'The Ledger'] },
];

const SLAM_EVERY = 6, SLAM_WINDUP = 1.2, SLAM_MULT = 3;
const ENRAGE_AT = 40;        // seconds; after this the boss hits harder every second, so every fight ends
const KILL_BONUS = 1.5;      // a kill pays this many times the boss's reward on top of the damage
const FIRST_KILL = 4;        // the first kill of each boss multiplies the kill bonus

// Growth per boss (HP, attack, reward), gear cost growth per tier, and the starting values.
// balance.js can override these. Reward is decoupled from HP on purpose: when gold scaled with
// boss HP, power outgrew every boss.
const TUNE = { hp: 5.4, atk: 5.4, reward: 4.8, gear: 7, charm: 8, gearBase: 100, hp0: 150, atk0: 5 };

function pct(x) { return Math.round(x * 1000) / 10 + '%'; }

const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  if (e >= SUFFIX.length) return n.toExponential(2).replace('+', '');
  const v = n / Math.pow(1000, e);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + SUFFIX[e];
}

function roman(n) {
  const r = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = '';
  for (const [v, c] of r) while (n >= v) { s += c; n -= v; }
  return s;
}

function bossInfo(i) {
  const b = BOSSES[i % BOSSES.length], lap = Math.floor(i / BOSSES.length);
  return {
    ...b, i, name: lap ? b.name + ' ' + roman(lap + 1) : b.name,
    hp: TUNE.hp0 * Math.pow(TUNE.hp, i), atk: TUNE.atk0 * Math.pow(TUNE.atk, i), interval: 1.6, reward: 75 * Math.pow(TUNE.reward, i),
  };
}

function newSave() {
  return { gold: 0, lv: {}, gear: { weapon: 0, armor: 0, charm: 0 }, boss: 0, unlocked: 0, best: [], kills: [],
    fights: 0, earned: 0, auto: { fight: false, buy: false, push: true }, speed: 1, sound: true };
}

function heroStats(s) {
  const L = id => s.lv[id] || 0, gear = GEAR.reduce((m, g) => (m[g.id] = Math.pow(g.mult, s.gear[g.id] || 0), m), {});
  return {
    dmg: (5 + 2 * L('sharpen')) * gear.weapon,
    aps: 1 + 0.05 * L('swift'),
    crit: critChance(L('precision')),
    critx: 2 + 0.15 * L('brutal'),
    hp: (100 + 30 * L('vital')) * gear.armor,
    armor: 1 - 1 / (1 + 0.03 * L('plating')),
    dodge: dodgeChance(L('footwork')),
    regen: regenRate(L('regen')),
    gold: (1 + 0.1 * L('greed')) * gear.charm,
  };
}

function newFight(s, i, rng) {
  const hero = heroStats(s), boss = bossInfo(i);
  return { t: 0, i, hero: { ...hero, cur: hero.hp }, boss: { ...boss, cur: boss.hp }, heroCd: 0.5, bossCd: 1.2,
    slamCd: SLAM_EVERY, windup: 0, furious: false, dealt: 0, done: false, won: false, rng: rng || Math.random };
}

// Advance a fight by dt seconds and return what happened, for the renderer to animate.
function step(f, dt) {
  const ev = [], h = f.hero, b = f.boss;
  if (f.done) return ev;
  f.t += dt;
  h.cur = Math.min(h.hp, h.cur + h.regen * h.hp * dt);
  f.heroCd -= dt;
  while (f.heroCd <= 0) {
    f.heroCd += 1 / h.aps;
    const crit = f.rng() < h.crit;
    const dmg = Math.min(b.cur, h.dmg * (crit ? h.critx : 1) * (0.9 + 0.2 * f.rng()));
    b.cur -= dmg; f.dealt += dmg;
    ev.push({ type: 'hit', dmg, crit });
    if (b.cur <= 0) { f.done = f.won = true; ev.push({ type: 'end' }); return ev; }
  }
  if (!f.furious && b.cur < b.hp / 2) { f.furious = true; ev.push({ type: 'fury' }); }
  const rage = f.t > ENRAGE_AT ? 1 + (f.t - ENRAGE_AT) / 4 : 1;
  if (f.windup > 0) {
    f.windup -= dt;
    if (f.windup <= 0) { f.slamCd = SLAM_EVERY; hitHero(f, b.atk * SLAM_MULT * rage, true, ev); }
  } else if ((f.slamCd -= dt) <= 0) {
    f.windup = SLAM_WINDUP; ev.push({ type: 'windup' });
  } else if ((f.bossCd -= dt * (f.furious ? 1.25 : 1)) <= 0) {
    f.bossCd += b.interval; hitHero(f, b.atk * rage, false, ev);
  }
  return ev;
}

function hitHero(f, raw, slam, ev) {
  const h = f.hero;
  if (f.rng() < h.dodge) { ev.push({ type: 'dodge', slam }); return; }
  const dmg = raw * (1 - h.armor);
  h.cur -= dmg; ev.push({ type: 'hurt', dmg, slam });
  if (h.cur <= 0) { h.cur = 0; f.done = true; ev.push({ type: 'end' }); }
}

// Gold for the share of the boss's HP taken off so far; the kill bonus only once it is down.
function payout(s, f) {
  const g = f.hero.gold * f.boss.reward, base = f.dealt / f.boss.hp * g;
  const kill = f.won ? g * KILL_BONUS : 0;
  const first = f.won && !s.kills[f.i] ? kill * (FIRST_KILL - 1) : 0;
  return { base, kill, first, total: base + kill + first };
}

function settle(s, f) {
  const p = payout(s, f);
  s.gold += p.total; s.earned += p.total; s.fights++;
  s.best[f.i] = Math.max(s.best[f.i] || 0, f.dealt);
  if (f.won) {
    s.kills[f.i] = (s.kills[f.i] || 0) + 1;
    s.unlocked = Math.max(s.unlocked, f.i + 1);
    if (s.auto.push && s.boss === f.i) s.boss = f.i + 1;
  }
  return p;
}

function tierName(g, t) { return t < g.tiers.length ? g.tiers[t] : g.tiers[g.tiers.length - 1] + ' +' + (t - g.tiers.length + 1); }

// Everything that can be bought right now, affordable or not.
function shopItems(s) {
  const up = UPGRADES.map(u => {
    const l = s.lv[u.id] || 0;
    return { kind: 'upgrade', id: u.id, def: u, level: l, cost: Math.ceil(u.base * Math.pow(u.growth, l)) };
  });
  const gear = GEAR.map(g => {
    const t = s.gear[g.id] || 0;
    return { kind: 'gear', id: g.id, def: g, level: t, cost: Math.ceil((g.base || TUNE.gearBase) * Math.pow(g.id === 'charm' ? TUNE.charm : TUNE.gear, t)) };
  });
  return up.concat(gear);
}

function buy(s, item) {
  if (s.gold < item.cost) return false;
  s.gold -= item.cost;
  if (item.kind === 'upgrade') s.lv[item.id] = item.level + 1; else s.gear[item.id] = item.level + 1;
  return true;
}

// Auto-buy: keep buying the cheapest thing until nothing is affordable.
function autoBuy(s) {
  const bought = [];
  for (;;) {
    const item = shopItems(s).filter(x => x.cost <= s.gold).sort((a, b) => a.cost - b.cost)[0];
    if (!item || !buy(s, item)) return bought;
    bought.push(item);
  }
}


// Pixel art. Every sprite is drawn with whole-pixel primitives into a small canvas, outlined, and
// scaled up without smoothing, so the arena stays crisp and chunky at any screen size.
// Art functions take (P, x, y, a): x is the sprite's centre, y the ground under its feet, and
// a = { t: seconds, wind: 0..1 slam wind-up, atk: 0..1 attack lunge, fury: below half HP }.

const OUTLINE = '#120818';

function pixels(g) {
  const P = {
    rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
    ell(cx, cy, rx, ry, c) {
      g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); rx = Math.round(rx); ry = Math.round(ry);
      for (let dy = -ry; dy <= ry; dy++) {
        const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - dy * dy / ((ry + 0.5) * (ry + 0.5)))));   // +0.5 avoids 1px nubs at the poles
        g.fillRect(cx - w, cy + dy, 2 * w + 1, 1);
      }
    },
    disc(cx, cy, r, c) { P.ell(cx, cy, r, r, c); },
    line(x0, y0, x1, y1, c, t = 1) {
      g.fillStyle = c;
      const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
      for (let i = 0; i <= n; i++) g.fillRect(Math.round(x0 + (x1 - x0) * i / n - t / 2), Math.round(y0 + (y1 - y0) * i / n - t / 2), t, t);
    },
    // A stick from (x, y) at angle th (0 = straight up, negative leans left); returns the far end.
    stick(x, y, th, len, c, t) { const ex = x + Math.sin(th) * len, ey = y - Math.cos(th) * len; P.line(x, y, ex, ey, c, t); return [ex, ey]; },
    // Ellipse outline; half -1 draws only the top half, 1 only the bottom.
    ring(cx, cy, rx, ry, c, t = 1, half = 0) {
      g.fillStyle = c;
      for (let k = 0; k < 160; k++) {
        const a = k / 160 * Math.PI * 2, s = Math.sin(a);
        if (half && Math.sign(s) !== half) continue;
        g.fillRect(Math.round(cx + Math.cos(a) * rx - t / 2), Math.round(cy + s * ry - t / 2), t, t);
      }
    },
    // A cartoon eye: white, with a pupil looking left toward the hero.
    eye(x, y, r, a, pupil) {
      P.disc(x, y, r, '#ffffff');
      const p = Math.max(1, Math.round(r * 0.6));
      P.rect(x - r + 1 - (r > 2 ? 0 : 1), y - Math.floor(p / 2), p, p + (r > 2 ? 1 : 0), pupil || (a && (a.fury || a.wind) ? '#e0102a' : '#140c1c'));
    },
    tri(x, y, w, h, c, dir = -1) {  // a spike pointing up (dir -1) or down (1), base centred on x
      for (let i = 0; i < h; i++) { const ww = Math.max(1, Math.round(w * (h - i) / h)); P.rect(x - ww / 2, y + dir * i, ww, 1, c); }
    },
  };
  return P;
}

const WEAPON_COLORS = ['#c9b79c', '#b07a4a', '#c8ccd4', '#e6eaf2', '#29e7ff', '#ff7a4a', '#ffe14d', '#ff2bd6'];
const ARMOR_COLORS = ['#8a7a68', '#8a5a34', '#9aa3ad', '#c9d1db', '#7fd3ff', '#39d98a', '#ffd76a', '#ffffff'];

// The hero faces right. swing 0..1 brings the sword down; tiers pick colours and sword length.
function drawHero(P, x, y, t, swing, wt, at) {
  const b = Math.round(Math.sin(t * 4) * 0.6), armor = ARMOR_COLORS[Math.min(at, 7)], blade = WEAPON_COLORS[Math.min(wt, 7)];
  P.rect(x - 9, y - 21 + b, 4, 13, '#d0306a');
  P.rect(x - 4, y - 8, 3, 8, '#2a2140'); P.rect(x + 1, y - 8, 3, 8, '#2a2140');
  P.rect(x - 5, y - 2, 4, 2, '#4a3a2a'); P.rect(x + 1, y - 2, 4, 2, '#4a3a2a');
  P.rect(x - 5, y - 19 + b, 10, 11, armor); P.rect(x - 5, y - 10 + b, 10, 2, '#5a3a20'); P.rect(x - 3, y - 17 + b, 2, 4, 'rgba(255,255,255,.35)');
  P.rect(x - 4, y - 27 + b, 8, 8, '#f2c9a0');
  P.rect(x - 5, y - 29 + b, 10, 5, armor); P.rect(x + 1, y - 24 + b, 2, 2, '#1a1222');
  if (at >= 3) P.rect(x - 1, y - 32 + b, 2, 3, '#ff2bd6');
  const th = 0.5 + swing * 1.9, len = 11 + Math.min(wt, 8);
  P.line(x + 3, y - 16 + b, x + 7, y - 14 + b, '#f2c9a0', 2);
  if (wt >= 4) P.stick(x + 7, y - 14 + b, th, len, 'rgba(255,255,255,.5)', 4);
  P.stick(x + 7, y - 14 + b, th, len, blade, 2);
  P.stick(x + 7, y - 14 + b, th + Math.PI / 2, 3, '#ffe14d', 1); P.stick(x + 7, y - 14 + b, th - Math.PI / 2, 3, '#ffe14d', 1);
}

// A sprite canvas with an outline pass: draw art into it, then stamp it onto the world buffer.
function makeSprite(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), sil = document.createElement('canvas'); sil.width = w; sil.height = h;
  const sg = sil.getContext('2d');
  return {
    c, g, P: pixels(g), ox: w / 2, oy: h - 4,
    clear() { g.clearRect(0, 0, w, h); },
    // Stamp onto dst with its origin at (x, y). tint paints the whole sprite a colour at that alpha.
    stamp(dst, x, y, tint, alpha, rot) {
      sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, w, h); sg.drawImage(c, 0, 0);
      sg.globalCompositeOperation = 'source-in'; sg.fillStyle = OUTLINE; sg.fillRect(0, 0, w, h);
      dst.save(); dst.translate(Math.round(x), Math.round(y)); if (rot) dst.rotate(rot);
      const dx = -this.ox, dy = -this.oy;
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) dst.drawImage(sil, dx + ox, dy + oy);
      dst.drawImage(c, dx, dy);
      if (tint) {
        sg.fillStyle = tint; sg.fillRect(0, 0, w, h);
        dst.globalAlpha = alpha; dst.drawImage(sil, dx, dy); dst.globalAlpha = 1;
      }
      dst.restore();
    },
  };
}

// Small portraits of each boss for the boss list, drawn once and cached.
const thumbs = {};
function bossThumb(id) {
  if (thumbs[id]) return thumbs[id];
  const s = makeSprite(96, 96), out = document.createElement('canvas');
  BOSS_ART[id](s.P, s.ox, s.oy, { t: 0, wind: 0, atk: 0, fury: false });
  out.width = 96; out.height = 96;
  const og = out.getContext('2d'); og.imageSmoothingEnabled = false;
  s.stamp(og, s.ox, s.oy);
  return (thumbs[id] = out.toDataURL());
}

// Chiptune sound effects from plain oscillators: no audio files. Rapid hits are throttled so 4×
// speed doesn't turn into noise.

const SFX = (() => {
  let ac = null, on = true;
  const last = {};
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    return ac;
  }
  function tone(freq, dur, type = 'square', vol = 0.05, slide = 1, delay = 0) {
    const a = on && audio(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.08) {
    const a = on && audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(), g = a.createGain(); g.gain.value = vol;
    src.buffer = b; src.connect(g).connect(a.destination); src.start();
  }
  const gate = (key, ms) => { const now = performance.now(); if (now - (last[key] || 0) < ms) return false; last[key] = now; return true; };
  return {
    setOn(v) { on = v; },
    unlock() { const a = audio(); if (a && a.state === 'suspended') a.resume(); },
    hit(crit) {
      if (!gate('hit', 70)) return;
      if (crit) { tone(880, 0.07, 'square', 0.05, 1.5); tone(1320, 0.08, 'square', 0.04, 1, 0.04); }
      else tone(200 + Math.random() * 60, 0.05, 'square', 0.04, 0.5);
    },
    hurt(slam) { if (slam) { noise(0.35, 0.12); tone(90, 0.35, 'square', 0.07, 0.4); } else if (gate('hurt', 80)) tone(150, 0.1, 'sawtooth', 0.04, 0.6); },
    dodge() { if (gate('dodge', 80)) tone(500, 0.08, 'triangle', 0.05, 2.2); },
    windup() { tone(110, SLAM_WINDUP, 'sawtooth', 0.035, 4); },
    coin() { if (gate('coin', 60)) { tone(988, 0.06, 'square', 0.04); tone(1319, 0.14, 'square', 0.04, 1, 0.06); } },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.3 : 0.1, 'square', 0.05, 1, i * 0.1)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.18, 'triangle', 0.06, 0.97, i * 0.16)); },
  };
})();

// Draws the arena. The world (stage, hero, boss, coins) is pixel art in a low-res buffer that is
// scaled up without smoothing; the HUD and floating numbers go on top at full resolution in a pixel
// font. It only reads the fight; the events from step() trigger the animations.

const BUF_H = 128, GROUND = 104;
const FONT = '"Press Start 2P", monospace';

function makeView(canvas) {
  const ctx = canvas.getContext('2d');
  const buf = document.createElement('canvas'), g = buf.getContext('2d'), P = pixels(g);
  const heroS = makeSprite(64, 48), bossS = makeSprite(112, 112);
  const v = { W: 0, H: 0, bw: 0, scale: 1, particles: [], texts: [], shake: 0, swing: 0, heroFlash: 0, bossFlash: 0,
    bossAtk: 0, windup: 0, slamRing: 0, clock: 0, deadAt: null, ridge: [], stars: [] };

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    v.W = r.width; v.H = r.height; v.scale = r.height / BUF_H;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    v.bw = buf.width = Math.max(64, Math.round(BUF_H * r.width / Math.max(1, r.height)));
    buf.height = BUF_H;
    // a fixed mountain ridge and starfield for this width
    v.ridge = Array.from({ length: v.bw }, (_, x) => Math.round(7 + 5 * Math.sin(x * 0.07) + 3 * Math.sin(x * 0.19 + 1) + 2 * Math.sin(x * 0.43)));
    v.stars = Array.from({ length: Math.round(v.bw / 4) }, (_, k) => [(k * 97) % v.bw, (k * 53) % (GROUND - 30), k % 5]);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  const hx = () => Math.round(v.bw * 0.26), bx = () => Math.round(v.bw * 0.68);

  function text(x, y, str, color, size, vy) {
    v.texts.push({ x, y, str, color, size, vy: vy || -22, life: 1 });
    if (v.texts.length > 40) v.texts.shift();
  }
  function burst(x, y, n, colors, speed) {
    for (let k = 0; k < n && v.particles.length < 220; k++) {
      const an = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random());
      v.particles.push({ x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - speed * 0.6, life: 1.2 + Math.random() * 0.6, c: colors[k % colors.length], coin: false });
    }
  }

  // React to fight events with animation.
  v.event = (e, f) => {
    if (e.type === 'hit') {
      v.swing = 1; v.bossFlash = 0.08;
      text(bx() + (Math.random() - 0.5) * 24, GROUND - 74, (e.crit ? 'CRIT ' : '') + fmt(e.dmg), e.crit ? '#ffe14d' : '#ffffff', e.crit ? 1.5 : 1);
      const n = e.crit ? 4 : 1 + (Math.random() < 0.5);
      for (let k = 0; k < n && v.particles.length < 220; k++) {
        v.particles.push({ x: bx() - 10, y: GROUND - 40, vx: -(12 + Math.random() * 40), vy: -(40 + Math.random() * 50), life: 1.6, coin: true });
      }
      if (f.done && f.won) burst(bx(), GROUND - 36, 60, [f.boss.color, '#ffffff', '#ffe14d', '#ff2bd6'], 70);
    } else if (e.type === 'hurt') {
      v.heroFlash = 0.15; v.bossAtk = 1;
      if (e.slam) { v.shake = 0.35; v.slamRing = 1; }
      text(hx(), GROUND - 38, '-' + fmt(e.dmg), '#ff3b5c', e.slam ? 1.4 : 0.9);
    } else if (e.type === 'dodge') {
      v.bossAtk = 1; if (e.slam) v.slamRing = 1;
      text(hx(), GROUND - 38, 'DODGE', '#29e7ff', 0.9);
    } else if (e.type === 'windup') {
      v.windup = SLAM_WINDUP;
    } else if (e.type === 'fury') {
      text(bx(), GROUND - 86, 'ENRAGED!', '#ff3b5c', 1.1, -10);
    }
  };

  v.reset = () => { v.particles.length = 0; v.texts.length = 0; v.windup = 0; v.swing = 0; v.bossAtk = 0; };

  function stage(boss) {
    const bw = v.bw;
    const bands = ['#0b0420', '#140630', '#1f0a40', '#2c0d4e', '#3d1058', '#55135e'];
    bands.forEach((c, k) => P.rect(0, k * GROUND / bands.length, bw, GROUND / bands.length + 1, mix(c, boss.color, 0.12)));
    for (const [x, y, k] of v.stars) if (Math.sin(v.clock * (1 + k) + x) > -0.6) P.rect(x, y, 1, 1, k ? '#b8a8ff' : '#ffffff');
    // the striped synthwave sun, sinking into the horizon
    const sx = Math.round(bw * 0.47), sy = GROUND - 8, r = 30;
    for (let dy = -r; dy <= 0 && sy + dy < GROUND; dy++) {
      const row = sy + dy, gap = dy > -16 ? Math.floor((dy + 16) / 4) + 1 : 0;
      if (gap && (row % 5) < gap) continue;
      const w = Math.round(Math.sqrt(r * r - dy * dy));
      P.rect(sx - w, row, 2 * w + 1, 1, mix('#ffe14d', '#ff2bd6', (dy + r) / r));
    }
    for (let x = 0; x < bw; x++) P.rect(x, GROUND - v.ridge[x], 1, v.ridge[x], '#24093d');
    P.rect(0, GROUND, bw, BUF_H - GROUND, '#0d0418');
    // perspective grid scrolling toward the viewer
    const vx = bw / 2, scroll = (v.clock * 0.5) % 1;
    for (let k = 0; k < 7; k++) { const y = GROUND + Math.round(Math.pow((k + scroll) / 6, 2) * (BUF_H - GROUND)); P.rect(0, y, bw, 1, '#5a1478'); }
    for (let i = -14; i <= 14; i++) P.line(vx + i * 4, GROUND, vx + i * 34, BUF_H + 4, '#5a1478');
    P.rect(0, GROUND, bw, 1, '#ff2bd6');
  }

  function bar(x, y, w, h, frac, color, label, right, marker) {
    const fs = fit(label, w * 0.62, Math.max(7, Math.round(v.scale * 3.6)));
    ctx.font = fs + 'px ' + FONT; ctx.textBaseline = 'bottom'; ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
    ctx.fillText(label, x, y - 4);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffe14d'; ctx.font = Math.max(7, Math.round(v.scale * 3.6)) + 'px ' + FONT;
    ctx.fillText(right, x + w, y - 4);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#000000'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), h);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    const seg = Math.max(6, Math.round(h * 0.7));
    for (let sx = x + seg; sx < x + w; sx += seg) ctx.fillRect(sx, y, 2, h);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y, w, 2);
    if (marker != null && marker > 0 && marker < 1) { ctx.fillStyle = '#ffe14d'; ctx.fillRect(x + Math.round(w * marker) - 1, y - 5, 3, h + 10); }
  }
  // Largest font size (down to 6px) at which str fits in width.
  function fit(str, width, size) {
    for (; size > 6; size--) { ctx.font = size + 'px ' + FONT; if (ctx.measureText(str).width <= width) break; }
    return size;
  }

  v.draw = (dt, f, s, boss) => {
    v.clock += dt;
    v.swing = Math.max(0, v.swing - dt * 5); v.heroFlash -= dt; v.bossFlash -= dt; v.bossAtk = Math.max(0, v.bossAtk - dt * 4);
    v.shake = Math.max(0, v.shake - dt); v.slamRing = Math.max(0, v.slamRing - dt * 1.8);
    if (v.windup > 0) v.windup -= dt;
    if (f && f.done && f.won && v.deadAt == null) v.deadAt = v.clock;
    if (!f || !f.done) v.deadAt = null;

    g.imageSmoothingEnabled = false;
    stage(boss);
    const H = hx(), B = bx(), wind = v.windup > 0 ? 1 - v.windup / SLAM_WINDUP : 0;
    P.ell(H, GROUND + 1, 9, 2, '#05010c'); if (boss.id !== 'bombardiro') P.ell(B, GROUND + 1, 20, 3, '#05010c');
    if (v.slamRing) P.ring(B - (1 - v.slamRing) * (B - H), GROUND + 1, 6 + (1 - v.slamRing) * 30, 2 + (1 - v.slamRing) * 3, '#ff3b5c', 1);

    // boss: blinks out when killed, flashes red while winding up a slam
    const sinceDeath = v.deadAt == null ? 0 : v.clock - v.deadAt;
    if (sinceDeath < 0.7 && !(sinceDeath > 0 && Math.floor(sinceDeath * 16) % 2)) {
      bossS.clear();
      BOSS_ART[boss.id](bossS.P, bossS.ox, bossS.oy, { t: v.clock, wind, atk: v.bossAtk, fury: !!(f && f.furious) });
      const jitter = wind ? Math.round((Math.random() - 0.5) * 2) : 0, lunge = -Math.round(Math.sin(Math.PI * v.bossAtk) * 6);
      const red = wind && Math.floor(v.clock * 12) % 2;
      bossS.stamp(g, B + lunge + jitter, GROUND, v.bossFlash > 0 ? '#ffffff' : red ? '#ff3b5c' : null, v.bossFlash > 0 ? 0.6 : 0.45);
    }
    // hero: lunges on each swing, falls over when knocked out
    heroS.clear();
    const dead = f && f.done && !f.won;
    drawHero(heroS.P, heroS.ox, heroS.oy, dead ? 0 : v.clock, v.swing, s.gear.weapon || 0, s.gear.armor || 0);
    heroS.stamp(g, H + Math.round(Math.sin(Math.PI * v.swing) * 8) - (dead ? 14 : 0), GROUND - (dead ? 2 : 0), v.heroFlash > 0 ? '#ff3b5c' : null, 0.6, dead ? -Math.PI / 2 : 0);

    for (const p of v.particles) {
      p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.y > GROUND) { p.y = GROUND; p.vy *= -0.4; p.vx *= 0.6; }
      if (p.coin) { P.rect(p.x - 1, p.y - 2, 3, 3, '#ffe14d'); P.rect(p.x - 1, p.y - 2, 1, 1, '#fff8c0'); }
      else P.rect(p.x, p.y - 1, 2, 2, p.c);
    }
    v.particles = v.particles.filter(p => p.life > 0);

    // blow the buffer up to the screen, then draw text crisp at full size
    const sh = v.shake ? Math.round((Math.random() - 0.5) * 4 * v.shake / 0.35) : 0;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, v.W, v.H);
    ctx.drawImage(buf, sh * v.scale, sh * v.scale * 0.5, v.W, v.H);

    const k = v.W / v.bw;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const t of v.texts) {
      t.y += t.vy * dt; t.life -= dt * 0.9;
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 2));
      ctx.font = Math.round(Math.max(8, v.scale * 4.5) * t.size) + 'px ' + FONT;
      ctx.lineWidth = Math.max(3, v.scale * 1.2); ctx.strokeStyle = '#000';
      ctx.strokeText(t.str, Math.round(t.x) * k, Math.round(t.y) * v.scale);
      ctx.fillStyle = t.color; ctx.fillText(t.str, Math.round(t.x) * k, Math.round(t.y) * v.scale);
    }
    v.texts = v.texts.filter(t => t.life > 0);
    ctx.globalAlpha = 1;

    // HUD: hero bar left, boss bar right with your best damage marked
    const fs = Math.max(7, Math.round(v.scale * 3.6)), pad = Math.max(10, Math.round(v.scale * 4)), bh = Math.max(10, Math.round(v.scale * 4.5));
    const top = pad + fs + 6, w = (v.W - pad * 3) / 2;
    const hero = f ? f.hero : heroStats(s), hcur = f ? f.hero.cur : hero.hp;
    bar(pad, top, w, bh, hcur / hero.hp, '#39ff88', 'HERO', fmt(hcur));
    const bcur = f ? f.boss.cur : boss.hp, best = s.best[boss.i] || 0;
    bar(pad * 2 + w, top, w, bh, bcur / boss.hp, '#ff3b5c', boss.name.toUpperCase(), fmt(bcur), best ? 1 - best / boss.hp : null);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const y2 = top + bh + pad * 0.8;
    if (f) {
      ctx.font = Math.round(fs * 1.9) + 'px ' + FONT; ctx.fillStyle = '#ffe14d';
      ctx.lineWidth = 4; ctx.strokeStyle = '#000'; const gold = '+' + fmt(payout(s, f).base);
      ctx.strokeText(gold, v.W / 2, y2); ctx.fillText(gold, v.W / 2, y2);
      const rage = f.t > ENRAGE_AT;
      ctx.font = fs + 'px ' + FONT;
      ctx.fillStyle = rage ? (Math.floor(v.clock * 4) % 2 ? '#ff3b5c' : '#ffffff') : '#29e7ff';
      ctx.fillText(rage ? 'ENRAGE!' : 'TIME ' + f.t.toFixed(1), v.W / 2, y2 + fs * 2.6);
    } else {
      const first = !s.kills[boss.i], kill = boss.reward * heroStats(s).gold * (1 + KILL_BONUS * (first ? FIRST_KILL : 1));
      ctx.font = fs + 'px ' + FONT; ctx.fillStyle = '#29e7ff';
      ctx.fillText('STAGE ' + (boss.i + 1), v.W / 2, y2);
      ctx.fillStyle = '#ffe14d'; ctx.font = fit((first ? 'FIRST ' : '') + 'KILL PAYS ' + fmt(kill), v.W - pad * 2, fs) + 'px ' + FONT;
      ctx.fillText((first ? 'FIRST ' : '') + 'KILL PAYS ' + fmt(kill), v.W / 2, y2 + fs * 1.8);
      if (Math.floor(v.clock * 2) % 2) { ctx.fillStyle = '#ffffff'; ctx.font = fs + 'px ' + FONT; ctx.fillText('PRESS FIGHT', v.W / 2, y2 + fs * 3.6); }
    }
  };
  return v;
}

function mix(a, b, t) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return 'rgb(' + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t)).join(',') + ')';
}

// The page: save/load, the fight loop, the shop and the result card.

const SAVE_KEY = 'bossrush-save';
const STEP = 1 / 30;          // fixed sim step, the same one balance.js uses
const AUTO_DELAY = 2.2;       // seconds the result card stays up before auto-fight starts the next one

const $ = id => document.getElementById(id);
let save = load(), fight = null, result = null, tab = 'upgrades', acc = 0, last = performance.now(), saved = 0;
const view = makeView($('cv'));

function load() {
  const fresh = newSave();
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s) return { ...fresh, ...s, lv: { ...s.lv }, gear: { ...fresh.gear, ...s.gear }, auto: { ...fresh.auto, ...s.auto } };
  } catch (e) {}
  return fresh;
}
function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} saved = 0; }

function startFight() {
  if (fight && !fight.done) return;
  const bought = save.auto.buy ? autoBuy(save) : [];
  fight = newFight(save, save.boss); result = null; acc = 0;
  fight.bought = bought;
  view.reset(); $('result').hidden = true;
  refresh(true);
}

function finish() {
  const before = save.boss;
  (fight.won ? SFX.win : SFX.lose)();
  result = { p: settle(save, fight), won: fight.won, i: fight.i, dealt: fight.dealt, hp: fight.boss.hp, bought: fight.bought, wait: AUTO_DELAY, pushed: save.boss !== before };
  store();
  showResult();
  refresh(true);
}

function showResult() {
  const r = result, b = bossInfo(r.i), el = $('result');
  const group = items => {
    const m = new Map(); for (const x of items) { const k = x.kind === 'gear' ? tierName(x.def, x.level + 1) : x.def.name; m.set(k, (m.get(k) || 0) + 1); }
    return [...m].map(([k, n]) => n > 1 ? k + ' ×' + n : k).join(', ');
  };
  el.innerHTML = `<div class="card">
    <h2 class="${r.won ? 'win' : 'loss'}">${r.won ? 'YOU WIN!' : 'K.O.'}</h2>
    <div class="sub">${b.name} · ${fmt(r.dealt)} damage (${r.dealt / r.hp < 0.01 ? '<1' : Math.round(r.dealt / r.hp * 100)}% of its HP)</div>
    <div class="lines">
      <div><span>Damage payout</span><span>+${fmt(r.p.base)}</span></div>
      ${r.won ? `<div><span>Kill bonus</span><span>+${fmt(r.p.kill)}</span></div>` : ''}
      ${r.p.first ? `<div class="jackpot"><span>First kill ×${FIRST_KILL}</span><span>+${fmt(r.p.first)}</span></div>` : ''}
    </div>
    <div class="total"><span>Total</span><b id="countup">0</b></div>
    ${r.bought && r.bought.length ? `<div class="bought">Auto-bought before this fight: ${group(r.bought)}</div>` : ''}
    <div class="row">
      ${r.won && !r.pushed && save.unlocked > r.i ? `<button class="btn" data-act="nextboss">Next boss →</button>` : ''}
      <button class="btn primary" data-act="again">${r.pushed ? 'Fight ' + bossInfo(save.boss).name : 'Fight again'}</button>
    </div>
    <div class="next" id="nextIn"></div>
  </div>`;
  el.hidden = false;
  r.shown = 0;
}

$('result').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'nextboss') { save.boss = Math.min(save.unlocked, result.i + 1); startFight(); }
  if (act === 'again') startFight();
});

// Shop ---------------------------------------------------------------------------------------

function shopRows() {
  const items = shopItems(save);
  if (tab === 'upgrades') return items.filter(x => x.kind === 'upgrade').map(x => ({
    key: x.id, cls: 'item', name: x.def.name, level: 'Lv ' + x.level, fx: x.def.show(x.level) + ' → ' + x.def.show(x.level + 1).split(' ')[0], item: x }));
  if (tab === 'gear') return items.filter(x => x.kind === 'gear').map(x => ({
    key: x.id, cls: 'item gear', name: tierName(x.def, x.level), level: x.def.name,
    fx: 'Next: ' + tierName(x.def, x.level + 1) + ' (×' + x.def.mult + ' ' + x.def.stat + ')', item: x }));
  return null;
}

function renderPanel() {
  const panel = $('panel');
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  if (tab === 'bosses') {
    let html = '';
    for (let i = 0; i <= save.unlocked; i++) {
      const b = bossInfo(i), best = Math.min(1, (save.best[i] || 0) / b.hp), kills = save.kills[i] || 0;
      html += `<button class="boss" data-boss="${i}" aria-current="${i === save.boss}">
        <img class="dot" alt="" src="${bossThumb(b.id)}" style="background:${b.color}33">
        <span><b>${i + 1}. ${b.name}</b><div class="meta">${fmt(b.hp)} HP · hits for ${fmt(b.atk)}</div><div class="bar"><i style="width:${best * 100}%"></i></div></span>
        <span class="tag">${kills ? '✓ ' + kills : best ? Math.round(best * 100) + '%' : ''}</span></button>`;
    }
    html += `<div class="foot"><span>${save.fights} fights · ${fmt(save.earned)} earned</span><button class="btn" data-act="reset">Reset save</button></div>`;
    panel.innerHTML = html;
    return;
  }
  panel.innerHTML = shopRows().map(r => `<div class="${r.cls}" data-key="${r.key}">
    <div class="name">${r.name}<em>${r.level}</em></div><div class="fx">${r.fx}</div>
    <button class="btn" data-buy="${r.key}"><span class="coin"></span><span class="cost"></span></button></div>`).join('');
  updatePanel();
}

// Cheap per-frame update: costs, levels and which buttons are affordable.
function updatePanel() {
  const rows = shopRows();
  if (!rows) return;
  for (const r of rows) {
    const el = $('panel').querySelector(`[data-key="${r.key}"]`);
    if (!el) continue;
    el.querySelector('.name').innerHTML = r.name + '<em>' + r.level + '</em>';
    el.querySelector('.fx').textContent = r.fx;
    el.querySelector('.cost').textContent = fmt(r.item.cost);
    el.querySelector('.btn').disabled = save.gold < r.item.cost;
  }
}

$('panel').addEventListener('click', e => {
  const buyKey = e.target.closest('[data-buy]')?.dataset.buy;
  if (buyKey) {
    const item = shopItems(save).find(x => x.id === buyKey);
    if (item && buy(save, item)) { SFX.coin(); store(); refresh(); }
    return;
  }
  const bossEl = e.target.closest('[data-boss]');
  if (bossEl) { save.boss = +bossEl.dataset.boss; store(); renderPanel(); if (!fight || fight.done) { fight = null; $('result').hidden = true; } return; }
  if (e.target.closest('[data-act="reset"]') && confirm('Wipe all progress and start over?')) {
    save = newSave(); fight = null; result = null; $('result').hidden = true; store(); syncControls(); refresh(true);
  }
});

document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; renderPanel(); }
});

// Controls and stats -------------------------------------------------------------------------

function syncControls() {
  $('autoFight').checked = save.auto.fight; $('autoBuy').checked = save.auto.buy; $('push').checked = save.auto.push;
  document.querySelectorAll('#speed button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.speed === save.speed));
  $('sound').textContent = save.sound ? 'SOUND ON' : 'SOUND OFF'; $('sound').setAttribute('aria-pressed', save.sound);
  SFX.setOn(save.sound);
}
$('sound').addEventListener('click', () => { save.sound = !save.sound; store(); syncControls(); });
document.addEventListener('pointerdown', SFX.unlock);
$('fight').addEventListener('click', startFight);
for (const [id, key] of [['autoFight', 'fight'], ['autoBuy', 'buy'], ['push', 'push']]) {
  $(id).addEventListener('change', e => { save.auto[key] = e.target.checked; store(); if (key === 'fight' && e.target.checked && (!fight || fight.done)) startFight(); });
}
$('speed').addEventListener('click', e => { const b = e.target.closest('[data-speed]'); if (b) { save.speed = +b.dataset.speed; store(); syncControls(); } });

function renderStats() {
  const h = heroStats(save), dps = h.dmg * h.aps * (1 + h.crit * (h.critx - 1));
  const stats = [['Damage', fmt(h.dmg)], ['Attacks/s', h.aps.toFixed(2)], ['Crit', pct(h.crit) + ' ×' + h.critx.toFixed(2)], ['DPS', fmt(dps)],
    ['Max HP', fmt(h.hp)], ['Damage taken', '−' + pct(h.armor)], ['Dodge', pct(h.dodge)], ['Gold', '×' + h.gold.toFixed(2)]];
  $('stats').innerHTML = stats.map(([k, v]) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('');
}

let panelBoss = -1;
function refresh(full) {
  $('gold').textContent = fmt(save.gold);
  $('earned').textContent = fight && !fight.done ? '+' + fmt(payout(save, fight).base) : '';
  $('fight').disabled = !!(fight && !fight.done);
  if (full || tab === 'bosses' && panelBoss !== save.boss) { renderPanel(); panelBoss = save.boss; } else updatePanel();
  renderStats();
}

function sound(e) {
  if (e.type === 'hit') SFX.hit(e.crit);
  else if (e.type === 'hurt') SFX.hurt(e.slam);
  else if (e.type === 'dodge') SFX.dodge();
  else if (e.type === 'windup') SFX.windup();
}

// Main loop ----------------------------------------------------------------------------------

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (fight && !fight.done) {
    acc += dt * save.speed;
    while (acc >= STEP && !fight.done) {
      acc -= STEP;
      for (const e of step(fight, STEP)) { view.event(e, fight); sound(e); }
    }
    if (fight.done) finish();
    $('earned').textContent = fight.done ? '' : '+' + fmt(payout(save, fight).base);
  }
  if (result) {
    // count the payout up, then (with auto-fight on) start the next fight
    const el = $('countup');
    if (el && result.shown < 1) { result.shown = Math.min(1, result.shown + dt * 1.6); el.textContent = fmt(result.p.total * (1 - Math.pow(1 - result.shown, 3))); }
    if (save.auto.fight) {
      result.wait -= dt;
      const n = $('nextIn'); if (n) n.textContent = 'CONTINUE? ' + Math.max(0, Math.ceil(result.wait));
      if (result.wait <= 0) startFight();
    }
  }
  view.draw(dt * (fight && !fight.done ? save.speed : 1), fight, save, fight ? fight.boss : bossInfo(save.boss));
  if ((saved += dt) > 5) store();
  requestAnimationFrame(frame);
}

syncControls(); refresh(true);
if (save.auto.fight) startFight();
requestAnimationFrame(frame);

</script>
</body>
</html>
